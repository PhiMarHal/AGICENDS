# Cloudflare Worker deployment config.
# Documentation: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "agiscends-auth"
main = "index.js"
compatibility_date = "2025-09-01"
# (You can bump compatibility_date later for newer runtime features; it doesn't
# need to match today's date — it pins the Worker to a known runtime version.)

# Required for Account-scoped API tokens. Without this, wrangler tries to
# auto-discover the account via /memberships, which fails for account tokens
# (that endpoint requires a user-scoped token). Not a secret — account IDs
# appear in dashboard URLs.
account_id = "f08d5cd157fc7b58c7a2b3bb5c238bab"

# ── D1 database binding ────────────────────────────────────────────────────
# Run `wrangler d1 create agiscends` and paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "agiscends"
database_id = "f30ade41-8522-429d-a1c1-6d171f9d7547"

# ── KV namespace for short-lived state ─────────────────────────────────────
# Stores SIWE nonces (issued by /auth/wallet/nonce, consumed by /verify) and
# wallet claim tickets (issued by /verify for new identities, consumed by
# /auth/wallet/claim). Items have short TTLs (10 min) and never grow
# unbounded. Also reserved for any rate-limit counters we add later.
# Run `wrangler kv namespace create AUTH_KV` and paste the returned id below.
[[kv_namespaces]]
binding = "AUTH_KV"
id = "7b1fe26978454b47a8d4d7751499dc67"

# ── Public (non-secret) env vars ───────────────────────────────────────────
# Secrets (JWT_SECRET, GAME_SERVER_SHARED_SECRET) are NEVER put here — set
# them with `wrangler secret put NAME`.
[vars]
# Comma-separated origins allowed to call the Worker from a browser. Add
# your real domain when you have one. localhost:2567 is the game's dev port.
ALLOWED_ORIGINS = "http://localhost:2567,http://192.168.1.11:2567"

# Flip to "false" to stop new bespoke (username+password) signups while
# leaving existing accounts working. Useful if bot signups appear.
BESPOKE_SIGNUPS_OPEN = "true"

# The Worker's own public URL — currently informational only. Reserved for
# any future provider that needs to construct absolute callback URLs.
# Sign In With Ethereum doesn't need it (no redirects).
WORKER_PUBLIC_URL = "https://agiscends-auth.philoiyaa.workers.dev"