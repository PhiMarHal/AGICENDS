<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHARACTER · LAB — agiscends experimental</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --fg: #f1f1f1;
            --dim: #525252;
            --dim2: #8a8a8a;
            --line: #222;
            --line-hi: #383838;
            --stage-bg: #ffffff;
            --accent: #fff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse at center top, #161616 0%, transparent 55%),
                radial-gradient(circle, #1a1a1a 1.5px, transparent 1.5px);
            background-size: auto, 26px 26px;
            background-position: center top, center;
            background-repeat: no-repeat, repeat;
            color: var(--fg);
            font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            min-height: 100vh;
            padding: 30px 18px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* HEADER ------------------------------------------------------------------ */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .marks {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-size: 9.5px;
            color: var(--dim2);
            letter-spacing: 0.45em;
            margin-bottom: 10px;
        }

        .header .marks .dot {
            width: 6px;
            height: 6px;
            background: var(--fg);
            border-radius: 50%;
            animation: pulse 2.4s infinite ease-in-out;
        }

        .header .marks .dot.b {
            animation-delay: 1.2s;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.25;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        .header h1 {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.46em;
            padding-left: 0.46em;
        }

        .header .sub {
            font-size: 9.5px;
            color: var(--dim2);
            margin-top: 9px;
            letter-spacing: 0.4em;
        }

        /* STAGE ------------------------------------------------------------------- */
        .stage-wrap {
            position: relative;
            width: min(380px, 92vw);
            aspect-ratio: 1;
            margin-bottom: 10px;
        }

        .stage {
            position: absolute;
            inset: 0;
            background: var(--stage-bg);
            cursor: pointer;
            overflow: hidden;
        }

        .stage svg {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: block;
        }

        .stage-floor {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            width: 58%;
            height: 18px;
            background: radial-gradient(ellipse, rgba(0, 0, 0, 0.13), transparent 70%);
            pointer-events: none;
            border-radius: 50%;
            z-index: 0;
        }

        .bracket {
            position: absolute;
            width: 14px;
            height: 14px;
            border: 1px solid var(--dim);
            pointer-events: none;
            z-index: 2;
        }

        .bracket.tl {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }

        .bracket.tr {
            top: -1px;
            right: -1px;
            border-left: none;
            border-bottom: none;
        }

        .bracket.bl {
            bottom: -1px;
            left: -1px;
            border-right: none;
            border-top: none;
        }

        .bracket.br {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }

        .stage .scan-line {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.18) 48%, rgba(0, 0, 0, 0.32) 50%, rgba(0, 0, 0, 0.18) 52%, transparent 100%);
        }

        .stage.scan .scan-line {
            animation: scanLine 0.55s ease-out;
        }

        @keyframes scanLine {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(100%);
                opacity: 0;
            }
        }

        .helper {
            font-size: 9.5px;
            color: var(--dim2);
            letter-spacing: 0.32em;
            margin: 6px 0 22px;
            text-align: center;
        }

        /* CONTROLS ---------------------------------------------------------------- */
        .controls {
            width: min(440px, 100%);
            display: flex;
            flex-direction: column;
        }

        .row {
            display: grid;
            grid-template-columns: 82px 1fr 60px;
            align-items: stretch;
            height: 42px;
            border-top: 1px solid var(--line);
        }

        .row:last-child {
            border-bottom: 1px solid var(--line);
        }

        .row .label {
            display: flex;
            align-items: center;
            padding-left: 4px;
            font-size: 10.5px;
            letter-spacing: 0.32em;
            color: var(--dim2);
        }

        .row .picker {
            display: grid;
            grid-template-columns: 38px 1fr 38px;
            align-items: stretch;
            height: 100%;
        }

        .row .picker .arrow {
            background: transparent;
            border: none;
            color: var(--dim2);
            cursor: pointer;
            font: inherit;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.12s ease, background 0.12s ease;
        }

        .row .picker .arrow:hover {
            color: var(--accent);
            background: var(--line);
        }

        .row .picker .arrow:active {
            background: var(--fg);
            color: var(--bg);
        }

        .row .value {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.2em;
            transition: opacity 0.15s ease;
        }

        .row .value.changing {
            opacity: 0.35;
        }

        .row .idx {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 6px;
            font-size: 10px;
            color: var(--dim);
            letter-spacing: 0.06em;
            font-variant-numeric: tabular-nums;
        }

        /* ACTIONS ----------------------------------------------------------------- */
        .actions {
            display: flex;
            gap: 8px;
            margin-top: 24px;
        }

        .actions button {
            background: transparent;
            border: 1px solid var(--line-hi);
            color: var(--fg);
            font: inherit;
            font-size: 11px;
            letter-spacing: 0.3em;
            padding: 12px 22px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .actions button:hover {
            background: var(--fg);
            color: var(--bg);
            border-color: var(--fg);
        }

        .actions button:active {
            transform: translateY(1px);
        }

        /* TOAST ------------------------------------------------------------------- */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: var(--fg);
            color: var(--bg);
            padding: 10px 24px;
            font-size: 10.5px;
            letter-spacing: 0.3em;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            z-index: 50;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .footer {
            position: fixed;
            bottom: 10px;
            right: 12px;
            font-size: 9px;
            color: var(--dim);
            letter-spacing: 0.3em;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            body {
                padding-top: 22px;
            }

            .header h1 {
                font-size: 16px;
                letter-spacing: 0.4em;
                padding-left: 0.4em;
            }

            .header .sub {
                font-size: 9px;
            }

            .row {
                grid-template-columns: 68px 1fr 52px;
                height: 40px;
            }

            .row .label {
                font-size: 9.5px;
                letter-spacing: 0.26em;
            }

            .row .value {
                font-size: 12px;
                letter-spacing: 0.16em;
            }

            .actions button {
                padding: 11px 16px;
                font-size: 10.5px;
                letter-spacing: 0.24em;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="marks">
            <span class="dot"></span>
            <span>EXPERIMENTAL · v0.2</span>
            <span class="dot b"></span>
        </div>
        <h1>CHARACTER · LAB</h1>
        <div class="sub">agiscends / morphology bench</div>
    </div>

    <div class="stage-wrap">
        <span class="bracket tl"></span>
        <span class="bracket tr"></span>
        <span class="bracket bl"></span>
        <span class="bracket br"></span>
        <div class="stage" id="stage">
            <div class="stage-floor"></div>
            <svg id="char-svg" viewBox="-160 -160 320 320" xmlns="http://www.w3.org/2000/svg"
                preserveAspectRatio="xMidYMid meet">
                <g id="char-group"></g>
            </svg>
            <div class="scan-line"></div>
        </div>
    </div>

    <div class="helper">CLICK TO JUMP · MOVE CURSOR TO LOOK</div>

    <div class="controls" id="controls"></div>

    <div class="actions">
        <button id="btn-random">RANDOMIZE</button>
        <button id="btn-export">EXPORT JSON</button>
    </div>

    <div class="toast" id="toast"></div>
    <div class="footer">SPEC · v0.2</div>

    <script>
        /* =============================================================================
         * AGISCENDS · CHARACTER LAB
         * -----------------------------------------------------------------------------
         * v0.2 — proportions now match the game (body radius 100 in viewBox units;
         * eye position ±67; eye dims 116×80 — same ratios as the game's 30/24/42/29).
         * Eye-socket movement + pupil movement are split, matching playFlapJuice's
         * sample.vx/40 + half-additional-pupil scheme.
         *
         * Integration sketch (Phaser side, future):
         *   1. Persist `state` per player on the server (5 small string fields).
         *   2. Re-implement each part's render() using Phaser Graphics primitives.
         *      Coordinates here live in a 320×320 viewBox centered on (0,0) with
         *      body radius 100 — multiply by (game-body-r / 100) ≈ 0.30 to map to
         *      game-space.
         *   3. Eye-tracking + squeeze logic in `tick()` mirrors the game's existing
         *      per-frame visual update; vx/vy → mouseDir is the only swap.
         * ============================================================================= */

        // ---- helpers ---------------------------------------------------------------
        function $(sel) { return document.querySelector(sel); }
        function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function rand(lo, hi) { return lo + Math.random() * (hi - lo); }
        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
        function easeOutElastic(t) {
            if (t === 0 || t === 1) return t;
            const c4 = (2 * Math.PI) / 3;
            return Math.pow(2, -8 * t) * Math.sin((t * 8 - 0.75) * c4) + 1;
        }

        function starPath(cx, cy, outerR, innerR, points) {
            let path = '';
            for (let i = 0; i < points * 2; i++) {
                const r = i % 2 === 0 ? outerR : innerR;
                const ang = (i * Math.PI) / points - Math.PI / 2;
                const x = cx + Math.cos(ang) * r;
                const y = cy + Math.sin(ang) * r;
                path += (i === 0 ? 'M ' : 'L ') + x.toFixed(2) + ' ' + y.toFixed(2) + ' ';
            }
            return path + 'Z';
        }

        function heartPath(cx, cy, size) {
            const s = size;
            return `M ${cx} ${cy + s * 0.75}
          C ${cx - s * 1.5} ${cy - s * 0.05}, ${cx - s * 0.55} ${cy - s * 1.1}, ${cx} ${cy - s * 0.2}
          C ${cx + s * 0.55} ${cy - s * 1.1}, ${cx + s * 1.5} ${cy - s * 0.05}, ${cx} ${cy + s * 0.75} Z`;
        }

        function spiralPath(cx, cy, maxR) {
            let path = `M ${cx.toFixed(2)} ${cy.toFixed(2)}`;
            const turns = 2.2;
            const steps = 36;
            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                const ang = t * turns * Math.PI * 2;
                const r = t * maxR;
                const x = cx + Math.cos(ang) * r;
                const y = cy + Math.sin(ang) * r;
                path += ` L ${x.toFixed(2)} ${y.toFixed(2)}`;
            }
            return path;
        }

        // ---- catalog ---------------------------------------------------------------
        const STROKE = 3;
        const BODY_R = 100;
        const EYE_CX = 67;   // |x| offset of each eye from body center (game ratio: 24/36)
        const EYE_CY = -7;   // y offset (game ratio: -4/36 scaled)
        // (Game body effective radius ≈ 36, eye position ±24, eye 42×29 → here we
        //  multiply by 100/36 ≈ 2.78 to get matching ratios in viewBox units.)

        const PARTS = {
            // Body patterns live INSIDE the body, clipped to the body interior.
            // Because the eyes are huge and cover most of the upper half, patterns
            // sit mainly in the lower bowl + top cap, where they remain visible.
            body: [
                { id: 'solid', name: 'SOLID', pattern: '' },
                {
                    id: 'spots', name: 'SPOTS',
                    pattern: `
        <circle cx="-50" cy="55" r="22" fill="#fff"/>
        <circle cx="42"  cy="68" r="18" fill="#fff"/>
        <circle cx="-12" cy="78" r="11" fill="#fff"/>
        <circle cx="78"  cy="40" r="9"  fill="#fff"/>
        <circle cx="-78" cy="32" r="13" fill="#fff"/>
        <circle cx="22"  cy="40" r="8"  fill="#fff"/>
        <circle cx="-22" cy="-88" r="6" fill="#fff"/>
      `
                },
                {
                    id: 'stripes', name: 'STRIPES',
                    pattern: `
        <rect x="-90" y="-110" width="22" height="220" fill="#fff"/>
        <rect x="-44" y="-110" width="22" height="220" fill="#fff"/>
        <rect x="2"   y="-110" width="22" height="220" fill="#fff"/>
        <rect x="48"  y="-110" width="22" height="220" fill="#fff"/>
      `
                },
                {
                    id: 'half', name: 'HALF',
                    pattern: `<rect x="0" y="-110" width="120" height="220" fill="#fff"/>`
                },
                {
                    id: 'check', name: 'CHECKERS',
                    pattern: `
        <rect x="0"    y="-110" width="120" height="110" fill="#fff"/>
        <rect x="-120" y="0"    width="120" height="110" fill="#fff"/>
      `
                },
                {
                    id: 'star', name: 'STAR',
                    pattern: `<path d="${starPath(0, 55, 36, 14, 5)}" fill="#fff"/>`
                },
                {
                    id: 'crescent', name: 'CRESCENT',
                    pattern: `
        <circle cx="-14" cy="50" r="38" fill="#fff"/>
        <circle cx="6"   cy="42" r="32" fill="#000"/>
      `
                },
                {
                    id: 'cyclops', name: 'CYCLOPS',
                    pattern: `
        <ellipse cx="0" cy="58" rx="32" ry="22" fill="#fff" stroke="#000" stroke-width="3"/>
        <circle  cx="0" cy="58" r="12" fill="#000"/>
        <circle  cx="4" cy="53" r="3.5" fill="#fff"/>
      `
                },
            ],

            // Eye whites — proportions matched to the game. render() returns one eye.
            // Pupils are sized proportionally to their host eye. pupilMax is the clamp
            // for the *additional* pupil offset inside the eye whites.
            eyes: [
                {
                    id: 'cat', name: 'CAT',
                    render: (cx, cy) =>
                        `<ellipse cx="${cx}" cy="${cy}" rx="58" ry="40" fill="#fff" stroke="#000" stroke-width="${STROKE}"/>`,
                    pupilMax: { x: 22, y: 13 }
                },
                {
                    id: 'round', name: 'ROUND',
                    render: (cx, cy) =>
                        `<circle cx="${cx}" cy="${cy}" r="44" fill="#fff" stroke="#000" stroke-width="${STROKE}"/>`,
                    pupilMax: { x: 20, y: 20 }
                },
                {
                    id: 'wide', name: 'WIDE',
                    render: (cx, cy) =>
                        `<circle cx="${cx}" cy="${cy}" r="55" fill="#fff" stroke="#000" stroke-width="${STROKE}"/>`,
                    pupilMax: { x: 28, y: 28 }
                },
                {
                    id: 'almond', name: 'ALMOND',
                    render: (cx, cy, mirror) =>
                        `<ellipse cx="${cx}" cy="${cy}" rx="55" ry="32" fill="#fff" stroke="#000" stroke-width="${STROKE}" transform="rotate(${mirror ? -12 : 12} ${cx} ${cy})"/>`,
                    pupilMax: { x: 20, y: 12 }
                },
                {
                    id: 'sleepy', name: 'SLEEPY',
                    render: (cx, cy) =>
                        `<ellipse cx="${cx}" cy="${cy}" rx="58" ry="40" fill="#fff" stroke="#000" stroke-width="${STROKE}"/>`,
                    // Eyelid drawn AFTER pupils so they don't poke through.
                    overlay: (cx, cy) =>
                        `<path d="M ${cx - 59} ${cy - 2} A 58 40 0 0 1 ${cx + 59} ${cy - 2} L ${cx + 59} ${cy - 44} L ${cx - 59} ${cy - 44} Z" fill="#000"/>`,
                    pupilMax: { x: 18, y: 4 }
                },
                {
                    id: 'squint', name: 'SQUINT',
                    render: (cx, cy) =>
                        `<ellipse cx="${cx}" cy="${cy}" rx="55" ry="16" fill="#fff" stroke="#000" stroke-width="${STROKE}"/>`,
                    pupilMax: { x: 20, y: 3 }
                },
                {
                    id: 'diamond', name: 'DIAMOND',
                    render: (cx, cy) =>
                        `<polygon points="${cx - 52},${cy} ${cx},${cy - 36} ${cx + 52},${cy} ${cx},${cy + 36}" fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>`,
                    pupilMax: { x: 20, y: 14 }
                },
                {
                    id: 'oval-tall', name: 'OVAL',
                    render: (cx, cy) =>
                        `<ellipse cx="${cx}" cy="${cy}" rx="36" ry="48" fill="#fff" stroke="#000" stroke-width="${STROKE}"/>`,
                    pupilMax: { x: 14, y: 22 }
                },
            ],

            // Pupils render at (0,0); the parent <g>'s translate sets position so the
            // per-frame tick() can update offsets cheaply. Sizes follow the game's
            // pupil:eye ratio (slit ≈ 16% wide × 68% tall).
            pupils: [
                { id: 'slit', name: 'SLIT', render: (cx, cy) => `<rect x="${cx - 8}" y="${cy - 26}" width="16" height="52" fill="#000" rx="3"/>` },
                { id: 'dot', name: 'DOT', render: (cx, cy) => `<circle cx="${cx}" cy="${cy}" r="10" fill="#000"/>` },
                { id: 'dot-big', name: 'BIG DOT', render: (cx, cy) => `<circle cx="${cx}" cy="${cy}" r="18" fill="#000"/>` },
                { id: 'square', name: 'SQUARE', render: (cx, cy) => `<rect x="${cx - 13}" y="${cy - 13}" width="26" height="26" fill="#000"/>` },
                { id: 'heart', name: 'HEART', render: (cx, cy) => `<path d="${heartPath(cx, cy - 3, 16)}" fill="#000"/>` },
                { id: 'star', name: 'STAR', render: (cx, cy) => `<path d="${starPath(cx, cy, 21, 9, 5)}" fill="#000"/>` },
                { id: 'cross', name: 'CROSS', render: (cx, cy) => `<path d="M ${cx - 19} ${cy - 6} h 13 v -13 h 13 v 13 h 13 v 13 h -13 v 13 h -13 v -13 h -13 z" fill="#000"/>` },
                { id: 'diamond', name: 'DIAMOND', render: (cx, cy) => `<polygon points="${cx - 14},${cy} ${cx},${cy - 21} ${cx + 14},${cy} ${cx},${cy + 21}" fill="#000"/>` },
                { id: 'spiral', name: 'SPIRAL', render: (cx, cy) => `<path d="${spiralPath(cx, cy, 22)}" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>` },
                { id: 'none', name: 'BLANK', render: () => '' },
            ],

            // Ears render IN FRONT of the body. Outlined (black stroke, white fill).
            // The interior is visible against the dark body where the ear overlaps;
            // the outline carries the shape where the ear extends past the body.
            ears: [
                { id: 'none', name: 'NONE', render: () => '' },
                {
                    id: 'cat', name: 'CAT',
                    render: () => `
        <polygon points="-84,-68 -56,-128 -28,-68" fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
        <polygon points="84,-68 56,-128 28,-68" fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
        <polygon points="-72,-74 -56,-110 -40,-74" fill="#000"/>
        <polygon points="72,-74 56,-110 40,-74" fill="#000"/>
      `
                },
                {
                    id: 'fox', name: 'FOX',
                    render: () => `
        <polygon points="-86,-60 -62,-148 -38,-60" fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
        <polygon points="86,-60 62,-148 38,-60" fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
        <polygon points="-76,-66 -62,-126 -48,-66" fill="#000"/>
        <polygon points="76,-66 62,-126 48,-66" fill="#000"/>
      `
                },
                {
                    id: 'bear', name: 'BEAR',
                    render: () => `
        <path d="M -88 -84 A 28 28 0 0 1 -32 -84 Z" fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
        <path d="M  88 -84 A 28 28 0 0 0  32 -84 Z" fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
        <path d="M -74 -84 A 14 14 0 0 1 -46 -84 Z" fill="#000"/>
        <path d="M  74 -84 A 14 14 0 0 0  46 -84 Z" fill="#000"/>
      `
                },
                {
                    id: 'floppy', name: 'FLOPPY',
                    render: () => `
        <path d="M -78 -42 Q -132 -10 -110 60 Q -82 86 -68 50 Q -64 -10 -78 -42 Z"
              fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
        <path d="M  78 -42 Q  132 -10  110 60 Q  82 86  68 50 Q  64 -10  78 -42 Z"
              fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
      `
                },
                {
                    id: 'bunny', name: 'BUNNY',
                    render: () => `
        <path d="M -52 -76 Q -58 -148 -34 -158 Q -22 -150 -32 -76 Z"
              fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
        <path d="M  52 -76 Q  58 -148  34 -158 Q  22 -150  32 -76 Z"
              fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
        <path d="M -46 -82 Q -50 -140 -38 -146 Q -32 -140 -38 -82 Z" fill="#000"/>
        <path d="M  46 -82 Q  50 -140  38 -146 Q  32 -140  38 -82 Z" fill="#000"/>
      `
                },
                {
                    id: 'devil', name: 'HORNS',
                    render: () => `
        <path d="M -76 -76 Q -98 -126 -56 -140 Q -64 -110 -54 -82 Z"
              fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
        <path d="M  76 -76 Q  98 -126  56 -140 Q  64 -110  54 -82 Z"
              fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
      `
                },
                {
                    id: 'elf', name: 'ELF',
                    render: () => `
        <path d="M -84 -32 Q -148 -68 -118 -100 Q -82 -82 -74 -36 Z"
              fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
        <path d="M  84 -32 Q  148 -68  118 -100 Q  82 -82  74 -36 Z"
              fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
      `
                },
            ],

            // Tails render BEHIND the body so the attachment is hidden. Closed shapes
            // (stroke+fill) for the fat tails; thin ones keep that taper.
            tail: [
                { id: 'none', name: 'NONE', render: () => '' },
                {
                    id: 'cat', name: 'CAT',
                    // Closed tapering S-curve — wider at the base, narrower at the tip.
                    render: () => `
        <path d="M 70 72
                 C 134 86 162 30 148 -22
                 C 138 -44 110 -36 102 -14
                 C 98 4 90 22 80 72 Z"
              fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
      `
                },
                {
                    id: 'straight', name: 'STRAIGHT',
                    render: () => `
        <path d="M 70 78 Q 132 78 154 20 Q 158 -6 142 -4 Q 132 0 126 26 Q 110 60 70 60 Z"
              fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
      `
                },
                {
                    id: 'fox', name: 'FOX',
                    render: () => `
        <path d="M 70 76 Q 96 90 136 80 Q 174 64 168 20 Q 158 -22 124 -12 Q 100 -2 88 28 Q 78 52 70 76 Z"
              fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
        <path d="M 148 -2 Q 160 8 156 26" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 132 -4 Q 140 6 134 22" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
      `
                },
                {
                    id: 'devil', name: 'DEVIL',
                    // Whip + arrow as a single closed path so they read as one shape.
                    render: () => `
        <path d="M 70 88
                 Q 122 100 138 60
                 L 158 56
                 L 142 42
                 L 158 22
                 L 132 30
                 L 144 50
                 Q 130 56 124 64
                 Q 110 78 70 76 Z"
              fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
      `
                },
                {
                    id: 'puff', name: 'PUFF',
                    render: () => `<circle cx="98" cy="86" r="24" fill="#fff" stroke="#000" stroke-width="${STROKE}"/>`
                },
                {
                    id: 'lizard', name: 'LIZARD',
                    render: () => `
        <path d="M 64 88 Q 132 116 158 56 Q 162 26 148 8 Q 142 0 138 8 Q 146 24 144 50 Q 130 88 70 76 Z"
              fill="#fff" stroke="#000" stroke-width="${STROKE}" stroke-linejoin="round"/>
      `
                },
                {
                    id: 'curl', name: 'CURL',
                    // A bona fide spiral. Outline-effect via double-stroke (black outer +
                    // white inner) so it reads as a curled tube even on the white stage.
                    render: () => {
                        // Start of tail at body's right; spiral arc rising up + curling.
                        // We hand-build a single thickened curve as two parallel paths.
                        const d = `M 70 76
                   C 130 92 158 50 156 6
                   C 154 -36 116 -50 96 -28
                   C 80 -10 96 6 112 -2
                   C 124 -8 124 -22 112 -22
                   C 104 -22 102 -14 108 -10
                   C 114 -8 116 -16 110 -16`;
                        return `
          <path d="${d}" fill="none" stroke="#000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="${d}" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        `;
                    }
                },
            ],
        };

        // ---- state (single source of truth) ----------------------------------------
        const state = { body: 'solid', eyes: 'cat', pupils: 'slit', ears: 'none', tail: 'none' };

        const CATEGORIES = [
            { key: 'body', label: 'BODY' },
            { key: 'eyes', label: 'EYES' },
            { key: 'pupils', label: 'PUPILS' },
            { key: 'ears', label: 'EARS' },
            { key: 'tail', label: 'TAIL' },
        ];

        function partsOf(c) { return PARTS[c]; }
        function getIndex(c) { return PARTS[c].findIndex(p => p.id === state[c]); }
        function setByIndex(c, idx) {
            const arr = PARTS[c];
            const i = ((idx % arr.length) + arr.length) % arr.length;
            state[c] = arr[i].id;
        }

        // ---- DOM refs cached after each rebuild -----------------------------------
        let charGroup, eyesGroup, pupilL, pupilR;

        // ---- render ---------------------------------------------------------------
        function rebuild() {
            const bodyPart = partsOf('body').find(p => p.id === state.body);
            const eyesPart = partsOf('eyes').find(p => p.id === state.eyes);
            const pupilsPart = partsOf('pupils').find(p => p.id === state.pupils);
            const earsPart = partsOf('ears').find(p => p.id === state.ears);
            const tailPart = partsOf('tail').find(p => p.id === state.tail);

            const overlayLeft = eyesPart.overlay ? eyesPart.overlay(-EYE_CX, EYE_CY, false) : '';
            const overlayRight = eyesPart.overlay ? eyesPart.overlay(EYE_CX, EYE_CY, true) : '';

            // Render order (back → front):
            //   tail → body (fill+pattern+stroke) → ears → eyes
            // Tails are behind the body so the attachment is hidden; ears are in FRONT
            // so their white interiors are visible against the body where they overlap.
            charGroup.innerHTML = `
    <defs>
      <clipPath id="body-clip"><circle cx="0" cy="0" r="${BODY_R - 0.5}"/></clipPath>
    </defs>

    <g class="tail">${tailPart.render()}</g>

    <circle cx="0" cy="0" r="${BODY_R}" fill="#000"/>
    <g clip-path="url(#body-clip)">${bodyPart.pattern}</g>
    <circle cx="0" cy="0" r="${BODY_R}" fill="none" stroke="#000" stroke-width="${STROKE}"/>

    <g class="ears">${earsPart.render()}</g>

    <g class="eyes" id="eyes-group">
      ${eyesPart.render(-EYE_CX, EYE_CY, false)}
      ${eyesPart.render(EYE_CX, EYE_CY, true)}
      <g id="pupil-left"  transform="translate(${-EYE_CX} ${EYE_CY})">${pupilsPart.render(0, 0)}</g>
      <g id="pupil-right" transform="translate(${EYE_CX} ${EYE_CY})">${pupilsPart.render(0, 0)}</g>
      ${overlayLeft}${overlayRight}
    </g>
  `;

            eyesGroup = document.getElementById('eyes-group');
            pupilL = document.getElementById('pupil-left');
            pupilR = document.getElementById('pupil-right');
        }

        // ---- animation state -------------------------------------------------------
        // Split into eye-socket shift + pupil offset, mirroring the game's vx/20 +
        // half-pupil scheme. Both are smoothed toward a target derived from cursor
        // distance or idle wander.
        const eyeAnim = {
            shift: { current: { x: 0, y: 0 }, target: { x: 0, y: 0 } },
            pupilOff: { current: { x: 0, y: 0 }, target: { x: 0, y: 0 } },
            mouseDir: null,                  // {x,y} in [-1, 1] when cursor active
            idleDir: { x: 0, y: 0 },
            nextIdleAt: 0,
        };
        // Per-direction maxes — taken from the game's clamps scaled to a 100-radius
        // body (game uses ±6/±4 for sockets, ±3/±2 extra for pupils).
        const EYE_SHIFT_MAX = { x: 17, y: 11 };
        const PUPIL_OFF_MAX = { x: 8, y: 5 };

        const blinkAnim = {
            amount: 0, state: 'open', nextBlinkAt: 0, phaseStart: 0,
        };

        const squeezeAnim = {
            active: false,
            startTime: 0,
            slant: 0,
            // 3-phase juice — matches the game's playFlapJuice timings.
            phases: [
                { dur: 120, sx: 0.65, sy: 1.55, angK: 1.0, ease: easeOutCubic },
                { dur: 180, sx: 1.28, sy: 0.80, angK: -0.5, ease: easeInOutQuad },
                { dur: 420, sx: 1.00, sy: 1.00, angK: 0, ease: easeOutElastic },
            ],
            totalDur: 0,
        };
        squeezeAnim.totalDur = squeezeAnim.phases.reduce((a, p) => a + p.dur, 0);

        function triggerSqueeze() {
            if (squeezeAnim.active) return;
            squeezeAnim.active = true;
            squeezeAnim.startTime = performance.now();
            squeezeAnim.slant = (Math.random() - 0.5) * 22; // ±11°
        }

        // ---- per-frame tick --------------------------------------------------------
        function tick(now) {
            // ----- direction ----------------------------------------------------------
            let dirX, dirY;
            if (eyeAnim.mouseDir) {
                dirX = eyeAnim.mouseDir.x;
                dirY = eyeAnim.mouseDir.y;
            } else {
                if (now >= eyeAnim.nextIdleAt) {
                    eyeAnim.idleDir.x = rand(-1, 1) * 0.55;
                    eyeAnim.idleDir.y = rand(-1, 1) * 0.55;
                    eyeAnim.nextIdleAt = now + rand(1500, 3500);
                }
                dirX = eyeAnim.idleDir.x;
                dirY = eyeAnim.idleDir.y;
            }

            eyeAnim.shift.target.x = dirX * EYE_SHIFT_MAX.x;
            eyeAnim.shift.target.y = dirY * EYE_SHIFT_MAX.y;
            eyeAnim.pupilOff.target.x = dirX * PUPIL_OFF_MAX.x;
            eyeAnim.pupilOff.target.y = dirY * PUPIL_OFF_MAX.y;

            eyeAnim.shift.current.x += (eyeAnim.shift.target.x - eyeAnim.shift.current.x) * 0.18;
            eyeAnim.shift.current.y += (eyeAnim.shift.target.y - eyeAnim.shift.current.y) * 0.18;
            eyeAnim.pupilOff.current.x += (eyeAnim.pupilOff.target.x - eyeAnim.pupilOff.current.x) * 0.18;
            eyeAnim.pupilOff.current.y += (eyeAnim.pupilOff.target.y - eyeAnim.pupilOff.current.y) * 0.18;

            // Clamp pupil offset so it stays within the host eye's iris area.
            const eyesPart = partsOf('eyes').find(p => p.id === state.eyes);
            const px = clamp(eyeAnim.pupilOff.current.x, -eyesPart.pupilMax.x, eyesPart.pupilMax.x);
            const py = clamp(eyeAnim.pupilOff.current.y, -eyesPart.pupilMax.y, eyesPart.pupilMax.y);

            if (pupilL) pupilL.setAttribute('transform', `translate(${(-EYE_CX + px).toFixed(2)} ${(EYE_CY + py).toFixed(2)})`);
            if (pupilR) pupilR.setAttribute('transform', `translate(${(EYE_CX + px).toFixed(2)} ${(EYE_CY + py).toFixed(2)})`);

            // ----- blink --------------------------------------------------------------
            if (blinkAnim.state === 'open') {
                if (now >= blinkAnim.nextBlinkAt) { blinkAnim.state = 'closing'; blinkAnim.phaseStart = now; }
            } else if (blinkAnim.state === 'closing') {
                const t = (now - blinkAnim.phaseStart) / 80;
                blinkAnim.amount = clamp(t, 0, 1);
                if (t >= 1) { blinkAnim.state = 'opening'; blinkAnim.phaseStart = now; }
            } else if (blinkAnim.state === 'opening') {
                const t = (now - blinkAnim.phaseStart) / 120;
                blinkAnim.amount = clamp(1 - t, 0, 1);
                if (t >= 1) {
                    blinkAnim.amount = 0;
                    blinkAnim.state = 'open';
                    blinkAnim.nextBlinkAt = now + rand(3500, 7000);
                }
            }

            // Compose eye-socket shift + blink on the eyes-group. Outer transform is
            // applied LAST visually, so we want: blink (innermost) → socket shift.
            if (eyesGroup) {
                const blinkScale = 1 - blinkAnim.amount * 0.94;
                const sx = eyeAnim.shift.current.x, sy = eyeAnim.shift.current.y;
                eyesGroup.setAttribute('transform',
                    `translate(${sx.toFixed(2)} ${sy.toFixed(2)}) translate(0 ${EYE_CY}) scale(1 ${blinkScale}) translate(0 ${-EYE_CY})`);
            }

            // ----- squeeze (full-body juice) -----------------------------------------
            if (squeezeAnim.active) {
                const elapsed = now - squeezeAnim.startTime;
                if (elapsed >= squeezeAnim.totalDur) {
                    charGroup.removeAttribute('transform');
                    squeezeAnim.active = false;
                } else {
                    // Walk phases, tracking the end-state of the previous one as the
                    // current phase's start-state. Lerp start → end with the phase's ease.
                    // Angle interpolates the same way, scaled by the random slant.
                    let acc = 0;
                    let sx = 1, sy = 1, ang = 0;
                    let prevSx = 1, prevSy = 1, prevAng = 0;
                    for (let i = 0; i < squeezeAnim.phases.length; i++) {
                        const p = squeezeAnim.phases[i];
                        const endAng = squeezeAnim.slant * p.angK;
                        if (elapsed < acc + p.dur) {
                            const t = p.ease((elapsed - acc) / p.dur);
                            sx = lerp(prevSx, p.sx, t);
                            sy = lerp(prevSy, p.sy, t);
                            ang = lerp(prevAng, endAng, t);
                            break;
                        }
                        acc += p.dur;
                        prevSx = p.sx; prevSy = p.sy; prevAng = endAng;
                    }
                    charGroup.setAttribute('transform', `scale(${sx.toFixed(3)} ${sy.toFixed(3)}) rotate(${ang.toFixed(2)})`);
                }
            }

            requestAnimationFrame(tick);
        }

        // ---- UI wiring ------------------------------------------------------------
        function buildControls() {
            const root = $('#controls');
            root.innerHTML = '';
            for (const cat of CATEGORIES) {
                const row = document.createElement('div');
                row.className = 'row';
                row.dataset.category = cat.key;
                row.innerHTML = `
      <div class="label">${cat.label}</div>
      <div class="picker">
        <button class="arrow prev" aria-label="Previous ${cat.label.toLowerCase()}">&lt;</button>
        <div class="value"></div>
        <button class="arrow next" aria-label="Next ${cat.label.toLowerCase()}">&gt;</button>
      </div>
      <div class="idx"></div>
    `;
                row.querySelector('.prev').addEventListener('click', () => step(cat.key, -1));
                row.querySelector('.next').addEventListener('click', () => step(cat.key, +1));
                root.appendChild(row);
            }
            refreshControls();
        }

        function refreshControls() {
            for (const cat of CATEGORIES) {
                const row = document.querySelector(`.row[data-category="${cat.key}"]`);
                const arr = partsOf(cat.key);
                const idx = getIndex(cat.key);
                row.querySelector('.value').textContent = arr[idx].name;
                row.querySelector('.idx').textContent =
                    String(idx + 1).padStart(2, '0') + '/' + String(arr.length).padStart(2, '0');
            }
        }

        function step(category, dir) {
            const row = document.querySelector(`.row[data-category="${category}"] .value`);
            if (row) {
                row.classList.add('changing');
                setTimeout(() => row.classList.remove('changing'), 80);
            }
            setByIndex(category, getIndex(category) + dir);
            refreshControls();
            rebuild();
        }

        function randomize() {
            for (const cat of CATEGORIES) {
                setByIndex(cat.key, Math.floor(Math.random() * partsOf(cat.key).length));
            }
            refreshControls();
            rebuild();
            const st = $('#stage');
            st.classList.remove('scan');
            void st.offsetWidth;
            st.classList.add('scan');
            setTimeout(() => st.classList.remove('scan'), 600);
            triggerSqueeze();
        }

        function exportJson() {
            const text = JSON.stringify(state);
            const fallback = () => {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { }
                document.body.removeChild(ta);
                showToast(ok ? 'CONFIG COPIED' : 'COPY FAILED · SEE CONSOLE');
            };
            if (navigator.clipboard?.writeText) {
                navigator.clipboard.writeText(text).then(() => showToast('CONFIG COPIED'), fallback);
            } else {
                fallback();
            }
            console.log('[CHARACTER LAB] config:', text);
        }

        let toastTimeout;
        function showToast(message) {
            const t = $('#toast');
            t.textContent = message;
            t.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => t.classList.remove('show'), 1800);
        }

        // ---- input -----------------------------------------------------------------
        function setupInteractions() {
            const stage = $('#stage');
            stage.addEventListener('click', triggerSqueeze);
            window.addEventListener('mousemove', (e) => {
                const rect = stage.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dx = e.clientX - cx;
                const dy = e.clientY - cy;
                const norm = clamp(Math.hypot(dx, dy) / 240, 0, 1);
                const ang = Math.atan2(dy, dx);
                eyeAnim.mouseDir = { x: Math.cos(ang) * norm, y: Math.sin(ang) * norm };
            });
            window.addEventListener('mouseleave', () => { eyeAnim.mouseDir = null; });
            window.addEventListener('blur', () => { eyeAnim.mouseDir = null; });
        }

        // ---- boot ------------------------------------------------------------------
        charGroup = document.getElementById('char-group');
        buildControls();
        rebuild();
        setupInteractions();
        $('#btn-random').addEventListener('click', randomize);
        $('#btn-export').addEventListener('click', exportJson);
        blinkAnim.nextBlinkAt = performance.now() + rand(2500, 4500);
        eyeAnim.nextIdleAt = performance.now() + rand(800, 2000);
        requestAnimationFrame(tick);
    </script>
</body>

</html>
