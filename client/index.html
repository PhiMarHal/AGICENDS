<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AGISCENDS</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            margin: 0 auto;
        }

        /* ── Hamburger button ── */
        #menu-btn {
            position: fixed;
            top: 8px;
            left: 8px;
            color: #fff;
            font-family: monospace;
            font-size: 20px;
            line-height: 1;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 10px;
            z-index: 20;
            cursor: pointer;
            user-select: none;
            border-radius: 4px;
        }

        /* ── Dropdown menu panel ── */
        #menu-panel {
            display: none;
            position: fixed;
            top: 42px;
            left: 8px;
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 14px;
            z-index: 20;
            border-radius: 4px;
            min-width: 160px;
            white-space: nowrap;
        }

        #menu-panel.open {
            display: block;
        }

        /* ── Speaker button ── */
        #speaker-btn {
            position: fixed;
            top: 8px;
            right: 8px;
            font-size: 20px;
            line-height: 1;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 10px;
            z-index: 20;
            cursor: pointer;
            user-select: none;
            border-radius: 4px;
        }

        /* Force the emoji to render as pure white */
        #speaker-btn .icon {
            display: inline-block;
            position: relative;
            filter: brightness(0) invert(1);
        }

        /* Strikethrough bar when muted */
        #speaker-btn.muted .icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -4px;
            right: -4px;
            height: 2.5px;
            background: #fff;
            transform: translateY(-50%) rotate(45deg);
            pointer-events: none;
        }

        /* ── Scoreboard (bottom left) ──
           Holds one .scoreboard-line per in-round player who has scored.
           On wide viewports all lines are visible; on phones, a media query
           hides everything past the first line to avoid running into the
           right edge. The 720px breakpoint matches the canvas width: if
           the viewport is narrower than the canvas, we're effectively in
           "mobile" layout. */
        #scoreboard {
            position: fixed;
            bottom: 8px;
            left: 8px;
            color: #fff;
            font-family: monospace;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            z-index: 10;
            pointer-events: none;
            border-radius: 4px;
            display: none;
        }

        #scoreboard.has-scores {
            display: block;
        }

        #scoreboard .scoreboard-line {
            white-space: nowrap;
        }

        @media (max-width: 720px) {
            #scoreboard .scoreboard-line:nth-child(n+2) {
                display: none;
            }
        }

        /* ── Auth UI: button inside menu, plus modal ── */
        #menu-panel hr {
            border: none;
            border-top: 1px solid #444;
            margin: 8px 0;
        }

        #menu-panel button {
            display: block;
            width: 100%;
            margin: 0;
            background: #fff;
            color: #000;
            border: none;
            font-family: monospace;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        #menu-panel button:hover {
            background: #ddd;
        }

        #auth-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 30;
            align-items: center;
            justify-content: center;
        }

        #auth-overlay.open {
            display: flex;
        }

        #auth-modal {
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            padding: 18px 20px;
            border-radius: 6px;
            min-width: 280px;
            max-width: 90vw;
        }

        #auth-modal h2 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: normal;
        }

        #auth-modal label {
            display: block;
            margin-top: 10px;
            color: #ccc;
        }

        #auth-modal input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            font-family: monospace;
            font-size: 13px;
            padding: 6px 8px;
            margin-top: 3px;
            border-radius: 4px;
        }

        #auth-modal input:focus {
            outline: none;
            border-color: #888;
        }

        #auth-error {
            margin-top: 10px;
            color: #f88;
            font-size: 12px;
            min-height: 14px;
        }

        /* Optional subtitle line under the modal title. Only populated
           in 'claim' mode; otherwise empty and (via :empty) hidden. */
        #auth-subtitle {
            margin-top: 4px;
            color: #aaa;
            font-size: 12px;
            line-height: 1.4;
        }

        #auth-subtitle:empty {
            display: none;
        }

        /* Full-width primary action button. Used for the bespoke submit
           and the Ethereum button — they share visual weight and span
           the modal so neither feels like a secondary affordance. */
        .auth-full-btn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            background: #fff;
            color: #000;
            border: none;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 10px 12px;
            margin-top: 14px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .auth-full-btn:hover {
            background: #ddd;
        }

        .auth-full-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #auth-toggle-link {
            margin-top: 10px;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
            text-align: center;
        }

        #auth-toggle-link:hover {
            color: #ccc;
        }

        /* "OR" divider between the bespoke flow and the Ethereum flow.
           Two thin lines flanking the word; dimmed to match the modal. */
        #auth-divider {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 14px 0 0 0;
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #auth-divider::before,
        #auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #333;
        }

        /* MMR line under Sign Out button */
        #menu-mmr {
            color: #ccc;
            font-family: monospace;
            font-size: 13px;
            margin: 6px 0 0 0;
        }

        /* "Leaderboards" link inside menu — not a button, just clickable text */
        #menu-leaderboard-link {
            color: #ccc;
            font-family: monospace;
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
            padding: 2px 0;
        }

        #menu-leaderboard-link:hover {
            color: #fff;
        }

        /* ── Leaderboard modal ─────────────────────────────────────────
           Mobile default: centered with backdrop, takes most of the screen.
           Wide viewports (≥1200px): docks to the right side, transparent
           backdrop, pointer-events disabled outside the panel so the game
           stays playable while it's open. */
        #leaderboard-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 25;
            align-items: center;
            justify-content: center;
        }

        #leaderboard-overlay.open {
            display: flex;
        }

        #leaderboard-panel {
            position: relative;
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            padding: 16px 20px;
            border-radius: 6px;
            width: 360px;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        #leaderboard-panel h2 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: normal;
        }

        #leaderboard-close {
            position: absolute;
            top: 6px;
            right: 12px;
            color: #888;
            cursor: pointer;
            font-size: 22px;
            line-height: 1;
        }

        #leaderboard-close:hover {
            color: #fff;
        }

        #leaderboard-rows {
            margin-top: 12px;
        }

        .leaderboard-row {
            display: flex;
            padding: 2px 0;
            white-space: nowrap;
        }

        .leaderboard-row.me {
            color: #ffd54f;
        }

        .leaderboard-rank {
            width: 36px;
            color: #888;
        }

        .leaderboard-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .leaderboard-mmr {
            width: 60px;
            text-align: right;
        }

        .leaderboard-empty {
            color: #888;
            padding: 8px 0;
        }

        #leaderboard-mode-toggle {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #333;
            justify-content: center;
        }

        .leaderboard-mode-btn {
            background: transparent;
            color: #888;
            border: 1px solid #444;
            padding: 6px 18px;
            cursor: pointer;
            font-family: monospace;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .leaderboard-mode-btn:hover {
            color: #fff;
            border-color: #777;
        }

        .leaderboard-mode-btn.active {
            color: #000;
            background: #fff;
            border-color: #fff;
        }

        @media (min-width: 1200px) {
            #leaderboard-overlay {
                inset: auto;
                top: 0;
                right: 0;
                bottom: 0;
                background: transparent;
                pointer-events: none;
                align-items: stretch;
                justify-content: flex-end;
            }

            #leaderboard-panel {
                pointer-events: auto;
                margin: 16px;
                width: 420px;
                max-width: 420px;
                height: calc(100vh - 32px);
                max-height: none;
            }
        }

        /* ── Mode picker (ANGELS / DEVILS) ─────────────────────────────
           Shown on page load and again whenever the user clicks
           "Switch mode" in the menu. No localStorage persistence — every
           reload presents the choice fresh.
           Overlay is transparent so the cathedral background renders
           behind it. The buttons themselves are opaque. */
        #mode-picker-overlay {
            display: flex;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            /* soft scrim, lets cathedral show */
            z-index: 100;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: monospace;
        }

        #mode-picker-overlay.hidden {
            display: none;
        }

        #mode-picker-content {
            text-align: center;
            display: flex;
            justify-content: center;
        }

        .mode-picker-buttons {
            display: flex;
            flex-direction: column;
            gap: 100px;
            justify-content: center;
            align-items: center;
        }

        .mode-button {
            width: 290px;
            height: 130px;
            background: #ffffff;
            color: #000000;
            border: 2px solid #ffffff;
            cursor: pointer;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            font-weight: bold;
            letter-spacing: 4px;
            transition: transform 0.1s, background 0.1s;
        }

        .mode-button:hover {
            background: #e8e8e8;
            transform: scale(1.03);
        }

        @media (max-width: 600px) {
            .mode-picker-buttons {
                gap: 72px;
            }

            .mode-button {
                width: 210px;
                height: 90px;
                font-size: 38px;
            }
        }

        /* Current-mode label + Switch-mode link in the menu */
        #menu-current-mode {
            color: #ccc;
            font-family: monospace;
            font-size: 13px;
            padding: 2px 0;
            letter-spacing: 1px;
        }

        #menu-switch-mode-link {
            color: #ccc;
            font-family: monospace;
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
            padding: 2px 0;
        }

        #menu-switch-mode-link:hover {
            color: #fff;
        }

        #menu-switch-mode-link.disabled {
            color: #666;
            text-decoration: none;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="game-container"></div>

    <!-- Top left: hamburger + menu -->
    <div id="menu-btn">☰</div>
    <div id="menu-panel">
        <span id="menu-player-name">you are …</span>
        <hr>
        <button id="menu-auth-btn">Sign in</button>
        <div id="menu-mmr" style="display:none">1500 MMR</div>
        <hr>
        <div id="menu-current-mode">DEVILS</div>
        <div id="menu-switch-mode-link">Switch mode</div>
        <div id="menu-leaderboard-link">Leaderboards</div>
    </div>

    <!-- Mode picker — visible on every page load, also re-summoned from
         the menu's "Switch mode" entry. Transparent overlay lets the
         cathedral background render through. -->
    <div id="mode-picker-overlay">
        <div id="mode-picker-content">
            <div class="mode-picker-buttons">
                <button class="mode-button" data-mode="devils">DEVILS</button>
                <button class="mode-button" data-mode="angels">ANGELS</button>
            </div>
        </div>
    </div>

    <!-- Leaderboard modal: docks right on web, centered on mobile -->
    <div id="leaderboard-overlay">
        <div id="leaderboard-panel">
            <div id="leaderboard-close" title="Close">×</div>
            <h2>Top 100</h2>
            <div id="leaderboard-rows">
                <div class="leaderboard-empty">Loading…</div>
            </div>
            <div id="leaderboard-mode-toggle">
                <button class="leaderboard-mode-btn" data-mode="devils">DEVILS</button>
                <button class="leaderboard-mode-btn" data-mode="angels">ANGELS</button>
            </div>
        </div>
    </div>

    <!-- Auth modal (sign in / sign up / claim wallet username). Hidden by default. -->
    <div id="auth-overlay">
        <div id="auth-modal">
            <h2 id="auth-title">Sign in</h2>
            <div id="auth-subtitle"></div>
            <label id="auth-username-label">Username
                <input type="text" id="auth-username" autocomplete="username" maxlength="16" autocapitalize="off"
                    autocorrect="off" spellcheck="false">
            </label>
            <label id="auth-password-label">Password
                <input type="password" id="auth-password" autocomplete="current-password" maxlength="64">
            </label>
            <div id="auth-error"></div>
            <button class="auth-full-btn" id="auth-submit" type="button">Sign In With Account</button>
            <div id="auth-toggle-link">Don't have an account? Sign up</div>
            <div id="auth-divider">or</div>
            <button class="auth-full-btn" id="auth-eth-btn" type="button">Sign In With Ethereum</button>
        </div>
    </div>

    <!-- Top right: speaker toggle -->
    <div id="speaker-btn"><span class="icon">🔊</span></div>

    <!-- Bottom left: scoreboard (one line per scoring player; mobile shows leader only) -->
    <div id="scoreboard"></div>

    <script>
        // ========================================================================
        // Music
        // ========================================================================
        const MUSIC_BASE_URL = 'https://agiscend.loiyaa.com/';
        const MUSIC_IS_LOCAL = window.location.protocol === 'file:';
        const MUSIC_TRACK_COUNT = 21;
        const MUSIC_SILENCE_BETWEEN_TRACKS = 4000;

        let musicPlaylist = [];
        let musicCurrentTrackIndex = 0;
        let musicAudioElement = null;
        let musicStarted = false;
        let musicTransitioning = false;
        let musicMuted = false;

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generateMusicPlaylist() {
            const tracks = [];
            for (let i = 1; i <= MUSIC_TRACK_COUNT; i++) {
                const trackNum = i.toString().padStart(2, '0');
                const trackPath = MUSIC_IS_LOCAL
                    ? `assets/track_${trackNum}.mp3`
                    : `${MUSIC_BASE_URL}assets/track_${trackNum}.mp3`;
                tracks.push(trackPath);
            }
            return shuffleArray(tracks);
        }

        function playNextTrack() {
            if (!musicStarted || musicTransitioning) return;
            musicTransitioning = true;
            if (musicCurrentTrackIndex >= musicPlaylist.length) {
                musicPlaylist = generateMusicPlaylist();
                musicCurrentTrackIndex = 0;
            }
            const trackPath = musicPlaylist[musicCurrentTrackIndex];
            musicCurrentTrackIndex++;
            if (musicAudioElement) {
                musicAudioElement.pause();
                musicAudioElement.removeAttribute('src');
                musicAudioElement.load();
                musicAudioElement = null;
            }
            musicAudioElement = new Audio();
            musicAudioElement.volume = 0.5;
            musicAudioElement.muted = musicMuted;
            musicAudioElement.onended = () => {
                musicTransitioning = false;
                setTimeout(playNextTrack, MUSIC_SILENCE_BETWEEN_TRACKS);
            };
            musicAudioElement.onerror = () => {
                console.warn('Could not load track:', trackPath);
                musicTransitioning = false;
                setTimeout(playNextTrack, 1000);
            };
            musicAudioElement.oncanplaythrough = () => {
                musicTransitioning = false;
                if (!musicMuted) musicAudioElement.play().catch(e => console.warn('Playback failed:', e));
            };
            musicAudioElement.src = trackPath;
            musicAudioElement.load();
        }

        function startMusic() {
            if (musicStarted) return;
            musicStarted = true;
            musicTransitioning = false;
            musicPlaylist = generateMusicPlaylist();
            musicCurrentTrackIndex = 0;
            playNextTrack();
        }

        document.addEventListener('visibilitychange', () => {
            if (!musicAudioElement) return;
            if (document.hidden) musicAudioElement.pause();
            else if (musicStarted) musicAudioElement.play().catch(() => { });
        });

        // ========================================================================
        // UI controls: hamburger menu + speaker toggle
        // ========================================================================
        const menuBtn = document.getElementById('menu-btn');
        const menuPanel = document.getElementById('menu-panel');
        const speakerBtn = document.getElementById('speaker-btn');
        const scoreboardEl = document.getElementById('scoreboard');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuPanel.classList.toggle('open');
        });

        // Prevent pointerdown / touchstart on overlay elements from reaching the Phaser canvas
        [menuBtn, menuPanel, speakerBtn].forEach(el => {
            el.addEventListener('pointerdown', e => e.stopPropagation());
            el.addEventListener('touchstart', e => e.stopPropagation(), { passive: false });
        });

        document.addEventListener('click', (e) => {
            if (!menuPanel.contains(e.target) && e.target !== menuBtn) {
                menuPanel.classList.remove('open');
            }
        });

        speakerBtn.addEventListener('click', () => {
            musicMuted = !musicMuted;
            if (musicAudioElement) {
                musicAudioElement.muted = musicMuted;
                if (!musicMuted && musicStarted) {
                    musicAudioElement.play().catch(() => { });
                }
            }
            speakerBtn.classList.toggle('muted', musicMuted);
        });

        // ========================================================================
        // Auth UI: sign in / sign up modal, token storage, menu wiring
        // ========================================================================
        // The Worker URL where signup/signin/verify endpoints live. Update this
        // if you point the Worker at a custom domain. The page can be served
        // from anywhere — localhost, a CDN, your real domain — and call out
        // to this URL via fetch (CORS is configured in the Worker).
        const AUTH_WORKER_URL = 'https://agiscends-auth.philoiyaa.workers.dev';
        const AUTH_TOKEN_KEY = 'agiscends_auth_token';

        // currentUser is { id, display_name } when logged in, null when anon.
        // It's set from the welcome message after the WebSocket handshake.
        let currentUser = null;

        function getStoredToken() {
            try { return localStorage.getItem(AUTH_TOKEN_KEY); } catch { return null; }
        }
        function setStoredToken(token) {
            try {
                if (token) localStorage.setItem(AUTH_TOKEN_KEY, token);
                else localStorage.removeItem(AUTH_TOKEN_KEY);
            } catch { /* ignore — private mode, etc. */ }
        }

        async function authSignIn(username, password) {
            const res = await fetch(AUTH_WORKER_URL + '/auth/bespoke/signin', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });
            return await res.json();
        }
        async function authSignUp(username, password) {
            const res = await fetch(AUTH_WORKER_URL + '/auth/bespoke/signup', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });
            return await res.json();
        }

        // Independently verifies a stored token directly with the Worker, so
        // the client knows its own auth state without relying on the game
        // server. Important for local dev: the game server might be running
        // without AUTH_WORKER_URL set (anon mode), but we're still logged in
        // — the menu should reflect that. Only clears the stored token if
        // the Worker explicitly rejects it. Network errors leave it alone.
        async function ensureAuthState() {
            if (currentUser) return;
            const token = getStoredToken();
            if (!token) return;
            try {
                const res = await fetch(AUTH_WORKER_URL + '/auth/verify', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ token }),
                });
                const data = await res.json();
                if (data && data.ok && data.user) {
                    currentUser = data.user;
                    updateMenuFromAuth();
                } else {
                    // Worker rejected it — bad/expired token, drop it.
                    setStoredToken(null);
                }
            } catch (_) {
                // Worker unreachable; keep token, stay anon for this session.
            }
        }

        // Map server error codes to friendly text the user sees in the modal.
        function friendlyAuthError(result) {
            if (!result) return 'Unknown error.';
            if (result.error === 'username_taken') return 'Username already taken.';
            if (result.error === 'invalid_username') return result.message || 'Invalid username.';
            if (result.error === 'invalid_password') return result.message || 'Invalid password.';
            if (result.error === 'invalid_credentials') return 'Wrong username or password.';
            if (result.error === 'signups_closed') return 'Sign-ups are currently closed.';
            if (result.error === 'ticket_invalid_or_expired') return 'Wallet session expired. Try Sign In With Ethereum again.';
            if (result.error === 'identity_already_claimed') return 'That wallet is already linked to another account.';
            return result.message || ('Error: ' + (result.error || 'unknown'));
        }

        // Updates the menu panel to reflect current auth state. Called when
        // welcome arrives, after a successful sign in, and after sign out.
        function updateMenuFromAuth() {
            const nameEl = document.getElementById('menu-player-name');
            const btnEl = document.getElementById('menu-auth-btn');
            const mmrEl = document.getElementById('menu-mmr');
            if (currentUser) {
                nameEl.textContent = 'you are ' + currentUser.display_name;
                btnEl.textContent = 'Sign out';
                if (mmrEl) {
                    mmrEl.textContent = (currentUser.mmr != null ? currentUser.mmr : 1500) + ' MMR';
                    mmrEl.style.display = 'block';
                }
            } else {
                nameEl.textContent = 'you are ' + (mySessionId || '…');
                btnEl.textContent = 'Sign in';

        const authOverlay = document.getElementById('auth-overlay');

        // Modes:
        //   'signin' — username + password, both required
        //   'signup' — same, going to bespoke signup
        //   'claim'  — finishing a wallet sign-in: pick a username, password
        //              is OPTIONAL. The modal toggle/divider/ethereum-button
        //              rows are hidden in this mode (you can't switch flows
        //              mid-claim — the ticket is already minted).
        let authMode = 'signin';

        // When in 'claim' mode this holds the server-issued ticket from
        // /auth/wallet/verify. Cleared on close or successful claim.
        let walletClaimTicket = null;

        function refreshAuthModalUI() {
            // Reset visibility for non-claim modes; we'll re-hide things
            // below when authMode === 'claim'.
            authToggleLink.style.display = '';
            authDivider.style.display = '';
            authEthBtn.style.display = '';
            authPasswordLabel.style.display = '';
            authSubtitle.textContent = '';

                authTitle.textContent = 'Sign in';
                authSubmit.textContent = 'Sign In With Account';
                authPassword.autocomplete = 'current-password';
                authPasswordLabel.firstChild.textContent = 'Password';
                authToggleLink.textContent = "Don't have an account? Sign up";
            } else if (authMode === 'signup') {
                authTitle.textContent = 'Sign up';
                authSubmit.textContent = 'Sign Up';
                authPassword.autocomplete = 'new-password';
                authPasswordLabel.firstChild.textContent = 'Password';
                authToggleLink.textContent = 'Already have an account? Sign in';
            } else if (authMode === 'claim') {
                authTitle.textContent = 'Choose a username';
                authSubtitle.textContent =
                    'Signed in with Ethereum. Pick a username to finish setting up your account.';
                authSubmit.textContent = 'Create Account';
                authPassword.autocomplete = 'new-password';
                // Password is optional in this flow — make that explicit.
                authPasswordLabel.firstChild.textContent = 'Password (optional)';
                // No flow-switching from inside the claim step.
                authToggleLink.style.display = 'none';

        function openAuthModal(mode) {
            authMode = mode;
            refreshAuthModalUI();

            authPassword.value = '';

            authEthBtn.disabled = false;

        }
        function closeAuthModal() {
            authOverlay.classList.remove('open');
            authSubmit.disabled = false;
            authEthBtn.disabled = false;
            // If we close mid-claim, drop the ticket. The server-side TTL
            // (10 min) will clean it up eventually anyway; no harm done.
            walletClaimTicket = null;
        }

        // Click on the backdrop (but not inside the modal box) closes the modal.
        authOverlay.addEventListener('click', (e) => {
            if (e.target === authOverlay) closeAuthModal();
        });

        // Toggle signin ↔ signup. No-op in claim mode (the link is hidden).
        authToggleLink.addEventListener('click', () => {
            if (authMode === 'claim') return;
            authMode = (authMode === 'signin') ? 'signup' : 'signin';
            refreshAuthModalUI();
            authError.textContent = '';
        });

        async function submitAuthForm() {
            const username = authUsername.value.trim();
            const password = authPassword.value;

            if (authMode === 'claim') {
                // Username required, password optional. Server enforces
                // length rules — we just check presence here.
                if (!username) {
                    authError.textContent = 'Username required.';
                    return;
                }
                if (!walletClaimTicket) {
                    authError.textContent = 'Wallet session expired. Try Sign In With Ethereum again.';
                    return;
                }
                authError.textContent = '';
                authSubmit.disabled = true;
                try {
                    const body = { ticket: walletClaimTicket, username };
                    if (password) body.password = password;
                    const res = await fetch(AUTH_WORKER_URL + '/auth/wallet/claim', {
                        method: 'POST',
                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify(body),
                    });
                    const result = await res.json();
                    if (result && result.token && result.user) {
                        walletClaimTicket = null;
                        finishAuthSuccess(result);
                    } else {
                        authError.textContent = friendlyAuthError(result);
                    }
                } catch (_) {
                    authError.textContent = 'Network error. Check your connection.';
                } finally {
                    authSubmit.disabled = false;
                }
                return;
            }

            // signin / signup
            if (!username || !password) {
                authError.textContent = 'Username and password required.';
                return;
            }
            authError.textContent = '';
            authSubmit.disabled = true;
            try {
                const result = authMode === 'signin'
                    ? await authSignIn(username, password)
                    : await authSignUp(username, password);
                if (result && result.token && result.user) {
                    finishAuthSuccess(result);
                } else {
                    authError.textContent = friendlyAuthError(result);
                }
            } catch (_) {
                authError.textContent = 'Network error. Check your connection.';
            } finally {
                authSubmit.disabled = false;
            }
        }

        // Shared post-auth handler: store the token, update the menu,
        // close the modal, reconnect the WebSocket so the game server
        // sees us as the new identity. Safe to run from any of the auth
        // paths (bespoke signin/signup, wallet claim).
        function finishAuthSuccess(result) {
            setStoredToken(result.token);
            currentUser = result.user;
            updateMenuFromAuth();
            closeAuthModal();
            if (ws && ws.readyState === WebSocket.OPEN) ws.close();
            connect();
        }

        authSubmit.addEventListener('click', submitAuthForm);
        // Enter from either input triggers submit.
        [authUsername, authPassword].forEach(el => {
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') submitAuthForm();
            });
        });

        // Esc closes the modal.
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && authOverlay.classList.contains('open')) {
                closeAuthModal();
            }
        });

        // Stop pointer events on the auth overlay from reaching the Phaser canvas.
        authOverlay.addEventListener('pointerdown', e => e.stopPropagation());
        authOverlay.addEventListener('touchstart', e => e.stopPropagation(), { passive: false });

        // Sign in / sign out button inside the menu.
        menuAuthBtn.addEventListener('click', () => {
            if (currentUser) {
                // Sign out: drop the token and reconnect as anonymous.
                setStoredToken(null);
                currentUser = null;
                updateMenuFromAuth();
                if (ws && ws.readyState === WebSocket.OPEN) ws.close();
                connect();
            } else {
                openAuthModal('signin');
            }
        });

        // ── Sign In With Ethereum (SIWE / EIP-4361) ───────────────────
        //
        // Implicitly advanced: if the user doesn't have an injected
        // wallet (window.ethereum), we show a short error inline. We
        // don't link them to install one — this is meant for crypto-
        // native users.
        //
        // Flow:
        //   1. Ask the wallet for the connected address.
        //   2. GET /auth/wallet/nonce — server returns a one-time nonce.
        //   3. Build the EIP-4361 message and ask the wallet to
        //      personal_sign it.
        //   4. POST /auth/wallet/verify { message, signature, address }
        //      Either we're logged in (token + user) or we get a
        //      claim_ticket to take into the username-picker step.
        //   5. If claim_ticket: switch the modal into 'claim' mode and
        //      let the user pick a display_name (and optional password).
        async function signInWithEthereum() {
            if (!window.ethereum) {
                authError.textContent = 'No wallet detected.';
                return;
            }
            authError.textContent = '';
            authEthBtn.disabled = true;
            try {
                // 1. Request accounts. Wallets typically prompt the user
                //    here if the site hasn't been authorized before.
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                if (!accounts || accounts.length === 0) {
                    authError.textContent = 'No accounts available.';
                    return;
                }
                const address = accounts[0];

                // 2. Get a fresh nonce.
                const nonceRes = await fetch(AUTH_WORKER_URL + '/auth/wallet/nonce');
                const nonceData = await nonceRes.json();
                if (!nonceData || !nonceData.nonce) {
                    authError.textContent = 'Wallet sign-in unavailable right now.';
                    return;
                }

                // 3. Build the EIP-4361 message. Fields exactly match
                //    what parseSiweMessage on the server expects (it
                //    needs the address line and the Nonce: line).
                const domain = window.location.host;
                const uri = window.location.origin;
                const issuedAt = new Date().toISOString();
                const message =
                    domain + ' wants you to sign in with your Ethereum account:\n' +
                    address + '\n' +
                    '\n' +
                    (nonceData.statement || 'Sign in.') + '\n' +
                    '\n' +
                    'URI: ' + uri + '\n' +
                    'Version: 1\n' +
                    'Chain ID: 1\n' +
                    'Nonce: ' + nonceData.nonce + '\n' +
                    'Issued At: ' + issuedAt;

                // 4. Sign.
                let signature;
                try {
                    signature = await window.ethereum.request({
                        method: 'personal_sign',
                        params: [message, address],
                    });
                } catch (signErr) {
                    // 4001 = user rejected. Other codes = wallet issues
                    // we don't need to interpret deeply.
                    if (signErr && (signErr.code === 4001 || signErr.code === 'ACTION_REJECTED')) {
                        authError.textContent = 'Sign request rejected.';
                    } else {
                        authError.textContent = 'Wallet failed to sign.';
                    }
                    return;
                }

                // 5. Verify with our server.
                const verifyRes = await fetch(AUTH_WORKER_URL + '/auth/wallet/verify', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ message, signature, address }),
                });
                const verifyData = await verifyRes.json();

                if (verifyData && verifyData.token && verifyData.user) {
                    // Existing identity → straight to logged in.
                    finishAuthSuccess(verifyData);
                } else if (verifyData && verifyData.claim_ticket) {
                    // New identity → switch modal to claim mode and
                    // wait for the user to pick a username.
                    walletClaimTicket = verifyData.claim_ticket;
                    authMode = 'claim';
                    refreshAuthModalUI();
                    authError.textContent = '';
                    authUsername.value = '';
                    authPassword.value = '';
                    setTimeout(() => authUsername.focus(), 0);
                } else {
                    authError.textContent = friendlyWalletError(verifyData);
                }
            } catch (err) {
                console.error('Wallet sign-in error:', err);
                authError.textContent = 'Wallet sign-in failed.';
            } finally {
                authEthBtn.disabled = false;
            }
        }

        // Translate server-side wallet error codes into modal-friendly
        // text. Anything we don't have a phrasing for falls through to
        // the raw code so we still surface something useful.
        function friendlyWalletError(result) {
            if (!result) return 'Wallet sign-in failed.';
            switch (result.error) {
                case 'invalid_signature': return 'Signature didn\'t verify.';
                case 'signature_mismatch': return 'Signature didn\'t match the wallet address.';
                case 'address_mismatch': return 'Wallet address didn\'t match the signed message.';
                case 'nonce_invalid_or_expired': return 'Sign-in took too long. Please try again.';
                case 'malformed_message': return 'Internal: malformed sign-in message.';
                case 'invalid_address': return 'Invalid wallet address.';
                case 'account_disabled': return 'This account has been disabled.';
                default: return 'Wallet sign-in failed: ' + (result.error || 'unknown');
            }
        }

        authEthBtn.addEventListener('click', signInWithEthereum);

        // ── Leaderboard ───────────────────────────────────────────────
        const leaderboardOverlay = document.getElementById('leaderboard-overlay');
        const leaderboardRows = document.getElementById('leaderboard-rows');
        const leaderboardClose = document.getElementById('leaderboard-close');
        const menuLeaderboardLink = document.getElementById('menu-leaderboard-link');
        const leaderboardModeBtns = document.querySelectorAll('.leaderboard-mode-btn');
        // Which mode is currently displayed in the leaderboard panel. Falls
        // back to 'devils' until the user opens it (or picks a mode in-game).
        let leaderboardMode = 'devils';

        function updateLeaderboardModeButtons() {
            leaderboardModeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === leaderboardMode);
            });

        function renderLeaderboardEmpty(text) {
            const d = document.createElement('div');
            d.className = 'leaderboard-empty';
            d.textContent = text;
            leaderboardRows.replaceChildren(d);
        }
        function renderLeaderboard(players) {
            if (!players || players.length === 0) {
                renderLeaderboardEmpty('No players yet.');
                return;
            }
            const rows = players.map(p => {
                const row = document.createElement('div');
                const isMe = currentUser && currentUser.id === p.id;
                row.className = 'leaderboard-row' + (isMe ? ' me' : '');
                const rankEl = document.createElement('span');
                rankEl.className = 'leaderboard-rank';
                // Server provides rank — dense for Angels (teammates share),
                // sequential for Devils. We just display it.
                rankEl.textContent = (p.rank != null ? p.rank : '?') + '.';
                const name = document.createElement('span');
                name.className = 'leaderboard-name';
                name.textContent = p.display_name;
                const score = document.createElement('span');
                score.className = 'leaderboard-mmr';
                score.textContent = p.score;
                row.appendChild(rankEl);
                row.appendChild(name);
                row.appendChild(score);
                return row;
            });
            leaderboardRows.replaceChildren(...rows);
        }
        async function openLeaderboard() {
            // First-open default: match the mode the player is currently in.
            // Subsequent opens preserve whatever toggle the user last chose.
            if (!leaderboardOverlay.classList.contains('open') && currentMode) {
                leaderboardMode = currentMode;
            }
            updateLeaderboardModeButtons();
            leaderboardOverlay.classList.add('open');
            renderLeaderboardEmpty('Loading…');
            try {
                const res = await fetch(AUTH_WORKER_URL + '/stats/leaderboard?mode=' + leaderboardMode);
                const data = await res.json();
                renderLeaderboard(data.players || []);
            } catch (err) {
                renderLeaderboardEmpty('Failed to load.');
            }
        }
        function closeLeaderboard() {
            leaderboardOverlay.classList.remove('open');
        }
        menuLeaderboardLink.addEventListener('click', openLeaderboard);
        leaderboardClose.addEventListener('click', closeLeaderboard);
        leaderboardModeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.dataset.mode === leaderboardMode) return;   // no-op
                leaderboardMode = btn.dataset.mode;
                updateLeaderboardModeButtons();
                // Refetch with the new mode. Keep the overlay open.
                renderLeaderboardEmpty('Loading…');
                fetch(AUTH_WORKER_URL + '/stats/leaderboard?mode=' + leaderboardMode)
                    .then(r => r.json())
                    .then(d => renderLeaderboard(d.players || []))
                    .catch(() => renderLeaderboardEmpty('Failed to load.'));
            });
        });
        // Mobile only: click on backdrop closes (web has no clickable backdrop).
        leaderboardOverlay.addEventListener('click', (e) => {
            if (e.target === leaderboardOverlay) closeLeaderboard();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && leaderboardOverlay.classList.contains('open')) {
                closeLeaderboard();
            }
        });
        leaderboardOverlay.addEventListener('pointerdown', e => e.stopPropagation());
        leaderboardOverlay.addEventListener('touchstart', e => e.stopPropagation(), { passive: false });

        // ── Mode picker (ANGELS / DEVILS) ─────────────────────────────
        const modePickerOverlay = document.getElementById('mode-picker-overlay');
        const menuSwitchModeLink = document.getElementById('menu-switch-mode-link');
        const menuCurrentModeEl = document.getElementById('menu-current-mode');
        // The picker is non-dismissable on first load (you have to pick) and
        // dismissable when re-opened from the menu (you might change your
        // mind, in which case nothing happens and your session continues).
        let modePickerCancelable = false;
        // True while the local player is committed to a running round.
        // Mode switching is blocked in that window — both client-side
        // (disabled link) and server-side (mid-round disconnects commit
        // the player as a ghost rather than letting them slip out).
        let myInActiveRound = false;

        function showModePicker(cancelable) {
            modePickerCancelable = !!cancelable;
            modePickerOverlay.classList.remove('hidden');
        }
        function hideModePicker() {
            modePickerOverlay.classList.add('hidden');
        }
        function updateModeIndicator() {
            if (menuCurrentModeEl) {
                menuCurrentModeEl.textContent = (currentMode || '').toUpperCase();
            }
            if (menuSwitchModeLink) {
                menuSwitchModeLink.classList.toggle('disabled', myInActiveRound);
            }
        }
        function selectMode(mode) {
            // Never switch mid-round, even if the link was reachable somehow.
            if (myInActiveRound) {
                hideModePicker();
                return;
            }
            hideModePicker();
            // No-op if they picked the same mode and we already have a live
            // connection — saves the reconnect churn.
            if (mode === currentMode && ws && ws.readyState === WebSocket.OPEN) {
                return;
            }
            currentMode = mode;
            updateModeIndicator();
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            }
            connect();
        }

        document.querySelectorAll('.mode-button').forEach(btn => {
            btn.addEventListener('click', () => selectMode(btn.dataset.mode));
        });
        menuSwitchModeLink.addEventListener('click', () => {
            if (myInActiveRound) return;
            showModePicker(true);
        });
        modePickerOverlay.addEventListener('click', (e) => {
            if (modePickerCancelable && e.target === modePickerOverlay) hideModePicker();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' &&
                !modePickerOverlay.classList.contains('hidden') &&
                modePickerCancelable) {
                hideModePicker();
            }
        });

        // ========================================================================
        // Game constants
        // ========================================================================
        const CANVAS_WIDTH = 720;
        const CANVAS_HEIGHT = 1080;
        const WALL_THICKNESS = 35;
        const SIDE_WALL_DISPLAY_SIZE = WALL_THICKNESS * 0.9;
        const BLOCK_RENDER_SIZE = 90;
        const COIN_SIZE = 45;
        const PLAYER_BASE_SCALE = 1.2;
        const WORLD_HEIGHT_UP = 10000000;

        const SIM = {
            GRAVITY: 1600,
            JUMP_FORCE: 650,
            HORIZONTAL_SPEED: 400,
            MAX_FALL_SPEED: 800,
            MAX_VX: 800, MAX_VY: 2000,
            WALL_THICKNESS: 35,
            FLAP_COOLDOWN_MS: 200,
            START_Y_OFFSET: 540,  // = CANVAS_HEIGHT / 2; players spawn at vertical centre
            PLAYER_RADIUS: 30,
            PLAYER_BOUNCE: 2.0,
            STUN_DURATION_MS: 400,
            PENTAGON_SIZE: 240,
            HEXAGON_SIZE: 100,
            HEPTAGON_SIZE: 64,
            OCTAGON_SIZE: 135,
        };

        const ROUND_WAITING = 'waiting';
        const ROUND_COUNTDOWN = 'countdown';
        const ROUND_RUNNING = 'running';
        const ROUND_OVER = 'round_over';

        function clampVelocity(s) {
            if (s.vx > SIM.MAX_VX) s.vx = SIM.MAX_VX;
            if (s.vx < -SIM.MAX_VX) s.vx = -SIM.MAX_VX;
            if (s.vy > SIM.MAX_VY) s.vy = SIM.MAX_VY;
            if (s.vy < -SIM.MAX_VY) s.vy = -SIM.MAX_VY;
        }

        const RECONCILE_LERP = 0.15;
        const RECONCILE_VEL_LERP = 0.08;
        const POST_FLAP_VEL_GRACE_MS = 150;

        const INTERP_DELAY_MS = 100;
        const INTERP_BUFFER_MAX_AGE_MS = 500;

        const PROXIMITY_TRIANGLE_SIZE = 22;
        const PROXIMITY_EDGE_MARGIN = 22;
        const PROXIMITY_TEXT_LINE_HEIGHT = 24;
        const PROXIMITY_X_CLAMP_MARGIN = 50;

        // Skull emoji label for the spikes-line proximity indicator.
        // Replaces the previous "SPIKES" string for a more flavorful pictogram
        // that survives at small sizes without leaning on a stylized typography
        // pass we don't have set up yet.
        const SPIKES_LABEL = '💀';

        const COLORS = {
            background: '#ffffff',
            primary: '#000000',
            secondary: '#ffffff',
            hazard: '#000000',
        };

        // Status is now silent (UI elements handle display)
        function setStatus(t) { /* no-op: status displayed via DOM elements */ }

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = wsProtocol + '//' + window.location.host;

        let ws = null;
        let mySessionId = null;
        let pendingWorldInit = null;
        let pendingSnapshots = [];
        let sceneReady = false;
        let currentMode = null;     // 'devils' or 'angels' once the user picks

        function connect() {
            // Bail until the user has picked a mode. The mode picker click
            // handler will call us back via selectMode().
            if (!currentMode) return;
            setStatus('connecting...');
            // If we have a stored session token, send it on the WS URL. The
            // server forwards it to the Worker's /auth/verify endpoint and
            // attaches the resolved user to this connection. Invalid/expired
            // tokens fall through to anonymous play; we clear them on receipt
            // of a welcome message with user=null.
            const token = getStoredToken();
            const params = ['mode=' + currentMode];
            if (token) params.push('token=' + encodeURIComponent(token));
            const fullUrl = wsUrl + '/?' + params.join('&');
            ws = new WebSocket(fullUrl);
            ws.addEventListener('open', () => setStatus('connected'));
            ws.addEventListener('message', (event) => {
                let msg;
                try { msg = JSON.parse(event.data); } catch { return; }
                if (msg.type === 'welcome') {
                    mySessionId = msg.sessionId;
                    if (msg.mode) {
                        currentMode = msg.mode;
                        updateModeIndicator();
                    }
                    if (msg.user) {
                        // Server verified our token and tagged this session
                        // with the user. Trust its data.
                        currentUser = msg.user;
                    }
                    // If msg.user is null, do NOT clear our stored token or
                    // currentUser — the server might just be in anon mode
                    // (no AUTH_WORKER_URL env var). Token validity is decided
                    // by ensureAuthState() talking to the Worker directly.
                    updateMenuFromAuth();
                } else if (msg.type === 'world_init') {
                    if (sceneReady && window.__scene) window.__scene.applyWorldInit(msg);
                    else pendingWorldInit = msg;
                } else if (msg.type === 'snapshot') {
                    if (sceneReady && window.__scene) window.__scene.applySnapshot(msg);
                    else pendingSnapshots.push(msg);
                } else if (msg.type === 'mmr_update') {
                    if (sceneReady && window.__scene) window.__scene.applyMmrUpdate(msg.changes);
                    // If the leaderboard is open, refetch — a match just
                    // completed, so the data is stale. The Worker has
                    // already finished writing by the time this message
                    // arrives, so no extra delay needed.
                    if (leaderboardOverlay.classList.contains('open')) {
                        openLeaderboard();
                    }
                }
            });
            ws.addEventListener('close', () => setStatus('disconnected'));
            ws.addEventListener('error', (e) => { console.error('ws error', e); setStatus('error'); });
        }

        function sendFlap() {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'flap' }));
        }

        function sendReady() {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'ready' }));
        }

        class GameScene extends Phaser.Scene {
            constructor() {
                super({ key: 'GameScene' });
                this.playerVisuals = new Map();

                this.heptagonInterp = new Map();
                this.pentagonInterp = new Map();
