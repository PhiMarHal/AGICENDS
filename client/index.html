            }

            updateSpectatingAngelsControls(mySnapData) {
                if (!this.spectatingJoinButton) return;   // not in Angels spectator UI
                if (!mySnapData) return;
                const inRound = mySnapData.inRound === true;
                if (inRound) {
                    // Player is in the rez queue (dead in-round). Hide
                    // JOIN, show queue text with their position.
                    this.spectatingJoinButton.setVisible(false);
                    this.spectatingJoinButtonText.setVisible(false);
                    const q = mySnapData.queuePosition;
                    const msg = q != null
                        ? q + ' interval' + (q === 1 ? '' : 's') + ' until revive'
                        : 'Waiting for revive…';
                    this.spectatingQueueText.setText(msg);
                    this.spectatingQueueText.setVisible(true);
                } else {
                    // True spectator. Show JOIN — unless already tapped,
                    // in which case the optimistic queue text is up.
                    this.spectatingQueueText.setVisible(this.joinTapped === true);
                    if (!this.joinTapped) {
                        this.spectatingJoinButton.setVisible(true);
                        this.spectatingJoinButtonText.setVisible(true);
                    }
                }
            }

            cycleSpectatedPlayer(dir) {
                if (!this.aliveInRoundPlayers || this.aliveInRoundPlayers.length <= 1) return;
                const idx = this.aliveInRoundPlayers.findIndex(p => p.id === this.spectatingPlayerId);
                const base = idx === -1 ? 0 : idx;
                const next = (base + dir + this.aliveInRoundPlayers.length) % this.aliveInRoundPlayers.length;
                const target = this.aliveInRoundPlayers[next];
                this.spectatingPlayerId = target.id;
                this.spectatorCameraY = target.y;
            }

            hideSpectatingUI() {
                if (this.spectatingText) { this.spectatingText.destroy(); this.spectatingText = null; }
                if (this.spectatingLeftArrow) { this.spectatingLeftArrow.destroy(); this.spectatingLeftArrow = null; }
                if (this.spectatingRightArrow) { this.spectatingRightArrow.destroy(); this.spectatingRightArrow = null; }
                if (this.spectatingJoinButton) { this.spectatingJoinButton.destroy(); this.spectatingJoinButton = null; }
                if (this.spectatingJoinButtonText) { this.spectatingJoinButtonText.destroy(); this.spectatingJoinButtonText = null; }
                if (this.spectatingQueueText) { this.spectatingQueueText.destroy(); this.spectatingQueueText = null; }
                this.joinTapped = false;
            }

            updateScoreboard(players) {
                // In Angels mode the team shares one score, already displayed
                // in the top counter. The per-player scoreboard would just be
                // a repeating list of identical numbers — and its absence
                // doubles as a visual cue that you're in co-op, not versus.
                if (currentMode === 'angels') {
                    scoreboardEl.classList.remove('has-scores');
                    scoreboardEl.replaceChildren();
                    return;
                }
                // Build a sorted list of every in-round player with a non-zero
                // score, then render one line per player into #scoreboard. On
                // narrow viewports a CSS media query hides everything past the
                // first line — so on mobile this effectively shows the leader,
                // and on web it shows the full round leaderboard.
                const scores = [];
                for (const id in players) {
                    if (!players[id].inRound) continue;
                    const score = players[id].score || 0;
                    if (score <= 0) continue;
                    scores.push({
                        id,
                        displayName: players[id].displayName,
                        score,
                    });
                }
                scores.sort((a, b) => b.score - a.score);

                if (scores.length === 0) {
                    scoreboardEl.classList.remove('has-scores');
                    scoreboardEl.replaceChildren();
                    return;
                }

                scoreboardEl.classList.add('has-scores');
                scoreboardEl.replaceChildren(...scores.map(s => {
                    const line = document.createElement('div');
                    line.className = 'scoreboard-line';
                    const name = s.displayName || s.id;
                    line.textContent = `${name} - ${s.score}`;
                    return line;
                }));
            }

            applySnapshot(snap) {
                if (snap.tServer != null && snap.tServer > this.latestServerTime) {
                    this.latestServerTime = snap.tServer;
                }

                const prevRoundState = this.roundState;
                if (snap.roundState) this.roundState = snap.roundState;

                // Update the "am I committed to a running round?" flag,
                // which gates whether the menu's Switch mode link is
                // clickable. Server still enforces commit-on-disconnect.
                const mePlayer = snap.players && snap.players[mySessionId];
                myInActiveRound = (
                    this.roundState === ROUND_RUNNING &&
                    !!(mePlayer && mePlayer.inRound)
                );
                updateModeIndicator();

                if (prevRoundState !== ROUND_OVER && this.roundState === ROUND_OVER) {
                    this.showRoundOverUI(snap.finalScores || []);
                } else if (this.roundState === ROUND_OVER) {
                    this.refreshRoundOverScores(snap.finalScores || []);
                } else if (prevRoundState === ROUND_OVER && this.roundState !== ROUND_OVER) {
                    this.hideGameOverUI();
                }

                // ── ROUND_WAITING ──────────────────────────────────────────────────
                if (this.roundState === ROUND_WAITING) {
                    this.showWaitingUI();
                } else if (prevRoundState === ROUND_WAITING && this.roundState !== ROUND_WAITING) {
                    this.hideWaitingUI();
                }

                if (this.roundState === ROUND_COUNTDOWN) {
                    this.showCountdownUI();
                    this.updateCountdownUI(snap.countdownRemainingMs || 0);

                    // Detect newly-joined players and show "[name] joined" notifications
                    if (snap.readyPlayerIds) {
                        for (const pid of snap.readyPlayerIds) {
                            if (!this.countdownReadySet.has(pid)) {
                                this.countdownReadySet.add(pid);
                                const name = (snap.players && snap.players[pid] && snap.players[pid].displayName) || pid;
                                this.showJoinedNotification(name);
                            }
                        }
                    }

                    // Hide TAP TO JOIN once this client has joined
                    if (snap.myReady) {
                        if (this.countdownJoinButton) { this.countdownJoinButton.destroy(); this.countdownJoinButton = null; }
                        if (this.countdownJoinButtonText) { this.countdownJoinButtonText.destroy(); this.countdownJoinButtonText = null; }
                        if (this._doJoin) {
                            this.input.off('pointerdown', this._doJoin, this);
                            if (this.spaceKey) this.spaceKey.off('down', this._doJoin, this);
                            this._doJoin = null;
                        }
                    }
                } else if (prevRoundState === ROUND_COUNTDOWN && this.roundState !== ROUND_COUNTDOWN) {
                    this.hideCountdownUI();
                }

                // ── Spectating detection ───────────────────────────────────────────
                const mySnapData = snap.players ? snap.players[mySessionId] : null;
                if (mySnapData && !mySnapData.inRound && this.roundState === ROUND_RUNNING && !this.isSpectating) {
                    this.isSpectating = true;
                    this.cameras.main.stopFollow();
                    this.showSpectatingUI();
                }
                if (this.isSpectating) {
                    // Build sorted list of alive inRound players (lowest Y = highest altitude = index 0)
                    this.aliveInRoundPlayers = [];
                    if (snap.players) {
                        for (const [id, p] of Object.entries(snap.players)) {
                            if (p.inRound && p.alive) this.aliveInRoundPlayers.push({ id, y: p.y });
                        }
                        this.aliveInRoundPlayers.sort((a, b) => a.y - b.y);
                    }

                    // Auto-switch if the current spectated player has died
                    if (this.spectatingPlayerId && snap.players) {
                        const sp = snap.players[this.spectatingPlayerId];
                        if (!sp || !sp.alive || !sp.inRound) this.spectatingPlayerId = snap.leadingPlayerId;
                    }
                    if (!this.spectatingPlayerId) this.spectatingPlayerId = snap.leadingPlayerId;

                    // Update camera target from selected player
                    if (this.spectatingPlayerId && snap.players && snap.players[this.spectatingPlayerId]) {
                        this.spectatorCameraY = snap.players[this.spectatingPlayerId].y;
                    } else if (snap.leadingPlayerY != null) {
                        this.spectatorCameraY = snap.leadingPlayerY;
                    }

                    // Update "Spectating [name]" text
                    if (this.spectatingText) {
                        let name = '';
                        if (this.spectatingPlayerId) {
                            const p = snap.players && snap.players[this.spectatingPlayerId];
                            name = (p && p.displayName) || this.spectatingPlayerId;
                        }
                        this.spectatingText.setText('Spectating ' + name);
                    }

                    // Show arrows only when multiple players are alive to cycle through
                    const showArrows = this.aliveInRoundPlayers.length > 1;
                    if (this.spectatingLeftArrow) this.spectatingLeftArrow.setVisible(showArrows);
                    if (this.spectatingRightArrow) this.spectatingRightArrow.setVisible(showArrows);

                    // Angels: drive the JOIN button / rez-queue text from
                    // mySnapData. Becomes a queue position as soon as the
                    // player is in the round.
                    this.updateSpectatingAngelsControls(mySnapData);
                }

                if (snap.newSideWallSegments) for (const seg of snap.newSideWallSegments) this.spawnSideWallSegment(seg);
                if (snap.newBlocks) for (const b of snap.newBlocks) this.spawnBlockSprite(b);
                if (snap.newCoins) for (const c of snap.newCoins) this.spawnCoinSprite(c);
                if (snap.newPentagons) for (const p of snap.newPentagons) this.spawnPentagonSprite(p);
                if (snap.newHexagonPairs) for (const h of snap.newHexagonPairs) this.spawnHexagonPairSprite(h);
                if (snap.newHeptagons) for (const h of snap.newHeptagons) this.spawnHeptagonSprite(h);
                if (snap.newOctagons) for (const o of snap.newOctagons) this.spawnOctagonSprite(o);
                if (snap.newProjectiles) for (const p of snap.newProjectiles) this.spawnProjectileSprite(p);

                if (snap.removedBlockIds) for (const id of snap.removedBlockIds) {
                    const s = this.blockSprites.get(id);
                    if (s) { s.destroy(); this.blockSprites.delete(id); }
                }
                if (snap.removedCoinIds) for (const id of snap.removedCoinIds) {
                    const s = this.coinSprites.get(id);
                    if (s) { s.destroy(); this.coinSprites.delete(id); }
                }
                if (snap.removedPentagonIds) for (const id of snap.removedPentagonIds) {
                    const s = this.pentagonSprites.get(id);
                    if (s) { s.destroy(); this.pentagonSprites.delete(id); }
                    this.pentagonInterp.delete(id);
                }
                if (snap.removedHexagonPairIds) for (const id of snap.removedHexagonPairIds) {
                    const refs = this.hexagonPairSprites.get(id);
                    if (refs) {
                        refs.leftHex.destroy(); refs.rightHex.destroy();
                        refs.beamRect.destroy(); refs.beamGfx.destroy();
                        this.hexagonPairSprites.delete(id);
                    }
                }
                if (snap.removedHeptagonIds) for (const id of snap.removedHeptagonIds) {
                    const s = this.heptagonSprites.get(id);
                    if (s) { s.destroy(); this.heptagonSprites.delete(id); }
                    this.heptagonInterp.delete(id);
                }
                if (snap.removedOctagonIds) for (const id of snap.removedOctagonIds) {
                    const s = this.octagonSprites.get(id);
                    if (s) { s.destroy(); this.octagonSprites.delete(id); }
                }
                if (snap.removedProjectileIds) for (const id of snap.removedProjectileIds) {
                    const s = this.projectileSprites.get(id);
                    if (s) { s.destroy(); this.projectileSprites.delete(id); }
                    this.projectileInterp.delete(id);
                }

                if (snap.blockScales) {
                    for (const id in snap.blockScales) {
                        const s = this.blockSprites.get(id);
                        if (s) s.setScale(snap.blockScales[id]);
                    }
                }

                const nowClient = performance.now();
                if (snap.pentagonStates) {
                    for (const id in snap.pentagonStates) {
                        const st = snap.pentagonStates[id];
                        const rec = this.pentagonInterp.get(id);
                        if (rec) {
                            rec.x = st.x; rec.y = st.y;
                            rec.angle = st.angle;
                            rec.lastUpdateClientMs = nowClient;
                        }
                    }
                }
                if (snap.heptagonStates) {
                    for (const id in snap.heptagonStates) {
                        const st = snap.heptagonStates[id];
                        const rec = this.heptagonInterp.get(id);
                        if (rec) {
                            rec.x = st.x; rec.y = st.y;
                            rec.vx = st.vx; rec.vy = st.vy;
                            rec.angle = st.angle;
                            rec.lastUpdateClientMs = nowClient;
                        }
                    }
                }
                if (snap.projectileStates) {
                    for (const id in snap.projectileStates) {
                        const st = snap.projectileStates[id];
                        const rec = this.projectileInterp.get(id);
                        if (rec) {
                            rec.x = st.x; rec.y = st.y;
                            rec.vx = st.vx; rec.vy = st.vy;
                            rec.lastUpdateClientMs = nowClient;
                        }
                        const sprite = this.projectileSprites.get(id);
                        if (sprite && st.scale != null) sprite.setScale(st.scale);
                    }
                }

                if (snap.hexagonPairStates) {
                    for (const id in snap.hexagonPairStates) {
                        const refs = this.hexagonPairSprites.get(id);
                        if (!refs) continue;
                        const st = snap.hexagonPairStates[id];
                        refs.leftHex.angle = st.leftAngle;
                        refs.rightHex.angle = st.rightAngle;
                        if (st.beamActive) {
                            refs.beamRect.setVisible(true);
                            const beamWidth = (refs.rightX - refs.leftX) - SIM.HEXAGON_SIZE;
                            refs.beamRect.setSize(beamWidth, st.beamHeight);
                        } else {
                            refs.beamRect.setVisible(false);
                            refs.beamGfx.clear();
                        }
                    }
                }

                if (snap.octagonStates) {
                    for (const id in snap.octagonStates) {
                        const sprite = this.octagonSprites.get(id);
                        if (!sprite) continue;
                        const st = snap.octagonStates[id];
                        sprite.setScale(st.pulseScale);
                    }
                }

                if (snap.spikeY != null) {
                    this.spikeContainer.y = snap.spikeY;
                    this.latestSpikeY = snap.spikeY;
                }

                const seenIds = new Set();
                for (const id in snap.players) {
                    seenIds.add(id);
                    const p = snap.players[id];
                    const isMe = (id === mySessionId);

                    // Players who haven't joined this round get no sprite or proximity entry
                    if (!p.inRound && !p.pendingInRound) {
                        const stale = this.playerVisuals.get(id);
                        if (stale) {
                            this.destroyPlayerVisual(stale);
                            this.playerVisuals.delete(id);
                            this.interpBuffers.delete(id);
                            this.latestPlayerData.delete(id);
                        }
                        continue;
                    }

                    this.latestPlayerData.set(id, { x: p.x, y: p.y, alive: p.alive, displayName: p.displayName });
                    let v = this.playerVisuals.get(id);
                    if (!v) {
                        v = this.createPlayerVisual(id, isMe);
                        this.playerVisuals.set(id, v);
                        if (isMe) {
                            this.cameraTarget = v.sprite;
                            if (!this.isSpectating) {
                                this.cameras.main.startFollow(v.sprite, true, 0.1, 0.1);
                            }
                        }
                    }

                    // Keep the floating name label in sync with the player's
                    // current display name. setText is a no-op if the string
                    // is identical, but we still gate on lastNameText to skip
                    // the comparison cost on every frame.
                    const labelName = p.displayName || id;
                    if (v.lastNameText !== labelName) {
                        v.nameText.setText(labelName);
                        v.lastNameText = labelName;
                    }

                    if (isMe) {
                        if (this.myState === null) {
                            this.myState = {
                                x: p.x, y: p.y, vx: p.vx, vy: p.vy,
                                alive: p.alive,
                                lastFlapTime: -Infinity,
                                nextFlapDirection: 1,
                            };
                        }
                        this.myServerTarget = {
                            x: p.x, y: p.y, vx: p.vx, vy: p.vy,
                            alive: p.alive, score: p.score,
                            hasStarted: snap.hasStarted, stunned: p.stunned,
                        };
                        if (this.myState.alive && !p.alive) this.myState.alive = false;

                        if (this.scoreText && !this.isSpectating) {
                            const s = (p.score || 0).toString();
                            if (this.scoreText.text !== s) {
                                this.scoreText.setText(s);
                                this.tweens.add({ targets: this.scoreText, scale: 1.2, duration: 100, yoyo: true });
                            }
                        }

                        const wasAlive = this.previousAlive.get(id);
                        if (wasAlive !== false && p.alive === false) {
                            v.sprite.setTint(0xff0000);
                            v.eyesContainer.setVisible(false);
                            // Transition to spectating 2 s after dying (if not already spectating)
                            if (!this.isSpectating && !this.spectateOnDeathTimer) {
                                this.spectateOnDeathTimer = this.time.delayedCall(2000, () => {
                                    this.spectateOnDeathTimer = null;
                                    if (!this.isSpectating) {
                                        this.isSpectating = true;
                                        this.cameras.main.stopFollow();
                                        this.showSpectatingUI();
                                    }
                                });
                            }
                        } else if (wasAlive === false && p.alive === true) {
                            // Resurrection (Angels mode). Clear the dead-player
                            // visual cues. If this is the local player, exit
                            // spectator mode and re-follow our own sprite —
                            // otherwise the camera stays parked on whoever
                            // was being spectated and the player can't see
                            // themselves come back.
                            v.sprite.clearTint();
                            v.eyesContainer.setVisible(true);
                            if (id === mySessionId) {
                                if (this.spectateOnDeathTimer) {
                                    this.spectateOnDeathTimer.remove(false);
                                    this.spectateOnDeathTimer = null;
                                }
                                if (this.isSpectating) {
                                    this.isSpectating = false;
                                    this.spectatingPlayerId = null;
                                    this.hideSpectatingUI();
                                }
                                // Teleport client-side prediction to the
                                // server's authoritative new position. Without
                                // this, myState still thinks we're at the
                                // dead-fall position deep in the spike zone,
                                // so the sprite — and the camera — render
                                // there even though server says we're alive.
                                if (this.myState) {
                                    this.myState.x = p.x;
                                    this.myState.y = p.y;
                                    this.myState.vx = p.vx;
                                    this.myState.vy = p.vy;
                                    this.myState.alive = true;
                                    this.myState.lastFlapTime = -Infinity;
                                }
                                // Snap the sprite (and eyes + name) to the
                                // new position BEFORE attaching the camera.
                                // Otherwise startFollow briefly latches
                                // onto the sprite at its previous default
                                // spawn position, causing a one-frame
                                // whiplash through the bottom of the
                                // canvas before update() moves it.
                                v.sprite.x = p.x;
                                v.sprite.y = p.y;
                                v.eyesContainer.x = p.x;
                                v.eyesContainer.y = p.y;
                                if (v.nameText) {
                                    v.nameText.x = p.x;
                                    v.nameText.y = p.y - 60;
                                }
                                this.cameras.main.startFollow(v.sprite, true, 0.1, 0.1);
                                // Also center the camera immediately on the
                                // spawn point, skipping the lerp from
                                // wherever the spectator camera was.
                                this.cameras.main.centerOn(p.x, p.y);
                                // Snap interp buffer so the sprite teleports to
                                // the new spawn point cleanly instead of
                                // gliding across screen from the dead position.
                                this.resetInterpFor(id, snap.tServer || 0, p);
                            }
                        }
                        this.previousAlive.set(id, p.alive);
                    } else {
                        this.pushInterpSample(id, snap.tServer || 0, p);
                    }
                }

                // Update scoreboard every snapshot
                if (snap.players) {
                    this.updateScoreboard(snap.players);
                }

                // When spectating, show the leading player's score instead of own (which is 0)
                if (this.isSpectating && this.spectatingPlayerId && snap.players) {
                    const sp = snap.players[this.spectatingPlayerId];
                    if (sp && this.scoreText) {
                        const s = (sp.score || 0).toString();
                        if (this.scoreText.text !== s) {
                            this.scoreText.setText(s);
                            this.tweens.add({ targets: this.scoreText, scale: 1.2, duration: 100, yoyo: true });
                        }
                    }
                }

                for (const [id, v] of this.playerVisuals) {
                    if (!seenIds.has(id)) {
                        this.destroyPlayerVisual(v);
                        this.playerVisuals.delete(id);
                        this.interpBuffers.delete(id);
                        this.latestPlayerData.delete(id);
                        if (this.cameraTarget === v.sprite) {
                            this.cameraTarget = null;
                            this.cameras.main.stopFollow();
                        }
                    }
                }

                if (snap.events) {
                    for (const ev of snap.events) {
                        if (ev.type === 'coin_collected') this.playCoinFX(ev.x, ev.y);
                        else if (ev.type === 'hit') {
                            this.spawnParticles(ev.x, ev.y);
                            if (ev.playerId === mySessionId) {
                                this.cameras.main.shake(80, 0.004);
                            }
                        } else if (ev.type === 'interval_reached') {
                            this.cameras.main.flash(300, 255, 255, 255);
                        }
                    }
                }
            }

            playFlapJuice(v) {
                const stretchY = 1.6, squishX = 0.6;
                const slant = (Math.random() - 0.5) * 30;
                const base = PLAYER_BASE_SCALE;
                this.tweens.killTweensOf(v.sprite);
                this.tweens.chain({
                    targets: v.sprite,
                    tweens: [
                        {
                            scaleX: squishX * base, scaleY: stretchY * base, angle: slant,
                            duration: 120, ease: 'Sine.easeOut'
                        },
                        {
                            scaleX: 1.3 * base, scaleY: 0.8 * base, angle: -slant * 0.5,
                            duration: 180, ease: 'Quad.easeInOut'
                        },
                        {
                            scaleX: base, scaleY: base, angle: 0,
                            duration: 400, ease: 'Elastic.easeOut', easeParams: [1, 0.5]
                        }
                    ]
                });
            }

            playCoinFX(x, y) {
                const shockWhite = this.add.circle(x, y, 10, 0xffffff, 0).setStrokeStyle(3, 0xffffff).setDepth(50);
                const shockBlack = this.add.circle(x, y, 10, 0x000000, 0).setStrokeStyle(3, 0x000000).setDepth(50);
                this.tweens.add({
                    targets: shockWhite, radius: 120, alpha: { from: 1, to: 0 },
                    duration: 450, ease: 'Quad.easeOut', onComplete: () => shockWhite.destroy()
                });
                this.tweens.add({
                    targets: shockBlack, radius: 140, alpha: { from: 1, to: 0 },
                    delay: 50, duration: 500, ease: 'Quad.easeOut', onComplete: () => shockBlack.destroy()
                });
            }

            spawnParticles(x, y) {
                for (let i = 0; i < 10; i++) {
                    const p = this.add.image(x, y, 'particle').setDepth(20);
                    const vx = (Math.random() - 0.5) * 600;
                    const vy = -Math.random() * 400 - 200;
                    this.tweens.add({
                        targets: p,
                        x: p.x + vx * 0.6,
                        y: p.y + vy * 0.6 + 144,
                        alpha: 0, scale: 0.1, angle: Math.random() * 360,
                        duration: 600, ease: 'Cubic.easeIn',
                        onComplete: () => p.destroy()
                    });
                }
            }

            showRoundOverUI(finalScores) {
                if (this.gameOverOverlayShown) {
                    this.refreshRoundOverScores(finalScores);
                    return;
                }
                this.gameOverOverlayShown = true;

                const objs = {
                    overlay: null,
                    title: null,
                    scoreLines: [],
                    mmrLine: null,
                    countdownText: null,
                    readyButton: null,
                    readyButtonText: null,
                    revealTimers: [],     // Phaser TimerEvents — torn down in hideGameOverUI
                };

                objs.overlay = this.add.rectangle(
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2,
                    CANVAS_WIDTH, CANVAS_HEIGHT, 0x000000, 0.8
                ).setScrollFactor(0).setDepth(200);

                objs.title = this.add.text(
                    CANVAS_WIDTH / 2, 220, 'GAME OVER',
                    {
                        fontFamily: 'Arial', fontSize: '64px', fontStyle: 'bold',
                        color: '#ffffff', stroke: '#000000', strokeThickness: 6
                    }
                ).setOrigin(0.5).setScrollFactor(0).setDepth(201);

                const maxLines = 8;
                for (let i = 0; i < maxLines; i++) {
                    const lineY = 320 + i * 44;
                    const t = this.add.text(CANVAS_WIDTH / 2, lineY, '', {
                        fontFamily: 'Arial', fontSize: '28px', fontStyle: 'bold',
                        color: '#ffffff', stroke: '#000000', strokeThickness: 4,
                    }).setOrigin(0.5).setScrollFactor(0).setDepth(201).setVisible(false);
                    objs.scoreLines.push(t);
                }

                // MMR change line, sits just above the READY/countdown slot.
                // Hidden until the mmr_update message arrives (and only shown
                // then if the local user participated in MMR for this round).
                objs.mmrLine = this.add.text(
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT - 230, '',
                    {
                        fontFamily: 'Arial', fontSize: '26px', fontStyle: 'bold',
                        color: '#ffffff', stroke: '#000000', strokeThickness: 4,
                    }
                ).setOrigin(0.5).setScrollFactor(0).setDepth(201).setVisible(false);

                // Visible countdown that occupies the READY button's slot until
                // the gate elapses. It ticks 4 → 3 → 2 → 1 over four seconds,
                // then disappears as the button becomes interactive. The server
                // enforces the same 4 s gate, so a click on the button as soon
                // as it appears will be accepted; an honest user never gets a
                // stuck WAITING... state.
                objs.countdownText = this.add.text(
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT - 160, 'New round in 4...',
                    {
                        fontFamily: 'Arial', fontSize: '32px', fontStyle: 'bold',
                        color: '#ffffff', stroke: '#000000', strokeThickness: 4,
                    }
                ).setOrigin(0.5).setScrollFactor(0).setDepth(201);

                objs.readyButton = this.add.rectangle(
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT - 160, 280, 70, 0xffffff
                ).setScrollFactor(0).setDepth(201).setInteractive({ useHandCursor: true })
                    .setVisible(false);

                objs.readyButtonText = this.add.text(
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT - 160, 'READY',
                    { fontFamily: 'Arial', fontSize: '32px', fontStyle: 'bold', color: '#000000' }
                ).setOrigin(0.5).setScrollFactor(0).setDepth(202).setVisible(false);

                objs.readyButton.on('pointerdown', () => {
                    sendReady();
                    objs.readyButtonText.setText('WAITING...');
                    objs.readyButton.fillColor = 0xcccccc;
                });

                this.gameOverObjs = objs;
                this.setScoreTexts(finalScores);

                // Staggered reveal of score lines (in parallel with the countdown).
                // If the overlay is torn down before a timer fires, the guard
                // inside each callback short-circuits.
                const STAGGER_FIRST_MS = 1000;
                const STAGGER_BETWEEN_MS = 150;
                const numScores = Math.min(finalScores.length, maxLines);

                for (let i = 0; i < numScores; i++) {
                    const lineIdx = i;
                    const delay = STAGGER_FIRST_MS + i * STAGGER_BETWEEN_MS;
                    objs.revealTimers.push(this.time.delayedCall(delay, () => {
                        if (this.gameOverObjs !== objs) return;
                        objs.scoreLines[lineIdx].setVisible(true);
                    }));
                }

                // Countdown ticks. At each second mark the visible text updates;
                // at t=4 s the countdown hides and the button appears.
                const COUNTDOWN_TOTAL_MS = 4000;
                for (let n = 3; n >= 1; n--) {
                    const elapsed = (4 - n) * 1000;
                    objs.revealTimers.push(this.time.delayedCall(elapsed, () => {
                        if (this.gameOverObjs !== objs) return;
                        objs.countdownText.setText('New round in ' + n + '...');
                    }));
                }
                objs.revealTimers.push(this.time.delayedCall(COUNTDOWN_TOTAL_MS, () => {
                    if (this.gameOverObjs !== objs) return;
                    objs.countdownText.setVisible(false);
                    objs.readyButton.setVisible(true);
                    objs.readyButtonText.setVisible(true);
                }));
            }

            setScoreTexts(finalScores) {
                if (!this.gameOverObjs) return;
                const lines = this.gameOverObjs.scoreLines;
                for (let i = 0; i < lines.length; i++) {
                    if (i < finalScores.length) {
                        const entry = finalScores[i];
                        const rank = (i + 1) + '.';
                        const isMe = entry.id === mySessionId;
                        const name = entry.displayName || entry.id;
                        const label = `${rank} ${name}${isMe ? ' (you)' : ''}  -  ${entry.score}`;
                        lines[i].setText(label);
                    } else {
                        lines[i].setText('');
                    }
                }
            }

            refreshRoundOverScores(finalScores) {
                // Just update texts on already-existing lines; visibility is
                // controlled by the reveal timers in showRoundOverUI.
                this.setScoreTexts(finalScores);
            }

            // Called when the server forwards a Worker mmr_update. Always
            // updates currentUser.mmr if the local user is in the changes,
            // and fills the GAME OVER mmrLine if the overlay is visible.
            applyMmrUpdate(changes) {
                if (!changes || !currentUser) return;
                const change = changes[String(currentUser.id)];
                if (!change) return;

                currentUser.mmr = change.new_mmr;
                updateMenuFromAuth();

                if (this.gameOverObjs && this.gameOverObjs.mmrLine) {
                    const sign = change.delta > 0 ? '+' : '';
                    this.gameOverObjs.mmrLine.setText(
                        sign + change.delta + ' MMR (' + change.new_mmr + ' MMR)'
                    );
                    this.gameOverObjs.mmrLine.setVisible(true);
                }
            }

            hideGameOverUI() {
                if (!this.gameOverObjs) return;
                const o = this.gameOverObjs;
                if (o.revealTimers) {
                    for (const t of o.revealTimers) t.remove(false);
                }
                if (o.overlay) o.overlay.destroy();
                if (o.title) o.title.destroy();
                for (const t of o.scoreLines) t.destroy();
                if (o.mmrLine) o.mmrLine.destroy();
                if (o.countdownText) o.countdownText.destroy();
                if (o.readyButton) o.readyButton.destroy();
                if (o.readyButtonText) o.readyButtonText.destroy();
                this.gameOverObjs = null;
                this.gameOverOverlayShown = false;
            }

            applyFlapToMyState() {
                if (!this.myState || !this.myState.alive) return false;
                if (this.roundState !== ROUND_RUNNING) return false;
                if (this.myServerTarget && this.myServerTarget.stunned) return false;
                const now = performance.now();
                if (now - this.myState.lastFlapTime < SIM.FLAP_COOLDOWN_MS) return false;

                if (!musicStarted) startMusic();

                this.myState.vy = -SIM.JUMP_FORCE;
                this.myState.vx = SIM.HORIZONTAL_SPEED * this.myState.nextFlapDirection;
                this.myState.nextFlapDirection = (this.myState.nextFlapDirection === 1) ? -1 : 1;
                this.myState.lastFlapTime = now;
                clampVelocity(this.myState);
                return true;
            }

            stepMyState(deltaSeconds) {
                if (!this.myState || !this.myState.alive) return;
                if (this.myServerTarget && !this.myServerTarget.hasStarted) return;
                if (this.roundState !== ROUND_RUNNING) return;
                if (this.isSpectating) return;

                const s = this.myState;
                s.vy += SIM.GRAVITY * deltaSeconds;
                if (s.vy > SIM.MAX_FALL_SPEED) s.vy = SIM.MAX_FALL_SPEED;
                s.x += s.vx * deltaSeconds;
                s.y += s.vy * deltaSeconds;

                const minX = SIM.WALL_THICKNESS + SIM.PLAYER_RADIUS;
                const maxX = CANVAS_WIDTH - SIM.WALL_THICKNESS - SIM.PLAYER_RADIUS;
                if (s.x < minX) {
                    s.x = minX;
                    if (s.vx < 0) s.vx = -s.vx * (1 + SIM.PLAYER_BOUNCE * 0.5);
                }
                if (s.x > maxX) {
                    s.x = maxX;
                    if (s.vx > 0) s.vx = -s.vx * (1 + SIM.PLAYER_BOUNCE * 0.5);
                }
                clampVelocity(s);
            }

            reconcileMyState() {
                if (!this.myState || !this.myServerTarget) return;
                if (!this.myState.alive) return;
                const t = this.myServerTarget;
                this.myState.x += (t.x - this.myState.x) * RECONCILE_LERP;
                this.myState.y += (t.y - this.myState.y) * RECONCILE_LERP;
                const now = performance.now();
                const sinceLastFlap = now - this.myState.lastFlapTime;
                if (sinceLastFlap > POST_FLAP_VEL_GRACE_MS) {
                    this.myState.vx += (t.vx - this.myState.vx) * RECONCILE_VEL_LERP;
                    this.myState.vy += (t.vy - this.myState.vy) * RECONCILE_VEL_LERP;
                }
            }

            updateRemotePlayerVisuals() {
                const renderTime = this.latestServerTime - INTERP_DELAY_MS;
                for (const [id, v] of this.playerVisuals) {
                    if (id === mySessionId) continue;
                    const sample = this.sampleInterpState(id, renderTime);
                    if (!sample) continue;
                    v.sprite.x = sample.x;
                    v.sprite.y = sample.y;
                    v.eyesContainer.x = sample.x;
                    v.eyesContainer.y = sample.y;
                    v.nameText.x = sample.x;
                    v.nameText.y = sample.y - 60;

                    const prevVx = v.lastVx;
                    if (Math.abs(sample.vx) > 50 && Math.sign(sample.vx) !== Math.sign(prevVx) && sample.alive) {
                        this.playFlapJuice(v);
                    }
                    v.lastVx = sample.vx;

                    v.targetEye.x = Phaser.Math.Clamp(sample.vx / 20, -6, 6);
                    v.targetEye.y = Phaser.Math.Clamp(sample.vy / 40, -4, 4);
                    v.targetPupil.x = v.targetEye.x * 0.5;
                    v.targetPupil.y = v.targetEye.y * 0.5;

                    const wasAlive = this.previousAlive.get(id);
                    if (wasAlive !== false && sample.alive === false) {
                        v.sprite.setTint(0xff0000);
                        v.eyesContainer.setVisible(false);
                    } else if (wasAlive === false && sample.alive === true) {
                        // Interp caught up to a post-resurrection sample —
                        // clear the death visuals. Without this branch the
                        // earlier death-detection would re-fire on every
                        // stale alive=false sample and leave the player
                        // looking dead even after the server brought them
                        // back.
                        v.sprite.clearTint();
                        v.eyesContainer.setVisible(true);
                    }
                    this.previousAlive.set(id, sample.alive);
                }
            }

            updatePolygonExtrapolation() {
                const nowClient = performance.now();
                const maxExtrapolateMs = 50;

                for (const [id, sprite] of this.heptagonSprites) {
                    const rec = this.heptagonInterp.get(id);
                    if (!rec) continue;
                    const dt = Math.min(nowClient - rec.lastUpdateClientMs, maxExtrapolateMs) / 1000;
                    sprite.x = rec.x + rec.vx * dt;
                    sprite.y = rec.y + rec.vy * dt;
                    sprite.angle = rec.angle;
                }

                for (const [id, sprite] of this.pentagonSprites) {
                    const rec = this.pentagonInterp.get(id);
                    if (!rec) continue;
                    const dt = Math.min(nowClient - rec.lastUpdateClientMs, maxExtrapolateMs) / 1000;
                    sprite.x = rec.x;
                    sprite.y = rec.y + 80 * dt;
                    sprite.angle = rec.angle;
                }

                for (const [id, sprite] of this.projectileSprites) {
                    const rec = this.projectileInterp.get(id);
                    if (!rec) continue;
                    const dt = Math.min(nowClient - rec.lastUpdateClientMs, maxExtrapolateMs) / 1000;
                    sprite.x = rec.x + rec.vx * dt;
                    sprite.y = rec.y + rec.vy * dt;
                }
            }

            drawBeamDashes(refs, time) {
                const gfx = refs.beamGfx;
                gfx.clear();
                if (!refs.beamRect.visible) return;

                const leftX = refs.leftX + SIM.HEXAGON_SIZE / 2;
                const rightX = refs.rightX - SIM.HEXAGON_SIZE / 2;
                const centerX = (leftX + rightX) / 2;
                const centerY = refs.y;

                gfx.lineStyle(2, 0x888888, 0.5);
                const speed = 0.4;
                const dashLength = 20;
                const dashSpacing = 60;
                const lanes = [-6, 0, 6];

                for (let laneIdx = 0; laneIdx < lanes.length; laneIdx++) {
                    const yPos = centerY + lanes[laneIdx];
                    const laneTimeOffset = laneIdx * 200;
                    const progress = ((time + laneTimeOffset) * speed) % dashSpacing;
                    for (let d = 0; d < 6; d++) {
                        const dashX = leftX + progress + (d * dashSpacing);
                        if (dashX > leftX && dashX + dashLength < centerX) {
                            gfx.beginPath();
                            gfx.moveTo(dashX, yPos);
                            gfx.lineTo(dashX + dashLength, yPos);
                            gfx.strokePath();
                        }
                    }
                    for (let d = 0; d < 6; d++) {
                        const dashX = rightX - progress - (d * dashSpacing);
                        if (dashX < rightX && dashX - dashLength > centerX) {
                            gfx.beginPath();
                            gfx.moveTo(dashX, yPos);
                            gfx.lineTo(dashX - dashLength, yPos);
                            gfx.strokePath();
                        }
                    }
                }
            }

            update(time, delta) {
                const dt = delta / 1000;

                if (this.bgFar && this.bgMid) {
                    this.bgFar.tilePositionY = this.cameras.main.scrollY * 0.1;
                    this.bgMid.tilePositionY = this.cameras.main.scrollY * 0.3;
                }

                // Spectator camera: smoothly track the leading player
                if (this.isSpectating && this.spectatorCameraY != null) {
                    const targetScrollY = this.spectatorCameraY - CANVAS_HEIGHT / 2;
                    this.cameras.main.scrollY += (targetScrollY - this.cameras.main.scrollY) * 0.05;
                }

                if (!this.gameOverOverlayShown && this.roundState === ROUND_RUNNING && !this.isSpectating) {
                    const pointer = this.input.activePointer;
                    const pointerOnCanvas = pointer.isDown &&
                        (!pointer.event || pointer.event.target === this.sys.game.canvas);
                    const isHeld = pointerOnCanvas || (this.spaceKey && this.spaceKey.isDown);
                    if (isHeld) {
                        const localFlap = this.applyFlapToMyState();
                        if (localFlap) {
                            const myV = this.playerVisuals.get(mySessionId);
                            if (myV) this.playFlapJuice(myV);
                        }
                        sendFlap();
                    }
                }

                this.stepMyState(dt);
                this.reconcileMyState();

                if (this.myState) {
                    const myV = this.playerVisuals.get(mySessionId);
                    if (myV) {
                        myV.sprite.x = this.myState.x;
                        myV.sprite.y = this.myState.y;
                        myV.eyesContainer.x = this.myState.x;
                        myV.eyesContainer.y = this.myState.y;
                        myV.nameText.x = this.myState.x;
                        myV.nameText.y = this.myState.y - 60;

                        myV.targetEye.x = Phaser.Math.Clamp(this.myState.vx / 20, -6, 6);
                        myV.targetEye.y = Phaser.Math.Clamp(this.myState.vy / 40, -4, 4);
                        myV.targetPupil.x = myV.targetEye.x * 0.5;
                        myV.targetPupil.y = myV.targetEye.y * 0.5;
                    }
                }

                this.updateRemotePlayerVisuals();
                this.updatePolygonExtrapolation();
                this.updateProximityIndicators();

                for (const refs of this.hexagonPairSprites.values()) {
                    this.drawBeamDashes(refs, time);
                }

                for (const v of this.playerVisuals.values()) {
                    v.currentEye.x += (v.targetEye.x - v.currentEye.x) * 0.15;
                    v.currentEye.y += (v.targetEye.y - v.currentEye.y) * 0.15;
                    v.currentPupil.x += (v.targetPupil.x - v.currentPupil.x) * 0.15;
                    v.currentPupil.y += (v.targetPupil.y - v.currentPupil.y) * 0.15;
                    v.eyeLeft.x = -24 + v.currentEye.x;
                    v.eyeLeft.y = -4 + v.currentEye.y;
                    v.eyeRight.x = 24 + v.currentEye.x;
                    v.eyeRight.y = -4 + v.currentEye.y;
                    v.pupilLeft.x = v.eyeLeft.x + v.currentPupil.x;
                    v.pupilLeft.y = v.eyeLeft.y + v.currentPupil.y;
                    v.pupilRight.x = v.eyeRight.x + v.currentPupil.x;
                    v.pupilRight.y = v.eyeRight.y + v.currentPupil.y;
                }

                if (this.spikes) {
                    this.spikes.forEach((s, idx) => {
                        s.y = -3 + Math.sin((time / 200) + idx) * 10;
                    });
                }
            }
        }

        new Phaser.Game({
            type: Phaser.WEBGL,
            parent: 'game-container',
            width: CANVAS_WIDTH,
            height: CANVAS_HEIGHT,
            scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
            backgroundColor: COLORS.background,
            scene: [GameScene],
        });
    </script>
</body>

</html>
