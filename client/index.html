<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AGISCENDS</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            margin: 0 auto;
        }

        /* ── Hamburger button ── */
        #menu-btn {
            position: fixed;
            top: 8px;
            left: 8px;
            color: #fff;
            font-family: monospace;
            font-size: 20px;
            line-height: 1;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 10px;
            z-index: 20;
            cursor: pointer;
            user-select: none;
            border-radius: 4px;
        }

        /* ── Dropdown menu panel ── */
        #menu-panel {
            display: none;
            position: fixed;
            top: 42px;
            left: 8px;
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 14px;
            z-index: 20;
            border-radius: 4px;
            min-width: 160px;
            white-space: nowrap;
        }

        #menu-panel.open {
            display: block;
        }

        /* ── Speaker button ── */
        #speaker-btn {
            position: fixed;
            top: 8px;
            right: 8px;
            font-size: 20px;
            line-height: 1;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 10px;
            z-index: 20;
            cursor: pointer;
            user-select: none;
            border-radius: 4px;
        }

        /* Force the emoji to render as pure white */
        #speaker-btn .icon {
            display: inline-block;
            position: relative;
            filter: brightness(0) invert(1);
        }

        /* Strikethrough bar when muted */
        #speaker-btn.muted .icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -4px;
            right: -4px;
            height: 2.5px;
            background: #fff;
            transform: translateY(-50%) rotate(45deg);
            pointer-events: none;
        }

        /* ── Scoreboard (bottom left) ──
           Holds one .scoreboard-line per in-round player who has scored.
           On wide viewports all lines are visible; on phones, a media query
           hides everything past the first line to avoid running into the
           right edge. The 720px breakpoint matches the canvas width: if
           the viewport is narrower than the canvas, we're effectively in
           "mobile" layout. */
        #scoreboard {
            position: fixed;
            bottom: 8px;
            left: 8px;
            color: #fff;
            font-family: monospace;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            z-index: 10;
            pointer-events: none;
            border-radius: 4px;
            display: none;
        }

        #scoreboard.has-scores {
            display: block;
        }

        #scoreboard .scoreboard-line {
            white-space: nowrap;
        }

        @media (max-width: 720px) {
            #scoreboard .scoreboard-line:nth-child(n+2) {
                display: none;
            }
        }

        /* ── Auth UI: button inside menu, plus modal ── */
        #menu-panel hr {
            border: none;
            border-top: 1px solid #444;
            margin: 8px 0;
        }

        #menu-panel button {
            display: block;
            width: 100%;
            margin: 0;
            background: #fff;
            color: #000;
            border: none;
            font-family: monospace;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        #menu-panel button:hover {
            background: #ddd;
        }

        #auth-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 30;
            align-items: center;
            justify-content: center;
        }

        #auth-overlay.open {
            display: flex;
        }

        #auth-modal {
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            padding: 18px 20px;
            border-radius: 6px;
            min-width: 280px;
            max-width: 90vw;
        }

        #auth-modal h2 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: normal;
        }

        #auth-modal label {
            display: block;
            margin-top: 10px;
            color: #ccc;
        }

        #auth-modal input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            font-family: monospace;
            font-size: 13px;
            padding: 6px 8px;
            margin-top: 3px;
            border-radius: 4px;
        }

        #auth-modal input:focus {
            outline: none;
            border-color: #888;
        }

        #auth-error {
            margin-top: 10px;
            color: #f88;
            font-size: 12px;
            min-height: 14px;
        }

        /* Optional subtitle line under the modal title. Only populated
           in 'claim' mode; otherwise empty and (via :empty) hidden. */
        #auth-subtitle {
            margin-top: 4px;
            color: #aaa;
            font-size: 12px;
            line-height: 1.4;
        }

        #auth-subtitle:empty {
            display: none;
        }

        /* Full-width primary action button. Used for the bespoke submit
           and the Ethereum button — they share visual weight and span
           the modal so neither feels like a secondary affordance. */
        .auth-full-btn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            background: #fff;
            color: #000;
            border: none;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 10px 12px;
            margin-top: 14px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .auth-full-btn:hover {
            background: #ddd;
        }

        .auth-full-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #auth-toggle-link {
            margin-top: 10px;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
            text-align: center;
        }

        #auth-toggle-link:hover {
            color: #ccc;
        }

        /* "OR" divider between the bespoke flow and the Ethereum flow.
           Two thin lines flanking the word; dimmed to match the modal. */
        #auth-divider {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 14px 0 0 0;
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #auth-divider::before,
        #auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #333;
        }

        /* MMR line under Sign Out button */
        #menu-mmr {
            color: #ccc;
            font-family: monospace;
            font-size: 13px;
            margin: 6px 0 0 0;
        }

        /* "Leaderboards" link inside menu — not a button, just clickable text */
        #menu-leaderboard-link {
            color: #ccc;
            font-family: monospace;
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
            padding: 2px 0;
        }

        #menu-leaderboard-link:hover {
            color: #fff;
        }

        /* Profile link — opens the Profile modal. Same shape as the
           leaderboard link, just lives in the auth section of the menu.
           Small top margin separates it visually from the MMR line
           above without needing an <hr>. */
        #menu-profile-link {
            color: #ccc;
            font-family: monospace;
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
            padding: 2px 0;
            margin-top: 8px;
        }

        #menu-profile-link:hover {
            color: #fff;
        }

        /* ── Leaderboard modal ─────────────────────────────────────────
           Mobile default: centered with backdrop, takes most of the screen.
           Wide viewports (≥1200px): docks to the right side, transparent
           backdrop, pointer-events disabled outside the panel so the game
           stays playable while it's open. */
        #leaderboard-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 25;
            align-items: center;
            justify-content: center;
        }

        #leaderboard-overlay.open {
            display: flex;
        }

        #leaderboard-panel {
            position: relative;
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            padding: 16px 20px;
            border-radius: 6px;
            width: 360px;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        #leaderboard-panel h2 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: normal;
        }

        #leaderboard-close {
            position: absolute;
            top: 6px;
            right: 12px;
            color: #888;
            cursor: pointer;
            font-size: 22px;
            line-height: 1;
        }

        #leaderboard-close:hover {
            color: #fff;
        }

        #leaderboard-rows {
            margin-top: 12px;
        }

        .leaderboard-row {
            display: flex;
            padding: 2px 0;
            white-space: nowrap;
        }

        .leaderboard-row.me {
            color: #ffd54f;
        }

        .leaderboard-rank {
            width: 36px;
            color: #888;
        }

        .leaderboard-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .leaderboard-mmr {
            width: 60px;
            text-align: right;
        }

        .leaderboard-empty {
            color: #888;
            padding: 8px 0;
        }

        #leaderboard-mode-toggle {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #333;
            justify-content: center;
        }

        .leaderboard-mode-btn {
            background: transparent;
            color: #888;
            border: 1px solid #444;
            padding: 6px 18px;
            cursor: pointer;
            font-family: monospace;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .leaderboard-mode-btn:hover {
            color: #fff;
            border-color: #777;
        }

        .leaderboard-mode-btn.active {
            color: #000;
            background: #fff;
            border-color: #fff;
        }

        @media (min-width: 1200px) {
            #leaderboard-overlay {
                inset: auto;
                top: 0;
                right: 0;
                bottom: 0;
                background: transparent;
                pointer-events: none;
                align-items: stretch;
                justify-content: flex-end;
            }

            #leaderboard-panel {
                pointer-events: auto;
                margin: 16px;
                width: 420px;
                max-width: 420px;
                height: calc(100vh - 32px);
                max-height: none;
            }
        }

        /* ── Profile modal ─────────────────────────────────────────────
           Visual sibling of the leaderboard: same dark panel, same close
           pill, same mode-toggle button row. Different content sections:
           a header (display_name + MMR), a 2-column stats grid, a
           recent-matches list with mode toggle, and an account section
           with inline forms for setting a password / linking a wallet. */
        #profile-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 25;
            align-items: center;
            justify-content: center;
        }

        #profile-overlay.open {
            display: flex;
        }

        #profile-panel {
            position: relative;
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            padding: 16px 20px;
            border-radius: 6px;
            width: 380px;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        #profile-panel h2 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: normal;
        }

        #profile-panel h3 {
            margin: 16px 0 6px 0;
            font-size: 13px;
            font-weight: normal;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-top: 1px solid #333;
            padding-top: 12px;
        }

        #profile-close {
            position: absolute;
            top: 6px;
            right: 12px;
            color: #888;
            cursor: pointer;
            font-size: 22px;
            line-height: 1;
        }

        #profile-close:hover {
            color: #fff;
        }

        #profile-header {
            margin-top: 8px;
            font-size: 14px;
        }

        #profile-displayname {
            color: #ffd54f;
            font-size: 16px;
            margin-bottom: 2px;
        }

        #profile-mmr {
            color: #aaa;
        }

        /* Two columns: Devils stats on the left, Angels stats on the
           right. The columns are independent boxes — Angels lacks a
           wins line, which would otherwise look like a missing field. */
        #profile-stats-grid {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .profile-stats-box {
            flex: 1;
            background: #111;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 8px 10px;
        }

        .profile-stats-title {
            color: #888;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .profile-stat-line {
            color: #ccc;
            padding: 1px 0;
        }

        .profile-stat-line .v {
            color: #fff;
        }

        /* Mode toggle for the match-history list — same look as the
           leaderboard's, just a separate class so we can rebind events
           without confusing the two. */
        #profile-mode-toggle {
            display: flex;
            gap: 8px;
            margin: 6px 0 8px 0;
            justify-content: center;
        }

        .profile-mode-btn {
            background: transparent;
            color: #888;
            border: 1px solid #444;
            padding: 4px 14px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .profile-mode-btn:hover {
            color: #fff;
            border-color: #777;
        }

        .profile-mode-btn.active {
            color: #000;
            background: #fff;
            border-color: #fff;
        }

        #profile-matches {
            min-height: 180px;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 4px 8px;
        }

        .profile-match-row {
            display: flex;
            padding: 2px 0;
            white-space: nowrap;
            font-size: 12px;
        }

        .profile-match-date {
            color: #888;
            flex-shrink: 0;
        }

        .profile-match-rank {
            color: #aaa;
            text-align: right;
            padding-right: 10px;
            flex-shrink: 0;
        }

        .profile-match-score {
            text-align: right;
            color: #fff;
            flex-shrink: 0;
        }

        /* Devils row layout:
             [date 130px][...empty space...][rank][score]
           margin-left: auto on the rank consumes the slack between
           date and rank+score, pushing rank+score against the right
           edge. Result: rank sits just left of score with a small
           gap, both on the right. */
        .profile-match-row.devils .profile-match-date {
            width: 130px;
        }

        .profile-match-row.devils .profile-match-rank {
            width: 48px;
            margin-left: auto;
        }

        .profile-match-row.devils .profile-match-score {
            width: 60px;
        }

        /* Angels row layout: no rank column (Angels is co-op). Score
           pushed right by the same auto-margin trick.
             [date 130px][...empty...][score] */
        .profile-match-row.angels .profile-match-date {
            width: 130px;
        }

        .profile-match-row.angels .profile-match-score {
            width: 60px;
            margin-left: auto;
        }

        .profile-empty {
            color: #888;
            padding: 6px 0;
            font-size: 12px;
        }

        /* Account section — one row per identity type. Action button
           on the right; status label in the middle. Inline forms slide
           in below the row when the action button is clicked. */
        .profile-account-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }

        .profile-account-label {
            width: 70px;
            color: #888;
        }

        .profile-account-value {
            flex: 1;
            color: #ccc;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-action-btn {
            background: #fff;
            color: #000;
            border: none;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 3px;
            cursor: pointer;
        }

        .profile-action-btn:hover {
            background: #ddd;
        }

        .profile-action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Password modal — its own overlay rather than an inline form
           inside Profile. Focuses attention on the change/enable
           operation without rearranging the Profile beneath it. */
        #profile-pw-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 30;
            align-items: center;
            justify-content: center;
        }

        #profile-pw-overlay.open {
            display: flex;
        }

        #profile-pw-panel {
            position: relative;
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            padding: 16px 20px;
            border-radius: 6px;
            width: 320px;
            max-width: 90vw;
            box-sizing: border-box;
        }

        #profile-pw-panel h2 {
            margin: 0 0 12px 0;
            font-size: 16px;
            font-weight: normal;
        }

        #profile-pw-close {
            position: absolute;
            top: 6px;
            right: 12px;
            color: #888;
            cursor: pointer;
            font-size: 22px;
            line-height: 1;
        }

        #profile-pw-close:hover {
            color: #fff;
        }

        #profile-pw-panel input[type=password] {
            display: block;
            width: 100%;
            box-sizing: border-box;
            background: #000;
            color: #fff;
            border: 1px solid #444;
            border-radius: 3px;
            padding: 6px 8px;
            font-family: monospace;
            font-size: 13px;
            margin: 6px 0;
        }

        #profile-pw-panel input[type=password]:focus {
            outline: none;
            border-color: #888;
        }

        #profile-pw-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        #profile-pw-buttons button {
            flex: 1;
        }

        .profile-pw-cancel {
            background: #333 !important;
            color: #fff !important;
        }

        .profile-pw-cancel:hover {
            background: #444 !important;
        }

        .profile-error {
            color: #ff6b6b;
            font-size: 12px;
            min-height: 16px;
            margin-top: 4px;
        }

        .profile-success {
            color: #6bcb77;
            font-size: 12px;
            min-height: 16px;
            margin-top: 4px;
        }

        /* ── Generic confirm dialog ────────────────────────────────────
           A styled in-app replacement for window.confirm(). Used by
           destructive actions like Unlink Wallet and Remove Password.
           Sits above all other modals (z 35 > profile 25 > auth 30) so
           it can prompt over any of them. */
        #confirm-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 35;
            align-items: center;
            justify-content: center;
        }

        #confirm-overlay.open {
            display: flex;
        }

        #confirm-panel {
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            padding: 20px 22px;
            border-radius: 6px;
            width: 320px;
            max-width: 90vw;
            box-sizing: border-box;
        }

        #confirm-message {
            margin-bottom: 16px;
            line-height: 1.45;
        }

        #confirm-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        #confirm-buttons button {
            background: #fff;
            color: #000;
            border: none;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 3px;
            cursor: pointer;
        }

        #confirm-buttons button:hover {
            background: #ddd;
        }

        #confirm-cancel {
            background: #333;
            color: #fff;
        }

        #confirm-cancel:hover {
            background: #444;
        }

        /* "Danger" variant for the OK button — used when the action
           is destructive (delete, remove, unlink). Red signal so the
           user pauses before clicking. */
        #confirm-ok.danger {
            background: #d04040;
            color: #fff;
        }

        #confirm-ok.danger:hover {
            background: #e04040;
        }

        /* ── Mode picker (ANGELS / DEVILS) ─────────────────────────────
           Shown on page load and again whenever the user clicks
           "Switch mode" in the menu. No localStorage persistence — every
           reload presents the choice fresh.
           Overlay is transparent so the cathedral background renders
           behind it. The buttons themselves are opaque. */
        #mode-picker-overlay {
            display: flex;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            /* soft scrim, lets cathedral show */
            /* z-index 15 sits above the canvas (default) but below the
               menu button (20), menu panel, and every modal overlay
               (25–30). The picker still blocks pointer events from
               reaching the canvas — it just doesn't block the menu. */
            z-index: 15;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: monospace;
        }

        #mode-picker-overlay.hidden {
            display: none;
        }

        #mode-picker-content {
            text-align: center;
            display: flex;
            justify-content: center;
        }

        .mode-picker-buttons {
            display: flex;
            flex-direction: column;
            gap: 100px;
            justify-content: center;
            align-items: center;
        }

        .mode-button {
            width: 290px;
            height: 130px;
            background: #ffffff;
            color: #000000;
            border: 2px solid #ffffff;
            cursor: pointer;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            font-weight: bold;
            letter-spacing: 4px;
            transition: transform 0.1s, background 0.1s;
        }

        .mode-button:hover {
            background: #e8e8e8;
            transform: scale(1.03);
        }

        @media (max-width: 600px) {
            .mode-picker-buttons {
                gap: 72px;
            }

            .mode-button {
                width: 210px;
                height: 90px;
                font-size: 38px;
            }
        }

        /* Current-mode label + Switch-mode link in the menu */
        #menu-current-mode {
            color: #ccc;
            font-family: monospace;
            font-size: 13px;
            padding: 2px 0;
            letter-spacing: 1px;
        }

        #menu-switch-mode-link {
            color: #ccc;
            font-family: monospace;
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
            padding: 2px 0;
            /* Visual gap separating "DEVILS / ANGELS" current-mode label
               above from the Switch mode / Leaderboards links below. */
            margin-top: 8px;
        }

        #menu-switch-mode-link:hover {
            color: #fff;
        }

        #menu-switch-mode-link.disabled {
            color: #666;
            text-decoration: none;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="game-container"></div>

    <!-- Top left: hamburger + menu -->
    <div id="menu-btn">☰</div>
    <div id="menu-panel">
        <span id="menu-player-name">you are …</span>
        <hr>
        <button id="menu-auth-btn">Sign in</button>
        <div id="menu-mmr" style="display:none">1500 MMR</div>
        <div id="menu-profile-link" style="display:none">Profile</div>
        <hr>
        <div id="menu-current-mode">DEVILS</div>
        <div id="menu-switch-mode-link">Switch mode</div>
        <div id="menu-leaderboard-link">Leaderboards</div>

    <!-- Mode picker — visible on every page load, also re-summoned from

        <div id="mode-picker-content">

    <!-- Leaderboard modal: docks right on web, centered on mobile -->
    <div id="leaderboard-overlay">

            <h2>Top 100</h2>
            <div id="leaderboard-rows">
                <div class="leaderboard-empty">Loading…</div>
            </div>
            <div id="leaderboard-mode-toggle">
                <button class="leaderboard-mode-btn" data-mode="devils">DEVILS</button>
                <button class="leaderboard-mode-btn" data-mode="angels">ANGELS</button>

    </div>

    <!-- Profile modal (header / per-mode stats / recent matches / account actions). -->
    <div id="profile-overlay">
        <div id="profile-panel">
            <div id="profile-close" title="Close">×</div>
            <h2>Profile</h2>
            <div id="profile-header">
                <div id="profile-displayname">…</div>
                <div id="profile-mmr">…</div>
            </div>
            <div id="profile-stats-grid">
                <div class="profile-stats-box">
                    <div class="profile-stats-title">DEVILS</div>
                    <div class="profile-stat-line">games <span class="v" id="profile-devils-games">0</span></div>
                    <div class="profile-stat-line">wins <span class="v" id="profile-devils-wins">0</span></div>
                    <div class="profile-stat-line">best <span class="v" id="profile-devils-best">–</span></div>
                </div>
                <div class="profile-stats-box">
                    <div class="profile-stats-title">ANGELS</div>
                    <div class="profile-stat-line">games <span class="v" id="profile-angels-games">0</span></div>
                    <div class="profile-stat-line">best <span class="v" id="profile-angels-best">–</span></div>
                </div>
            </div>

            <h3>Recent matches</h3>
            <div id="profile-mode-toggle">
                <button class="profile-mode-btn active" data-mode="devils">DEVILS</button>
                <button class="profile-mode-btn" data-mode="angels">ANGELS</button>
