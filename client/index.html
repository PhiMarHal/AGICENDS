<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AGISCENDS</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            margin: 0 auto;
        }

        /* ── Hamburger button ── */
        #menu-btn {
            position: fixed;
            top: 8px;
            left: 8px;
            color: #fff;
            font-family: monospace;
            font-size: 20px;
            line-height: 1;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 10px;
            z-index: 20;
            cursor: pointer;
            user-select: none;
            border-radius: 4px;
        }

        /* ── Dropdown menu panel ── */
        #menu-panel {
            display: none;
            position: fixed;
            top: 42px;
            left: 8px;
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 14px;
            z-index: 20;
            border-radius: 4px;
            min-width: 160px;
            white-space: nowrap;
        }

        #menu-panel.open {
            display: block;
        }

        /* ── Speaker button ── */
        #speaker-btn {
            position: fixed;
            top: 8px;
            right: 8px;
            font-size: 20px;
            line-height: 1;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 10px;
            z-index: 20;
            cursor: pointer;
            user-select: none;
            border-radius: 4px;
        }

        /* Force the emoji to render as pure white */
        #speaker-btn .icon {
            display: inline-block;
            position: relative;
            filter: brightness(0) invert(1);
        }

        /* Strikethrough bar when muted */
        #speaker-btn.muted .icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -4px;
            right: -4px;
            height: 2.5px;
            background: #fff;
            transform: translateY(-50%) rotate(45deg);
            pointer-events: none;
        }

        /* ── Top scorer (bottom left) ── */
        #top-scorer {
            position: fixed;
            bottom: 8px;
            left: 8px;
            color: #fff;
            font-family: monospace;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            z-index: 10;
            pointer-events: none;
            border-radius: 4px;
            display: none;
        }

        /* ── Second scorer (bottom right) ── */
        #second-scorer {
            position: fixed;
            bottom: 8px;
            right: 8px;
            color: #fff;
            font-family: monospace;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            z-index: 10;
            pointer-events: none;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>

<body>
    <div id="game-container"></div>

    <!-- Top left: hamburger + menu -->
    <div id="menu-btn">☰</div>
    <div id="menu-panel">
        <span id="menu-player-name">you are …</span>
    </div>

    <!-- Top right: speaker toggle -->
    <div id="speaker-btn"><span class="icon">🔊</span></div>

    <!-- Bottom left: top scorer -->
    <div id="top-scorer"></div>

    <!-- Bottom right: second scorer -->
    <div id="second-scorer"></div>

    <script>
        // ========================================================================
        // Music
        // ========================================================================
        const MUSIC_BASE_URL = 'https://agiscend.loiyaa.com/';
        const MUSIC_IS_LOCAL = window.location.protocol === 'file:';
        const MUSIC_TRACK_COUNT = 21;
        const MUSIC_SILENCE_BETWEEN_TRACKS = 4000;

        let musicPlaylist = [];
        let musicCurrentTrackIndex = 0;
        let musicAudioElement = null;
        let musicStarted = false;
        let musicTransitioning = false;
        let musicMuted = false;

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generateMusicPlaylist() {
            const tracks = [];
            for (let i = 1; i <= MUSIC_TRACK_COUNT; i++) {
                const trackNum = i.toString().padStart(2, '0');
                const trackPath = MUSIC_IS_LOCAL
                    ? `assets/track_${trackNum}.mp3`
                    : `${MUSIC_BASE_URL}assets/track_${trackNum}.mp3`;
                tracks.push(trackPath);
            }
            return shuffleArray(tracks);
        }

        function playNextTrack() {
            if (!musicStarted || musicTransitioning) return;
            musicTransitioning = true;
            if (musicCurrentTrackIndex >= musicPlaylist.length) {
                musicPlaylist = generateMusicPlaylist();
                musicCurrentTrackIndex = 0;
            }
            const trackPath = musicPlaylist[musicCurrentTrackIndex];
            musicCurrentTrackIndex++;
            if (musicAudioElement) {
                musicAudioElement.pause();
                musicAudioElement.removeAttribute('src');
                musicAudioElement.load();
                musicAudioElement = null;
            }
            musicAudioElement = new Audio();
            musicAudioElement.volume = 0.5;
            musicAudioElement.muted = musicMuted;
            musicAudioElement.onended = () => {
                musicTransitioning = false;
                setTimeout(playNextTrack, MUSIC_SILENCE_BETWEEN_TRACKS);
            };
            musicAudioElement.onerror = () => {
                console.warn('Could not load track:', trackPath);
                musicTransitioning = false;
                setTimeout(playNextTrack, 1000);
            };
            musicAudioElement.oncanplaythrough = () => {
                musicTransitioning = false;
                if (!musicMuted) musicAudioElement.play().catch(e => console.warn('Playback failed:', e));
            };
            musicAudioElement.src = trackPath;
            musicAudioElement.load();
        }

        function startMusic() {
            if (musicStarted) return;
            musicStarted = true;
            musicTransitioning = false;
            musicPlaylist = generateMusicPlaylist();
            musicCurrentTrackIndex = 0;
            playNextTrack();
        }

        document.addEventListener('visibilitychange', () => {
            if (!musicAudioElement) return;
            if (document.hidden) musicAudioElement.pause();
            else if (musicStarted) musicAudioElement.play().catch(() => { });
        });

        // ========================================================================
        // UI controls: hamburger menu + speaker toggle
        // ========================================================================
        const menuBtn = document.getElementById('menu-btn');
        const menuPanel = document.getElementById('menu-panel');
        const speakerBtn = document.getElementById('speaker-btn');
        const topScorerEl = document.getElementById('top-scorer');
        const secondScorerEl = document.getElementById('second-scorer');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuPanel.classList.toggle('open');
        });

        document.addEventListener('click', (e) => {
            if (!menuPanel.contains(e.target) && e.target !== menuBtn) {
                menuPanel.classList.remove('open');
            }
        });

        speakerBtn.addEventListener('click', () => {
            musicMuted = !musicMuted;
            if (musicAudioElement) {
                musicAudioElement.muted = musicMuted;
                if (!musicMuted && musicStarted) {
                    musicAudioElement.play().catch(() => { });
                }
            }
            speakerBtn.classList.toggle('muted', musicMuted);
        });

        // ========================================================================
        // Game constants
        // ========================================================================
        const CANVAS_WIDTH = 720;
        const CANVAS_HEIGHT = 1080;
        const WALL_THICKNESS = 35;
        const SIDE_WALL_DISPLAY_SIZE = WALL_THICKNESS * 0.9;
        const BLOCK_RENDER_SIZE = 90;
        const COIN_SIZE = 45;
        const PLAYER_BASE_SCALE = 1.2;
        const WORLD_HEIGHT_UP = 10000000;

        const SIM = {
            GRAVITY: 1600,
            JUMP_FORCE: 650,
            HORIZONTAL_SPEED: 400,
            MAX_FALL_SPEED: 800,
            MAX_VX: 800, MAX_VY: 2000,
            WALL_THICKNESS: 35,
            FLAP_COOLDOWN_MS: 200,
            START_Y_OFFSET: 540,  // = CANVAS_HEIGHT / 2; players spawn at vertical centre
            PLAYER_RADIUS: 30,
            PLAYER_BOUNCE: 2.0,
            STUN_DURATION_MS: 400,
            PENTAGON_SIZE: 240,
            HEXAGON_SIZE: 100,
            HEPTAGON_SIZE: 64,
            OCTAGON_SIZE: 135,
        };

        const ROUND_WAITING = 'waiting';
        const ROUND_COUNTDOWN = 'countdown';
        const ROUND_RUNNING = 'running';
        const ROUND_OVER = 'round_over';

        function clampVelocity(s) {
            if (s.vx > SIM.MAX_VX) s.vx = SIM.MAX_VX;
            if (s.vx < -SIM.MAX_VX) s.vx = -SIM.MAX_VX;
            if (s.vy > SIM.MAX_VY) s.vy = SIM.MAX_VY;
            if (s.vy < -SIM.MAX_VY) s.vy = -SIM.MAX_VY;
        }

        const RECONCILE_LERP = 0.15;
        const RECONCILE_VEL_LERP = 0.08;
        const POST_FLAP_VEL_GRACE_MS = 150;

        const INTERP_DELAY_MS = 100;
        const INTERP_BUFFER_MAX_AGE_MS = 500;

        const PROXIMITY_TRIANGLE_SIZE = 22;
        const PROXIMITY_EDGE_MARGIN = 22;
        const PROXIMITY_TEXT_LINE_HEIGHT = 24;
        const PROXIMITY_X_CLAMP_MARGIN = 50;

        // Skull emoji label for the spikes-line proximity indicator.
        // Replaces the previous "SPIKES" string for a more flavorful pictogram
        // that survives at small sizes without leaning on a stylized typography
        // pass we don't have set up yet.
        const SPIKES_LABEL = '💀';

        const COLORS = {
            background: '#ffffff',
            primary: '#000000',
            secondary: '#ffffff',
            hazard: '#000000',
        };

        // Status is now silent (UI elements handle display)
        function setStatus(t) { /* no-op: status displayed via DOM elements */ }

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = wsProtocol + '//' + window.location.host;

        let ws = null;
        let mySessionId = null;
        let pendingWorldInit = null;
        let pendingSnapshots = [];
        let sceneReady = false;

        function connect() {
            setStatus('connecting...');
            ws = new WebSocket(wsUrl);
            ws.addEventListener('open', () => setStatus('connected'));
            ws.addEventListener('message', (event) => {
                let msg;
                try { msg = JSON.parse(event.data); } catch { return; }
                if (msg.type === 'welcome') {
                    mySessionId = msg.sessionId;
                    // Update the hamburger menu player name
                    document.getElementById('menu-player-name').textContent = 'you are ' + mySessionId;
                } else if (msg.type === 'world_init') {
                    if (sceneReady && window.__scene) window.__scene.applyWorldInit(msg);
                    else pendingWorldInit = msg;
                } else if (msg.type === 'snapshot') {
                    if (sceneReady && window.__scene) window.__scene.applySnapshot(msg);
                    else pendingSnapshots.push(msg);
                }
            });
            ws.addEventListener('close', () => setStatus('disconnected'));
            ws.addEventListener('error', (e) => { console.error('ws error', e); setStatus('error'); });
        }

        function sendFlap() {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'flap' }));
        }

        function sendReady() {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'ready' }));
        }

        class GameScene extends Phaser.Scene {
            constructor() {
                super({ key: 'GameScene' });
                this.playerVisuals = new Map();
                this.blockSprites = new Map();
                this.coinSprites = new Map();
                this.sideWallSprites = [];
                this.pentagonSprites = new Map();
                this.hexagonPairSprites = new Map();
                this.heptagonSprites = new Map();
                this.octagonSprites = new Map();
                this.projectileSprites = new Map();

                this.heptagonInterp = new Map();
                this.pentagonInterp = new Map();
                this.projectileInterp = new Map();

                this.cameraTarget = null;
                this.previousAlive = new Map();
                this.gameOverOverlayShown = false;
                this.myState = null;
                this.myServerTarget = null;
                this.interpBuffers = new Map();
                this.latestServerTime = 0;

                this.latestPlayerData = new Map();
                this.latestSpikeY = null;

                this.proximityIndicatorPool = [];

                this.roundState = ROUND_WAITING;
                this.gameOverObjs = null;

                this.countdownText = null;
                this.lastCountdownNumberShown = null;
                this.countdownReadyText = null;
                this.countdownJoinButton = null;
                this.countdownJoinButtonText = null;

                this.waitingUI = null;
                this.spectatingText = null;
                this.isSpectating = false;
                this.spectatorCameraY = null;
                this.countdownReadySet = new Set();
            }

            create() {
                this.generateTextures();

                this.cameras.main.setBackgroundColor(COLORS.background);
                this.cameras.main.setBounds(
                    0, -WORLD_HEIGHT_UP, CANVAS_WIDTH, CANVAS_HEIGHT + WORLD_HEIGHT_UP
                );

                const bgScale = CANVAS_WIDTH / 1024;
                this.bgFar = this.add.tileSprite(CANVAS_WIDTH / 2, 0, 1024, 2048, 'bg_far')
                    .setOrigin(0.5, 0).setScrollFactor(0).setDepth(-10).setScale(bgScale);
                this.bgMid = this.add.tileSprite(CANVAS_WIDTH / 2, 0, 1024, 2048, 'bg_mid')
                    .setOrigin(0.5, 0).setScrollFactor(0).setDepth(-9).setScale(bgScale);

                this.spikeContainer = this.add.container(0, CANVAS_HEIGHT + 50);
                this.spikeContainer.setDepth(5);
                const spikeBgHeight = 50000;
                const spikeBg = this.add.rectangle(0, 45, CANVAS_WIDTH, spikeBgHeight, 0x000000);
                spikeBg.setOrigin(0, 0);
                this.spikeContainer.add(spikeBg);

                this.spikes = [];
                const spikeCount = 16;
                const spikeWidth = CANVAS_WIDTH / (spikeCount + 1);
                for (let i = 0; i < spikeCount; i++) {
                    const s = this.add.image((i + 1) * spikeWidth, 0, 'spike_single').setOrigin(0.5, 0);
                    this.spikeContainer.add(s);
                    this.spikes.push(s);
                }

                this.scoreText = this.add.text(CANVAS_WIDTH / 2, 50, '0', {
                    fontFamily: 'Arial', fontSize: '56px', fontStyle: 'bold',
                    color: COLORS.primary, stroke: '#ffffff', strokeThickness: 6
                }).setOrigin(0.5).setScrollFactor(0).setDepth(100);

                this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

                sceneReady = true;
                window.__scene = this;
                if (pendingWorldInit) { this.applyWorldInit(pendingWorldInit); pendingWorldInit = null; }
                for (const snap of pendingSnapshots) this.applySnapshot(snap);
                pendingSnapshots = [];

                connect();
            }

            generateTextures() {
                const cPrimary = Phaser.Display.Color.HexStringToColor(COLORS.primary).color;

                const pG = this.make.graphics();
                pG.fillStyle(cPrimary);
                pG.fillCircle(30, 30, 30);
                pG.generateTexture('player', 60, 60);
                pG.destroy();

                const cG = this.make.graphics();
                cG.fillStyle(0x000000);
                cG.lineStyle(2, 0xffffff);
                const tri = new Phaser.Geom.Triangle(COIN_SIZE / 2, 0, 0, COIN_SIZE, COIN_SIZE, COIN_SIZE);
                cG.fillTriangleShape(tri);
                cG.strokeTriangleShape(tri);
                cG.generateTexture('coin', COIN_SIZE, COIN_SIZE);
                cG.destroy();

                const ptG = this.make.graphics();
                ptG.fillStyle(0x000000);
                ptG.fillRect(0, 0, 8, 8);
                ptG.generateTexture('particle', 8, 8);
                ptG.destroy();

                const wG = this.make.graphics();
                wG.fillStyle(cPrimary);
                wG.fillRoundedRect(0, 0, BLOCK_RENDER_SIZE, BLOCK_RENDER_SIZE, 24);
                wG.generateTexture('block', BLOCK_RENDER_SIZE, BLOCK_RENDER_SIZE);
                wG.destroy();

                const sG = this.make.graphics();
                sG.fillStyle(Phaser.Display.Color.HexStringToColor(COLORS.hazard).color);
                sG.fillTriangle(64, 0, 0, 128, 128, 128);
                sG.generateTexture('spike_single', 128, 128);
                sG.destroy();

                const pentSize = SIM.PENTAGON_SIZE;
                const pentG = this.make.graphics();
                pentG.fillStyle(cPrimary);
                const pentRadius = pentSize / 2;
                const pentPoints = [];
                for (let i = 0; i < 5; i++) {
                    const angle = (i * 2 * Math.PI / 5) - Math.PI / 2;
                    pentPoints.push({
                        x: pentRadius + pentRadius * Math.cos(angle),
                        y: pentRadius + pentRadius * Math.sin(angle),
                    });
                }
                pentG.beginPath();
                pentG.moveTo(pentPoints[0].x, pentPoints[0].y);
                for (let i = 1; i < 5; i++) pentG.lineTo(pentPoints[i].x, pentPoints[i].y);
                pentG.closePath();
                pentG.fillPath();
                pentG.generateTexture('pentagon', pentSize, pentSize);
                pentG.destroy();

                const hexSize = SIM.HEXAGON_SIZE;
                const hexG = this.make.graphics();
                hexG.fillStyle(0x000000);
                hexG.lineStyle(3, 0xffffff);
                const hexRadius = hexSize / 2;
                const hexPoints = [];
                for (let i = 0; i < 6; i++) {
                    const angle = (i * 2 * Math.PI / 6) - Math.PI / 2;
                    hexPoints.push({
                        x: hexRadius + hexRadius * 0.9 * Math.cos(angle),
                        y: hexRadius + hexRadius * 0.9 * Math.sin(angle),
                    });
                }
                hexG.beginPath();
                hexG.moveTo(hexPoints[0].x, hexPoints[0].y);
                for (let i = 1; i < 6; i++) hexG.lineTo(hexPoints[i].x, hexPoints[i].y);
                hexG.closePath();
                hexG.fillPath();
                hexG.strokePath();
                hexG.generateTexture('hexagon', hexSize, hexSize);
                hexG.destroy();

                const heptSize = SIM.HEPTAGON_SIZE;
                const heptG = this.make.graphics();
                heptG.fillStyle(0x000000);
                heptG.lineStyle(2, 0xffffff);
                const heptRadius = heptSize / 2;
                const heptPoints = [];
                for (let i = 0; i < 7; i++) {
                    const angle = (i * 2 * Math.PI / 7) - Math.PI / 2;
                    heptPoints.push({
                        x: heptRadius + heptRadius * 0.9 * Math.cos(angle),
                        y: heptRadius + heptRadius * 0.9 * Math.sin(angle),
                    });
                }
                heptG.beginPath();
                heptG.moveTo(heptPoints[0].x, heptPoints[0].y);
                for (let i = 1; i < 7; i++) heptG.lineTo(heptPoints[i].x, heptPoints[i].y);
                heptG.closePath();
                heptG.fillPath();
                heptG.strokePath();
                heptG.generateTexture('heptagon', heptSize, heptSize);
                heptG.destroy();

                const octSize = SIM.OCTAGON_SIZE;
                const octG = this.make.graphics();
                octG.fillStyle(0x000000);
                octG.lineStyle(3, 0xffffff);
                const octRadius = octSize / 2;
                const octPoints = [];
                for (let i = 0; i < 8; i++) {
                    const angle = (i * 2 * Math.PI / 8) - Math.PI / 8;
                    octPoints.push({
                        x: octRadius + octRadius * 0.9 * Math.cos(angle),
                        y: octRadius + octRadius * 0.9 * Math.sin(angle),
                    });
                }
                octG.beginPath();
                octG.moveTo(octPoints[0].x, octPoints[0].y);
                for (let i = 1; i < 8; i++) octG.lineTo(octPoints[i].x, octPoints[i].y);
                octG.closePath();
                octG.fillPath();
                octG.strokePath();
                octG.generateTexture('octagon', octSize, octSize);
                octG.destroy();

                const tSize = PROXIMITY_TRIANGLE_SIZE;
                const tG = this.make.graphics();
                tG.fillStyle(0xffffff);
                tG.lineStyle(2, 0x000000);
                tG.fillTriangle(tSize / 2, 0, 0, tSize, tSize, tSize);
                tG.strokeTriangle(tSize / 2, 0, 0, tSize, tSize, tSize);
                tG.generateTexture('proximity_triangle', tSize, tSize);
                tG.destroy();

                this.generateBackgroundTexture('bg_far',
                    {
                        fill: '#d0d0d0', centerBandW: 240, towerW: 120, towerDist: 360,
                        archGap: 400, archStart: 200, archH: 280, bridgeHeight: 240, curveR: 320
                    });
                this.generateBackgroundTexture('bg_mid',
                    {
                        fill: '#b0b0b0', centerBandW: 160, towerW: 120, towerDist: 400,
                        archGap: 700, archStart: 0, archH: 500, bridgeHeight: 240, curveR: 320
                    });
            }

            generateBackgroundTexture(key, opts) {
                const W = 1024, H = 2048;
                const center = W / 2;
                const canvas = document.createElement('canvas');
                canvas.width = W; canvas.height = H;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = opts.fill;
                ctx.fillRect(center - opts.centerBandW / 2, 0, opts.centerBandW, H);
                ctx.fillRect(center - opts.towerDist - opts.towerW, 0, opts.towerW, H);
                ctx.fillRect(center + opts.towerDist, 0, opts.towerW, H);
                for (let y = opts.archStart; y < H; y += (opts.archH + opts.archGap)) {
                    const bridgeBottom = y + opts.bridgeHeight;
                    const leftStart = center - opts.towerDist;
                    const leftEnd = center - opts.centerBandW / 2;
                    const leftWidth = leftEnd - leftStart;
                    ctx.beginPath();
                    ctx.moveTo(leftStart, y);
                    ctx.lineTo(leftEnd, y);
                    ctx.lineTo(leftEnd, bridgeBottom);
                    ctx.quadraticCurveTo(leftStart + leftWidth / 2, bridgeBottom - opts.curveR, leftStart, bridgeBottom);
                    ctx.closePath(); ctx.fill();
                    const rightStart = center + opts.centerBandW / 2;
                    const rightEnd = center + opts.towerDist;
                    const rightWidth = rightEnd - rightStart;
                    ctx.beginPath();
                    ctx.moveTo(rightStart, y);
                    ctx.lineTo(rightEnd, y);
                    ctx.lineTo(rightEnd, bridgeBottom);
                    ctx.quadraticCurveTo(rightStart + rightWidth / 2, bridgeBottom - opts.curveR, rightStart, bridgeBottom);
                    ctx.closePath(); ctx.fill();
                }
                this.textures.addCanvas(key, canvas);
            }

            acquireProximityIndicator() {
                for (const ind of this.proximityIndicatorPool) {
                    if (!ind.inUse) {
                        ind.inUse = true;
                        ind.triangle.setVisible(true);
                        ind.line1.setVisible(true);
                        ind.line2.setVisible(true);
                        return ind;
                    }
                }
                const triangle = this.add.image(0, 0, 'proximity_triangle')
                    .setScrollFactor(0).setDepth(150).setOrigin(0.5, 0.5);
                const textStyle = {
                    fontFamily: 'Arial', fontSize: '21px', fontStyle: 'bold',
                    color: '#000000', stroke: '#ffffff', strokeThickness: 3,
                };
                const line1 = this.add.text(0, 0, '', textStyle)
                    .setOrigin(0.5, 0.5).setScrollFactor(0).setDepth(150);
                const line2 = this.add.text(0, 0, '', textStyle)
                    .setOrigin(0.5, 0.5).setScrollFactor(0).setDepth(150);
                const ind = { inUse: true, triangle, line1, line2 };
                this.proximityIndicatorPool.push(ind);
                return ind;
            }

            releaseUnusedProximityIndicators() {
                for (const ind of this.proximityIndicatorPool) {
                    if (!ind.inUse) {
                        ind.triangle.setVisible(false);
                        ind.line1.setVisible(false);
                        ind.line2.setVisible(false);
                    }
                }
            }

            placeProximityIndicator(ind, screenX, pointsUp, line1Text, line2Text) {
                const clampedX = Math.max(PROXIMITY_X_CLAMP_MARGIN,
                    Math.min(CANVAS_WIDTH - PROXIMITY_X_CLAMP_MARGIN, screenX));

                if (pointsUp) {
                    const triY = PROXIMITY_EDGE_MARGIN;
                    ind.triangle.x = clampedX;
                    ind.triangle.y = triY;
                    ind.triangle.angle = 0;
                    ind.line1.x = clampedX;
                    ind.line1.y = triY + PROXIMITY_TRIANGLE_SIZE / 2 + PROXIMITY_TEXT_LINE_HEIGHT;
                    ind.line2.x = clampedX;
                    ind.line2.y = ind.line1.y + PROXIMITY_TEXT_LINE_HEIGHT;
                } else {
                    const triY = CANVAS_HEIGHT - PROXIMITY_EDGE_MARGIN;
                    ind.triangle.x = clampedX;
                    ind.triangle.y = triY;
                    ind.triangle.angle = 180;
                    ind.line2.x = clampedX;
                    ind.line2.y = triY - PROXIMITY_TRIANGLE_SIZE / 2 - PROXIMITY_TEXT_LINE_HEIGHT;
                    ind.line1.x = clampedX;
                    ind.line1.y = ind.line2.y - PROXIMITY_TEXT_LINE_HEIGHT;
                }

                ind.line1.setText(line1Text);
                ind.line2.setText(line2Text);
            }

            visibleYRange() {
                const cam = this.cameras.main;
                return { top: cam.scrollY, bottom: cam.scrollY + cam.height };
            }

            worldToScreenX(worldX) {
                return worldX - this.cameras.main.scrollX;
            }

            updateProximityIndicators() {
                for (const ind of this.proximityIndicatorPool) ind.inUse = false;

                if (!this.myState) {
                    this.releaseUnusedProximityIndicators();
                    return;
                }

                const { top, bottom } = this.visibleYRange();
                const myY = this.myState.y;

                for (const [id, p] of this.latestPlayerData) {
                    if (id === mySessionId) continue;
                    if (!p.alive) continue;

                    let pointsUp;
                    if (p.y < top) pointsUp = true;
                    else if (p.y > bottom) pointsUp = false;
                    else continue;

                    const ind = this.acquireProximityIndicator();
                    const screenX = this.worldToScreenX(p.x);
                    const distM = Math.floor(Math.abs(p.y - myY) / 50);
                    const distText = distM + 'm';
                    const nameText = id;
                    if (pointsUp) {
                        this.placeProximityIndicator(ind, screenX, true, distText, nameText);
                    } else {
                        this.placeProximityIndicator(ind, screenX, false, nameText, distText);
                    }
                }

                if (this.latestSpikeY != null && this.latestSpikeY > bottom) {
                    const ind = this.acquireProximityIndicator();
                    const screenX = CANVAS_WIDTH / 2;
                    const distM = Math.floor(Math.abs(this.latestSpikeY - myY) / 50);
                    this.placeProximityIndicator(ind, screenX, false, SPIKES_LABEL, distM + 'm');
                }

                this.releaseUnusedProximityIndicators();
            }

            createPlayerVisual(sessionId, isMe) {
                const sprite = this.add.image(CANVAS_WIDTH / 2, CANVAS_HEIGHT - 200, 'player');
                sprite.setScale(PLAYER_BASE_SCALE);
                sprite.setDepth(10);
                if (!isMe) sprite.setAlpha(0.65);

                const eyeWidth = 42, eyeHeight = 29;
                const outlineColor = 0x000000, outlineThickness = 3;
                const whiteColor = Phaser.Display.Color.HexStringToColor(COLORS.secondary).color;
                const blackColor = Phaser.Display.Color.HexStringToColor(COLORS.primary).color;

                const eyeLeft = this.add.ellipse(-24, -4, eyeWidth, eyeHeight, whiteColor);
                eyeLeft.setStrokeStyle(outlineThickness, outlineColor);
                const eyeRight = this.add.ellipse(24, -4, eyeWidth, eyeHeight, whiteColor);
                eyeRight.setStrokeStyle(outlineThickness, outlineColor);
                const pupilLeft = this.add.rectangle(-24, -4, 6.6, 19.8, blackColor);
                const pupilRight = this.add.rectangle(24, -4, 6.6, 19.8, blackColor);

                const eyesContainer = this.add.container(CANVAS_WIDTH / 2, CANVAS_HEIGHT - 200,
                    [eyeLeft, eyeRight, pupilLeft, pupilRight]);
                eyesContainer.setDepth(11);
                if (!isMe) eyesContainer.setAlpha(0.65);

                return {
                    sprite, eyesContainer,
                    eyeLeft, eyeRight, pupilLeft, pupilRight,
                    currentEye: { x: 0, y: 0 }, targetEye: { x: 0, y: 0 },
                    currentPupil: { x: 0, y: 0 }, targetPupil: { x: 0, y: 0 },
                    lastVx: 0,
                };
            }

            destroyPlayerVisual(v) {
                v.sprite.destroy();
                v.eyesContainer.destroy();
            }

            resetAllVisualState() {
                for (const s of this.blockSprites.values()) s.destroy();
                this.blockSprites.clear();
                for (const s of this.coinSprites.values()) s.destroy();
                this.coinSprites.clear();
                for (const s of this.sideWallSprites) s.destroy();
                this.sideWallSprites = [];
                for (const s of this.pentagonSprites.values()) s.destroy();
                this.pentagonSprites.clear();
                this.pentagonInterp.clear();
                for (const refs of this.hexagonPairSprites.values()) {
                    refs.leftHex.destroy(); refs.rightHex.destroy();
                    refs.beamRect.destroy(); refs.beamGfx.destroy();
                }
                this.hexagonPairSprites.clear();
                for (const s of this.heptagonSprites.values()) s.destroy();
                this.heptagonSprites.clear();
                this.heptagonInterp.clear();
                for (const s of this.octagonSprites.values()) s.destroy();
                this.octagonSprites.clear();
                for (const s of this.projectileSprites.values()) s.destroy();
                this.projectileSprites.clear();
                this.projectileInterp.clear();

                for (const v of this.playerVisuals.values()) this.destroyPlayerVisual(v);
                this.playerVisuals.clear();
                this.interpBuffers.clear();
                this.latestPlayerData.clear();
                this.previousAlive.clear();

                this.latestSpikeY = null;
                this.latestServerTime = 0;
                this.myState = null;
                this.myServerTarget = null;
                this.cameraTarget = null;
                this.cameras.main.stopFollow();

                this.hideGameOverUI();
                this.gameOverOverlayShown = false;
                this.hideCountdownUI();
                this.hideWaitingUI();
                this.hideSpectatingUI();
                this.isSpectating = false;
                this.spectatorCameraY = null;
                this.countdownReadySet = new Set();
            }

            applyWorldInit(msg) {
                if (this.blockSprites.size > 0 || this.playerVisuals.size > 0 ||
                    this.sideWallSprites.length > 0 || this.gameOverOverlayShown) {
                    this.resetAllVisualState();
                }

                for (const b of msg.blocks) this.spawnBlockSprite(b);
                for (const c of msg.coins) this.spawnCoinSprite(c);
                for (const seg of msg.sideWallSegments) this.spawnSideWallSegment(seg);
                if (msg.pentagons) for (const p of msg.pentagons) this.spawnPentagonSprite(p);
                if (msg.hexagonPairs) for (const h of msg.hexagonPairs) this.spawnHexagonPairSprite(h);
                if (msg.heptagons) for (const h of msg.heptagons) this.spawnHeptagonSprite(h);
                if (msg.octagons) for (const o of msg.octagons) this.spawnOctagonSprite(o);
                if (msg.projectiles) for (const p of msg.projectiles) this.spawnProjectileSprite(p);

                if (this.scoreText) this.scoreText.setText('0');
            }

            spawnBlockSprite(b) {
                const sprite = this.add.image(b.x, b.y, 'block').setDepth(2);
                if (b.scale && b.scale !== 1) sprite.setScale(b.scale);
                this.blockSprites.set(b.id, sprite);
            }

            spawnCoinSprite(c) {
                const sprite = this.add.image(c.x, c.y, 'coin');
                sprite.setDisplaySize(COIN_SIZE, COIN_SIZE).setDepth(3);
                this.coinSprites.set(c.id, sprite);
                this.tweens.add({ targets: sprite, angle: 360, duration: 1200, repeat: -1 });
            }

            spawnSideWallSegment(seg) {
                const wt = WALL_THICKNESS;
                const size = SIDE_WALL_DISPLAY_SIZE;
                const left = this.add.image(wt / 2, seg.y, 'block').setDisplaySize(size, size).setDepth(2);
                const right = this.add.image(CANVAS_WIDTH - wt / 2, seg.y, 'block').setDisplaySize(size, size).setDepth(2);
                this.sideWallSprites.push(left, right);
            }

            spawnPentagonSprite(p) {
                const sprite = this.add.image(p.x, p.y, 'pentagon').setDepth(4);
                sprite.setDisplaySize(SIM.PENTAGON_SIZE, SIM.PENTAGON_SIZE);
                if (p.angle != null) sprite.angle = p.angle;
                this.pentagonSprites.set(p.id, sprite);
                this.pentagonInterp.set(p.id, {
                    x: p.x, y: p.y, vy: 80, angle: p.angle || 0,
                    lastUpdateClientMs: performance.now(),
                });
            }

            spawnHexagonPairSprite(pair) {
                const leftHex = this.add.image(pair.leftX, pair.y, 'hexagon').setDepth(4);
                leftHex.setDisplaySize(SIM.HEXAGON_SIZE, SIM.HEXAGON_SIZE);
                const rightHex = this.add.image(pair.rightX, pair.y, 'hexagon').setDepth(4);
                rightHex.setDisplaySize(SIM.HEXAGON_SIZE, SIM.HEXAGON_SIZE);
                const beamRect = this.add.rectangle(
                    (pair.leftX + pair.rightX) / 2, pair.y,
                    (pair.rightX - pair.leftX) - SIM.HEXAGON_SIZE, 25,
                    0xffffff
                ).setStrokeStyle(2, 0x000000).setDepth(6).setVisible(false);
                const beamGfx = this.add.graphics().setDepth(7);
                this.hexagonPairSprites.set(pair.id, {
                    leftHex, rightHex, beamRect, beamGfx,
                    leftX: pair.leftX, rightX: pair.rightX, y: pair.y,
                });
            }

            spawnHeptagonSprite(h) {
                const sprite = this.add.image(h.x, h.y, 'heptagon').setDepth(4);
                sprite.setDisplaySize(SIM.HEPTAGON_SIZE, SIM.HEPTAGON_SIZE);
                if (h.angle != null) sprite.angle = h.angle;
                this.heptagonSprites.set(h.id, sprite);
                this.heptagonInterp.set(h.id, {
                    x: h.x, y: h.y,
                    vx: h.vx || 0, vy: h.vy || 0,
                    angle: h.angle || 0,
                    lastUpdateClientMs: performance.now(),
                });
            }

            spawnOctagonSprite(o) {
                const sprite = this.add.image(o.x, o.y, 'octagon').setDepth(4);
                sprite.setDisplaySize(SIM.OCTAGON_SIZE, SIM.OCTAGON_SIZE);
                this.octagonSprites.set(o.id, sprite);
            }

            spawnProjectileSprite(p) {
                const sprite = this.add.image(p.x, p.y, 'block').setDepth(3);
                sprite.setDisplaySize(BLOCK_RENDER_SIZE, BLOCK_RENDER_SIZE);
                if (p.scale && p.scale !== 1) sprite.setScale(p.scale);
                this.projectileSprites.set(p.id, sprite);
                this.projectileInterp.set(p.id, {
                    x: p.x, y: p.y,
                    vx: p.vx || 0, vy: p.vy || 0,
                    lastUpdateClientMs: performance.now(),
                });
            }

            pushInterpSample(id, tServer, p) {
                let buf = this.interpBuffers.get(id);
                if (!buf) { buf = []; this.interpBuffers.set(id, buf); }
                buf.push({ tServer, x: p.x, y: p.y, vx: p.vx, vy: p.vy, alive: p.alive });
                const cutoff = tServer - INTERP_BUFFER_MAX_AGE_MS;
                while (buf.length > 0 && buf[0].tServer < cutoff) buf.shift();
            }

            sampleInterpState(id, renderTime) {
                const buf = this.interpBuffers.get(id);
                if (!buf || buf.length === 0) return null;
                if (renderTime <= buf[0].tServer) return buf[0];
                if (renderTime >= buf[buf.length - 1].tServer) return buf[buf.length - 1];
                for (let i = buf.length - 1; i > 0; i--) {
                    if (buf[i - 1].tServer <= renderTime && renderTime <= buf[i].tServer) {
                        const a = buf[i - 1], b = buf[i];
                        const span = b.tServer - a.tServer;
                        if (span <= 0) return a;
                        const t = (renderTime - a.tServer) / span;
                        return {
                            tServer: renderTime,
                            x: a.x + (b.x - a.x) * t,
                            y: a.y + (b.y - a.y) * t,
                            vx: a.vx + (b.vx - a.vx) * t,
                            vy: a.vy + (b.vy - a.vy) * t,
                            alive: t < 1.0 ? a.alive : b.alive,
                        };
                    }
                }
                return buf[buf.length - 1];
            }

            showCountdownUI() {
                if (this.countdownText) return;
                this.countdownText = this.add.text(
                    CANVAS_WIDTH / 2, 440, '',
                    {
                        fontFamily: 'Arial', fontSize: '180px', fontStyle: 'bold',
                        color: '#000000', stroke: '#ffffff', strokeThickness: 12
                    }
                ).setOrigin(0.5).setScrollFactor(0).setDepth(150);
                this.lastCountdownNumberShown = null;

                // Notification slot — floating "[name] joined" texts spawn here
                this.countdownNotifY = 640;

                // TAP TO JOIN — big button at the bottom, triggered by tap anywhere or spacebar
                this.countdownJoinButton = this.add.rectangle(
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT - 160, 400, 100, 0x000000
                ).setScrollFactor(0).setDepth(151);

                this.countdownJoinButtonText = this.add.text(
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT - 160, 'TAP TO JOIN',
                    { fontFamily: 'Arial', fontSize: '52px', fontStyle: 'bold', color: '#ffffff' }
                ).setOrigin(0.5).setScrollFactor(0).setDepth(152);

                // One-shot handler shared by pointer and spacebar
                this._doJoin = () => {
                    if (!this.countdownJoinButton) return;  // already joined
                    sendReady();
                    if (!musicStarted) startMusic();
                    // Hide the TAP TO JOIN prompt immediately
                    if (this.countdownJoinButton) { this.countdownJoinButton.destroy(); this.countdownJoinButton = null; }
                    if (this.countdownJoinButtonText) { this.countdownJoinButtonText.destroy(); this.countdownJoinButtonText = null; }
                    this.input.off('pointerdown', this._doJoin, this);
                };

                this.input.on('pointerdown', this._doJoin, this);
                if (this.spaceKey) this.spaceKey.on('down', this._doJoin, this);
            }

            hideCountdownUI() {
                if (this.countdownText) {
                    this.countdownText.destroy();
                    this.countdownText = null;
                }
                this.lastCountdownNumberShown = null;
                if (this.countdownReadyText) { this.countdownReadyText.destroy(); this.countdownReadyText = null; }
                if (this.countdownJoinButton) { this.countdownJoinButton.destroy(); this.countdownJoinButton = null; }
                if (this.countdownJoinButtonText) { this.countdownJoinButtonText.destroy(); this.countdownJoinButtonText = null; }
                if (this._doJoin) {
                    this.input.off('pointerdown', this._doJoin, this);
                    if (this.spaceKey) this.spaceKey.off('down', this._doJoin, this);
                    this._doJoin = null;
                }
            }

            updateCountdownUI(remainingMs) {
                if (!this.countdownText) return;
                const number = Math.ceil(remainingMs / 1000);
                const text = number > 0 ? String(number) : 'GO!';
                if (text !== this.lastCountdownNumberShown) {
                    this.countdownText.setText(text);
                    this.lastCountdownNumberShown = text;
                    this.countdownText.setScale(1.2);
                    this.tweens.add({
                        targets: this.countdownText, scale: 1.0, duration: 400, ease: 'Quad.easeOut',
                    });
                }
            }

            // Floating "[name] joined" notification that fades upward after 1 s.
            showJoinedNotification(playerName) {
                if (!this.countdownText) return;  // not in countdown UI
                const t = this.add.text(
                    CANVAS_WIDTH / 2, this.countdownNotifY || 640,
                    playerName + ' joined',
                    {
                        fontFamily: 'Arial', fontSize: '28px', fontStyle: 'bold',
                        color: '#000000', stroke: '#ffffff', strokeThickness: 5
                    }
                ).setOrigin(0.5).setScrollFactor(0).setDepth(155).setAlpha(1);

                // Hold 1 s, then float up and fade over 1 s
                this.tweens.add({
                    targets: t,
                    y: t.y - 80,
                    alpha: 0,
                    delay: 1000,
                    duration: 1000,
                    ease: 'Quad.easeIn',
                    onComplete: () => t.destroy(),
                });
            }

            // ── Waiting-lobby UI (shown when roundState === ROUND_WAITING) ──────────

            showWaitingUI() {
                if (this.waitingUI) return;
                const objs = {};
                objs.overlay = this.add.rectangle(
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, CANVAS_WIDTH, CANVAS_HEIGHT, 0x000000, 0.72
                ).setScrollFactor(0).setDepth(200);

                objs.title = this.add.text(
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 80, 'THE CITADEL AWAITS',

                ).setOrigin(0.5).setScrollFactor(0).setDepth(201);

                objs.button = this.add.rectangle(
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT - 160, 280, 70, 0xffffff
                ).setScrollFactor(0).setDepth(201).setInteractive({ useHandCursor: true });

                objs.buttonText = this.add.text(
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT - 160, 'READY',

                ).setOrigin(0.5).setScrollFactor(0).setDepth(202);

            hideWaitingUI() {

            // ── Spectating banner (shown when player is watching but not in-round) ─

            showSpectatingUI() {
                if (this.spectatingText) return;
                this.spectatingText = this.add.text(
                    CANVAS_WIDTH / 2, 20, '👁 SPECTATING',
                    {
                        fontFamily: 'Arial', fontSize: '24px', fontStyle: 'bold',
                        color: '#ffffff', stroke: '#000000', strokeThickness: 5
                    }
                ).setOrigin(0.5, 0).setScrollFactor(0).setDepth(100);
            }

            hideSpectatingUI() {
                if (this.spectatingText) { this.spectatingText.destroy(); this.spectatingText = null; }
            }

            updateTopScorer(players) {
                // Collect and sort all in-round player scores descending
                const scores = [];
                for (const id in players) {
                    if (!players[id].inRound) continue;  // skip spectators
                    scores.push({ id, score: players[id].score || 0 });
                }
                scores.sort((a, b) => b.score - a.score);

                if (scores.length > 0 && scores[0].score > 0) {
                    topScorerEl.textContent = scores[0].id + ' - ' + scores[0].score;
                    topScorerEl.style.display = 'block';
                } else {
                    topScorerEl.style.display = 'none';
                }

                if (scores.length > 1 && scores[1].score > 0) {
                    secondScorerEl.textContent = scores[1].id + ' - ' + scores[1].score;
                    secondScorerEl.style.display = 'block';
                } else {
                    secondScorerEl.style.display = 'none';
                }
            }

            applySnapshot(snap) {
                if (snap.tServer != null && snap.tServer > this.latestServerTime) {
                    this.latestServerTime = snap.tServer;
                }

                const prevRoundState = this.roundState;
                if (snap.roundState) this.roundState = snap.roundState;

                if (prevRoundState !== ROUND_OVER && this.roundState === ROUND_OVER) {
                    this.showRoundOverUI(snap.finalScores || []);
                } else if (this.roundState === ROUND_OVER) {
                    this.refreshRoundOverScores(snap.finalScores || []);
                } else if (prevRoundState === ROUND_OVER && this.roundState !== ROUND_OVER) {
                    this.hideGameOverUI();
                }

                // ── ROUND_WAITING ──────────────────────────────────────────────────
                if (this.roundState === ROUND_WAITING) {
                    this.showWaitingUI();
                } else if (prevRoundState === ROUND_WAITING && this.roundState !== ROUND_WAITING) {
                    this.hideWaitingUI();
                }

                if (this.roundState === ROUND_COUNTDOWN) {
                    this.showCountdownUI();
                    this.updateCountdownUI(snap.countdownRemainingMs || 0);

                    // Detect newly-joined players and show "[name] joined" notifications
                    if (snap.readyPlayerIds) {
                        for (const pid of snap.readyPlayerIds) {
                            if (!this.countdownReadySet.has(pid)) {
                                this.countdownReadySet.add(pid);
                                this.showJoinedNotification(pid);
                            }
                        }
                    }

                    // Hide TAP TO JOIN once this client has joined
                    if (snap.myReady) {
                        if (this.countdownJoinButton) { this.countdownJoinButton.destroy(); this.countdownJoinButton = null; }
                        if (this.countdownJoinButtonText) { this.countdownJoinButtonText.destroy(); this.countdownJoinButtonText = null; }
                        if (this._doJoin) {
                            this.input.off('pointerdown', this._doJoin, this);
                            if (this.spaceKey) this.spaceKey.off('down', this._doJoin, this);
                            this._doJoin = null;
                        }
                    }
                } else if (prevRoundState === ROUND_COUNTDOWN && this.roundState !== ROUND_COUNTDOWN) {
                    this.hideCountdownUI();
                }

                // ── Spectating detection ───────────────────────────────────────────
                const mySnapData = snap.players ? snap.players[mySessionId] : null;
                if (mySnapData && !mySnapData.inRound && this.roundState === ROUND_RUNNING && !this.isSpectating) {
                    this.isSpectating = true;
                    this.cameras.main.stopFollow();
                    this.showSpectatingUI();
                }
                if (this.isSpectating && snap.leadingPlayerY != null) {
                    this.spectatorCameraY = snap.leadingPlayerY;
                }

                if (snap.newSideWallSegments) for (const seg of snap.newSideWallSegments) this.spawnSideWallSegment(seg);
                if (snap.newBlocks) for (const b of snap.newBlocks) this.spawnBlockSprite(b);
                if (snap.newCoins) for (const c of snap.newCoins) this.spawnCoinSprite(c);
                if (snap.newPentagons) for (const p of snap.newPentagons) this.spawnPentagonSprite(p);
                if (snap.newHexagonPairs) for (const h of snap.newHexagonPairs) this.spawnHexagonPairSprite(h);
                if (snap.newHeptagons) for (const h of snap.newHeptagons) this.spawnHeptagonSprite(h);
                if (snap.newOctagons) for (const o of snap.newOctagons) this.spawnOctagonSprite(o);
                if (snap.newProjectiles) for (const p of snap.newProjectiles) this.spawnProjectileSprite(p);

                if (snap.removedBlockIds) for (const id of snap.removedBlockIds) {
                    const s = this.blockSprites.get(id);
                    if (s) { s.destroy(); this.blockSprites.delete(id); }
                }
                if (snap.removedCoinIds) for (const id of snap.removedCoinIds) {
                    const s = this.coinSprites.get(id);
                    if (s) { s.destroy(); this.coinSprites.delete(id); }
                }
                if (snap.removedPentagonIds) for (const id of snap.removedPentagonIds) {
                    const s = this.pentagonSprites.get(id);
                    if (s) { s.destroy(); this.pentagonSprites.delete(id); }
                    this.pentagonInterp.delete(id);
                }
                if (snap.removedHexagonPairIds) for (const id of snap.removedHexagonPairIds) {
                    const refs = this.hexagonPairSprites.get(id);
                    if (refs) {
                        refs.leftHex.destroy(); refs.rightHex.destroy();
                        refs.beamRect.destroy(); refs.beamGfx.destroy();
                        this.hexagonPairSprites.delete(id);
                    }
                }
                if (snap.removedHeptagonIds) for (const id of snap.removedHeptagonIds) {
                    const s = this.heptagonSprites.get(id);
                    if (s) { s.destroy(); this.heptagonSprites.delete(id); }
                    this.heptagonInterp.delete(id);
                }
                if (snap.removedOctagonIds) for (const id of snap.removedOctagonIds) {
                    const s = this.octagonSprites.get(id);
                    if (s) { s.destroy(); this.octagonSprites.delete(id); }
                }
                if (snap.removedProjectileIds) for (const id of snap.removedProjectileIds) {
                    const s = this.projectileSprites.get(id);
                    if (s) { s.destroy(); this.projectileSprites.delete(id); }
                    this.projectileInterp.delete(id);
                }

                if (snap.blockScales) {
                    for (const id in snap.blockScales) {
                        const s = this.blockSprites.get(id);
                        if (s) s.setScale(snap.blockScales[id]);
                    }
                }

                const nowClient = performance.now();
                if (snap.pentagonStates) {
                    for (const id in snap.pentagonStates) {
                        const st = snap.pentagonStates[id];
                        const rec = this.pentagonInterp.get(id);
                        if (rec) {
                            rec.x = st.x; rec.y = st.y;
                            rec.angle = st.angle;
                            rec.lastUpdateClientMs = nowClient;
                        }
                    }
                }
                if (snap.heptagonStates) {
                    for (const id in snap.heptagonStates) {
                        const st = snap.heptagonStates[id];
                        const rec = this.heptagonInterp.get(id);
                        if (rec) {
                            rec.x = st.x; rec.y = st.y;
                            rec.vx = st.vx; rec.vy = st.vy;
                            rec.angle = st.angle;
                            rec.lastUpdateClientMs = nowClient;
                        }
                    }
                }
                if (snap.projectileStates) {
                    for (const id in snap.projectileStates) {
                        const st = snap.projectileStates[id];
                        const rec = this.projectileInterp.get(id);
                        if (rec) {
                            rec.x = st.x; rec.y = st.y;
                            rec.vx = st.vx; rec.vy = st.vy;
                            rec.lastUpdateClientMs = nowClient;
                        }
                        const sprite = this.projectileSprites.get(id);
                        if (sprite && st.scale != null) sprite.setScale(st.scale);
                    }
                }

                if (snap.hexagonPairStates) {
                    for (const id in snap.hexagonPairStates) {
                        const refs = this.hexagonPairSprites.get(id);
                        if (!refs) continue;
                        const st = snap.hexagonPairStates[id];
                        refs.leftHex.angle = st.leftAngle;
                        refs.rightHex.angle = st.rightAngle;
                        if (st.beamActive) {
                            refs.beamRect.setVisible(true);
                            const beamWidth = (refs.rightX - refs.leftX) - SIM.HEXAGON_SIZE;
                            refs.beamRect.setSize(beamWidth, st.beamHeight);
                        } else {
                            refs.beamRect.setVisible(false);
                            refs.beamGfx.clear();
                        }
                    }
                }

                if (snap.octagonStates) {
                    for (const id in snap.octagonStates) {
                        const sprite = this.octagonSprites.get(id);
                        if (!sprite) continue;
                        const st = snap.octagonStates[id];
                        sprite.setScale(st.pulseScale);
                    }
                }

                if (snap.spikeY != null) {
                    this.spikeContainer.y = snap.spikeY;
                    this.latestSpikeY = snap.spikeY;
                }

                const seenIds = new Set();
                for (const id in snap.players) {
                    seenIds.add(id);
                    const p = snap.players[id];

                    this.latestPlayerData.set(id, { x: p.x, y: p.y, alive: p.alive });

                    const isMe = (id === mySessionId);
                    let v = this.playerVisuals.get(id);
                    if (!v) {
                        v = this.createPlayerVisual(id, isMe);
                        this.playerVisuals.set(id, v);
                        if (isMe) {
                            this.cameraTarget = v.sprite;
                            if (!this.isSpectating) {
                                this.cameras.main.startFollow(v.sprite, true, 0.1, 0.1);
                            }
                        }
                    }

                    if (isMe) {
                        if (this.myState === null) {
                            this.myState = {
                                x: p.x, y: p.y, vx: p.vx, vy: p.vy,
                                alive: p.alive,
                                lastFlapTime: -Infinity,
                                nextFlapDirection: 1,
                            };
                        }
                        this.myServerTarget = {
                            x: p.x, y: p.y, vx: p.vx, vy: p.vy,
                            alive: p.alive, score: p.score,
                            hasStarted: snap.hasStarted, stunned: p.stunned,
                        };
                        if (this.myState.alive && !p.alive) this.myState.alive = false;

                        if (this.scoreText) {
                            const s = (p.score || 0).toString();
                            if (this.scoreText.text !== s) {
                                this.scoreText.setText(s);
                                this.tweens.add({ targets: this.scoreText, scale: 1.2, duration: 100, yoyo: true });
                            }
                        }

                        const wasAlive = this.previousAlive.get(id);
                        if (wasAlive !== false && p.alive === false) {
                            v.sprite.setTint(0xff0000);
                            v.eyesContainer.setVisible(false);
                        }
                        this.previousAlive.set(id, p.alive);
                    } else {
                        this.pushInterpSample(id, snap.tServer || 0, p);
                    }
                }

                // Update top-scorer display every snapshot
                if (snap.players) {
                    this.updateTopScorer(snap.players);
                }

                for (const [id, v] of this.playerVisuals) {
                    if (!seenIds.has(id)) {
                        this.destroyPlayerVisual(v);
                        this.playerVisuals.delete(id);
                        this.interpBuffers.delete(id);
                        this.latestPlayerData.delete(id);
                        if (this.cameraTarget === v.sprite) {
                            this.cameraTarget = null;
                            this.cameras.main.stopFollow();
                        }
                    }
                }

                if (snap.events) {
                    for (const ev of snap.events) {
                        if (ev.type === 'coin_collected') this.playCoinFX(ev.x, ev.y);
                        else if (ev.type === 'hit') {
                            this.spawnParticles(ev.x, ev.y);
                            if (ev.playerId === mySessionId) {
                                this.cameras.main.shake(80, 0.004);
                            }
                        } else if (ev.type === 'interval_reached') {
                            this.cameras.main.flash(300, 255, 255, 255);
                        }
                    }
                }
            }

            playFlapJuice(v) {
                const stretchY = 1.6, squishX = 0.6;
                const slant = (Math.random() - 0.5) * 30;
                const base = PLAYER_BASE_SCALE;
                this.tweens.killTweensOf(v.sprite);
                this.tweens.chain({
                    targets: v.sprite,
                    tweens: [
                        {
                            scaleX: squishX * base, scaleY: stretchY * base, angle: slant,
                            duration: 120, ease: 'Sine.easeOut'
                        },
                        {
                            scaleX: 1.3 * base, scaleY: 0.8 * base, angle: -slant * 0.5,
                            duration: 180, ease: 'Quad.easeInOut'
                        },
                        {
                            scaleX: base, scaleY: base, angle: 0,
                            duration: 400, ease: 'Elastic.easeOut', easeParams: [1, 0.5]
                        }
                    ]
                });
            }

            playCoinFX(x, y) {
                const shockWhite = this.add.circle(x, y, 10, 0xffffff, 0).setStrokeStyle(3, 0xffffff).setDepth(50);
                const shockBlack = this.add.circle(x, y, 10, 0x000000, 0).setStrokeStyle(3, 0x000000).setDepth(50);
                this.tweens.add({
                    targets: shockWhite, radius: 120, alpha: { from: 1, to: 0 },
                    duration: 450, ease: 'Quad.easeOut', onComplete: () => shockWhite.destroy()
                });
                this.tweens.add({
                    targets: shockBlack, radius: 140, alpha: { from: 1, to: 0 },
                    delay: 50, duration: 500, ease: 'Quad.easeOut', onComplete: () => shockBlack.destroy()
                });
            }

            spawnParticles(x, y) {
                for (let i = 0; i < 10; i++) {
                    const p = this.add.image(x, y, 'particle').setDepth(20);
                    const vx = (Math.random() - 0.5) * 600;
                    const vy = -Math.random() * 400 - 200;
                    this.tweens.add({
                        targets: p,
                        x: p.x + vx * 0.6,
                        y: p.y + vy * 0.6 + 144,
                        alpha: 0, scale: 0.1, angle: Math.random() * 360,
                        duration: 600, ease: 'Cubic.easeIn',
                        onComplete: () => p.destroy()
                    });
                }
            }

            showRoundOverUI(finalScores) {
                if (this.gameOverOverlayShown) {
                    this.refreshRoundOverScores(finalScores);
                    return;
                }
                this.gameOverOverlayShown = true;

                const objs = {
                    overlay: null,
                    title: null,
                    scoreLines: [],
                    readyButton: null,
                    readyButtonText: null,
                };

                objs.overlay = this.add.rectangle(
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2,
                    CANVAS_WIDTH, CANVAS_HEIGHT, 0x000000, 0.8
                ).setScrollFactor(0).setDepth(200);

                objs.title = this.add.text(
                    CANVAS_WIDTH / 2, 220, 'GAME OVER',
                    {
                        fontFamily: 'Arial', fontSize: '64px', fontStyle: 'bold',
                        color: '#ffffff', stroke: '#000000', strokeThickness: 6
                    }
                ).setOrigin(0.5).setScrollFactor(0).setDepth(201);

                const maxLines = 8;
                for (let i = 0; i < maxLines; i++) {
                    const lineY = 320 + i * 44;
                    const t = this.add.text(CANVAS_WIDTH / 2, lineY, '', {
                        fontFamily: 'Arial', fontSize: '28px', fontStyle: 'bold',
                        color: '#ffffff', stroke: '#000000', strokeThickness: 4,
                    }).setOrigin(0.5).setScrollFactor(0).setDepth(201).setVisible(false);
                    objs.scoreLines.push(t);
                }

                objs.readyButton = this.add.rectangle(
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT - 160, 280, 70, 0xffffff
                ).setScrollFactor(0).setDepth(201).setInteractive({ useHandCursor: true });

                objs.readyButtonText = this.add.text(
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT - 160, 'READY',
                    { fontFamily: 'Arial', fontSize: '32px', fontStyle: 'bold', color: '#000000' }
                ).setOrigin(0.5).setScrollFactor(0).setDepth(202);

                objs.readyButton.on('pointerdown', () => {
                    sendReady();
                    objs.readyButtonText.setText('WAITING...');
                    objs.readyButton.fillColor = 0xcccccc;
                });

                this.gameOverObjs = objs;
                this.refreshRoundOverScores(finalScores);
            }

            refreshRoundOverScores(finalScores) {
                if (!this.gameOverObjs) return;
                const lines = this.gameOverObjs.scoreLines;
                for (let i = 0; i < lines.length; i++) {
                    if (i < finalScores.length) {
                        const entry = finalScores[i];
                        const rank = (i + 1) + '.';
                        const isMe = entry.id === mySessionId;
                        const label = `${rank} ${entry.id}${isMe ? ' (you)' : ''}  -  ${entry.score}`;
                        lines[i].setText(label).setVisible(true);
                    } else {
                        lines[i].setVisible(false);
                    }
                }
            }

            hideGameOverUI() {
                if (!this.gameOverObjs) return;
                const o = this.gameOverObjs;
                if (o.overlay) o.overlay.destroy();
                if (o.title) o.title.destroy();
                for (const t of o.scoreLines) t.destroy();
                if (o.readyButton) o.readyButton.destroy();
                if (o.readyButtonText) o.readyButtonText.destroy();
                this.gameOverObjs = null;
                this.gameOverOverlayShown = false;
            }

            applyFlapToMyState() {
                if (!this.myState || !this.myState.alive) return false;
                if (this.roundState !== ROUND_RUNNING) return false;
                if (this.myServerTarget && this.myServerTarget.stunned) return false;
                const now = performance.now();
                if (now - this.myState.lastFlapTime < SIM.FLAP_COOLDOWN_MS) return false;

                if (!musicStarted) startMusic();

                this.myState.vy = -SIM.JUMP_FORCE;
                this.myState.vx = SIM.HORIZONTAL_SPEED * this.myState.nextFlapDirection;
                this.myState.nextFlapDirection = (this.myState.nextFlapDirection === 1) ? -1 : 1;
                this.myState.lastFlapTime = now;
                clampVelocity(this.myState);
                return true;
            }

            stepMyState(deltaSeconds) {
                if (!this.myState || !this.myState.alive) return;
                if (this.myServerTarget && !this.myServerTarget.hasStarted) return;
                if (this.roundState !== ROUND_RUNNING) return;
                if (this.isSpectating) return;

                const s = this.myState;
                s.vy += SIM.GRAVITY * deltaSeconds;
                if (s.vy > SIM.MAX_FALL_SPEED) s.vy = SIM.MAX_FALL_SPEED;
                s.x += s.vx * deltaSeconds;
                s.y += s.vy * deltaSeconds;

                const minX = SIM.WALL_THICKNESS + SIM.PLAYER_RADIUS;
                const maxX = CANVAS_WIDTH - SIM.WALL_THICKNESS - SIM.PLAYER_RADIUS;
                if (s.x < minX) {
                    s.x = minX;
                    if (s.vx < 0) s.vx = -s.vx * (1 + SIM.PLAYER_BOUNCE * 0.5);
                }
                if (s.x > maxX) {
                    s.x = maxX;
                    if (s.vx > 0) s.vx = -s.vx * (1 + SIM.PLAYER_BOUNCE * 0.5);
                }
                clampVelocity(s);
            }

            reconcileMyState() {
                if (!this.myState || !this.myServerTarget) return;
                if (!this.myState.alive) return;
                const t = this.myServerTarget;
                this.myState.x += (t.x - this.myState.x) * RECONCILE_LERP;
                this.myState.y += (t.y - this.myState.y) * RECONCILE_LERP;
                const now = performance.now();
                const sinceLastFlap = now - this.myState.lastFlapTime;
                if (sinceLastFlap > POST_FLAP_VEL_GRACE_MS) {
                    this.myState.vx += (t.vx - this.myState.vx) * RECONCILE_VEL_LERP;
                    this.myState.vy += (t.vy - this.myState.vy) * RECONCILE_VEL_LERP;
                }
            }

            updateRemotePlayerVisuals() {
                const renderTime = this.latestServerTime - INTERP_DELAY_MS;
                for (const [id, v] of this.playerVisuals) {
                    if (id === mySessionId) continue;
                    const sample = this.sampleInterpState(id, renderTime);
                    if (!sample) continue;
                    v.sprite.x = sample.x;
                    v.sprite.y = sample.y;
                    v.eyesContainer.x = sample.x;
                    v.eyesContainer.y = sample.y;

                    const prevVx = v.lastVx;
                    if (Math.abs(sample.vx) > 50 && Math.sign(sample.vx) !== Math.sign(prevVx) && sample.alive) {
                        this.playFlapJuice(v);
                    }
                    v.lastVx = sample.vx;

                    v.targetEye.x = Phaser.Math.Clamp(sample.vx / 20, -6, 6);
                    v.targetEye.y = Phaser.Math.Clamp(sample.vy / 40, -4, 4);
                    v.targetPupil.x = v.targetEye.x * 0.5;
                    v.targetPupil.y = v.targetEye.y * 0.5;

                    const wasAlive = this.previousAlive.get(id);
                    if (wasAlive !== false && sample.alive === false) {
                        v.sprite.setTint(0xff0000);
                        v.eyesContainer.setVisible(false);
                    }
                    this.previousAlive.set(id, sample.alive);
                }
            }

            updatePolygonExtrapolation() {
                const nowClient = performance.now();
                const maxExtrapolateMs = 50;

                for (const [id, sprite] of this.heptagonSprites) {
                    const rec = this.heptagonInterp.get(id);
                    if (!rec) continue;
                    const dt = Math.min(nowClient - rec.lastUpdateClientMs, maxExtrapolateMs) / 1000;
                    sprite.x = rec.x + rec.vx * dt;
                    sprite.y = rec.y + rec.vy * dt;
                    sprite.angle = rec.angle;
                }

                for (const [id, sprite] of this.pentagonSprites) {
                    const rec = this.pentagonInterp.get(id);
                    if (!rec) continue;
                    const dt = Math.min(nowClient - rec.lastUpdateClientMs, maxExtrapolateMs) / 1000;
                    sprite.x = rec.x;
                    sprite.y = rec.y + 80 * dt;
                    sprite.angle = rec.angle;
                }

                for (const [id, sprite] of this.projectileSprites) {
                    const rec = this.projectileInterp.get(id);
                    if (!rec) continue;
                    const dt = Math.min(nowClient - rec.lastUpdateClientMs, maxExtrapolateMs) / 1000;
                    sprite.x = rec.x + rec.vx * dt;
                    sprite.y = rec.y + rec.vy * dt;
                }
            }

            drawBeamDashes(refs, time) {
                const gfx = refs.beamGfx;
                gfx.clear();
                if (!refs.beamRect.visible) return;

                const leftX = refs.leftX + SIM.HEXAGON_SIZE / 2;
                const rightX = refs.rightX - SIM.HEXAGON_SIZE / 2;
                const centerX = (leftX + rightX) / 2;
                const centerY = refs.y;

                gfx.lineStyle(2, 0x888888, 0.5);
                const speed = 0.4;
                const dashLength = 20;
                const dashSpacing = 60;
                const lanes = [-6, 0, 6];

                for (let laneIdx = 0; laneIdx < lanes.length; laneIdx++) {
                    const yPos = centerY + lanes[laneIdx];
                    const laneTimeOffset = laneIdx * 200;
                    const progress = ((time + laneTimeOffset) * speed) % dashSpacing;
                    for (let d = 0; d < 6; d++) {
                        const dashX = leftX + progress + (d * dashSpacing);
                        if (dashX > leftX && dashX + dashLength < centerX) {
                            gfx.beginPath();
                            gfx.moveTo(dashX, yPos);
                            gfx.lineTo(dashX + dashLength, yPos);
                            gfx.strokePath();
                        }
                    }
                    for (let d = 0; d < 6; d++) {
                        const dashX = rightX - progress - (d * dashSpacing);
                        if (dashX < rightX && dashX - dashLength > centerX) {
                            gfx.beginPath();
                            gfx.moveTo(dashX, yPos);
                            gfx.lineTo(dashX - dashLength, yPos);
                            gfx.strokePath();
                        }
                    }
                }
            }

            update(time, delta) {
                const dt = delta / 1000;

                if (this.bgFar && this.bgMid) {
                    this.bgFar.tilePositionY = this.cameras.main.scrollY * 0.1;
                    this.bgMid.tilePositionY = this.cameras.main.scrollY * 0.3;
                }

                // Spectator camera: smoothly track the leading player
                if (this.isSpectating && this.spectatorCameraY != null) {
                    const targetScrollY = this.spectatorCameraY - CANVAS_HEIGHT / 2;
                    this.cameras.main.scrollY += (targetScrollY - this.cameras.main.scrollY) * 0.05;
                }

                if (!this.gameOverOverlayShown && this.roundState === ROUND_RUNNING && !this.isSpectating) {
                    const pointer = this.input.activePointer;
                    const isHeld = (pointer && pointer.isDown) || (this.spaceKey && this.spaceKey.isDown);
                    if (isHeld) {
                        const localFlap = this.applyFlapToMyState();
                        if (localFlap) {
                            const myV = this.playerVisuals.get(mySessionId);
                            if (myV) this.playFlapJuice(myV);
                        }
                        sendFlap();
                    }
                }

                this.stepMyState(dt);
                this.reconcileMyState();

                if (this.myState) {
                    const myV = this.playerVisuals.get(mySessionId);
                    if (myV) {
                        myV.sprite.x = this.myState.x;
                        myV.sprite.y = this.myState.y;
                        myV.eyesContainer.x = this.myState.x;
                        myV.eyesContainer.y = this.myState.y;

                        myV.targetEye.x = Phaser.Math.Clamp(this.myState.vx / 20, -6, 6);
                        myV.targetEye.y = Phaser.Math.Clamp(this.myState.vy / 40, -4, 4);
                        myV.targetPupil.x = myV.targetEye.x * 0.5;
                        myV.targetPupil.y = myV.targetEye.y * 0.5;
                    }
                }

                this.updateRemotePlayerVisuals();
                this.updatePolygonExtrapolation();
                this.updateProximityIndicators();

                for (const refs of this.hexagonPairSprites.values()) {
                    this.drawBeamDashes(refs, time);
                }

                for (const v of this.playerVisuals.values()) {
                    v.currentEye.x += (v.targetEye.x - v.currentEye.x) * 0.15;
                    v.currentEye.y += (v.targetEye.y - v.currentEye.y) * 0.15;
                    v.currentPupil.x += (v.targetPupil.x - v.currentPupil.x) * 0.15;
                    v.currentPupil.y += (v.targetPupil.y - v.currentPupil.y) * 0.15;
                    v.eyeLeft.x = -24 + v.currentEye.x;
                    v.eyeLeft.y = -4 + v.currentEye.y;
                    v.eyeRight.x = 24 + v.currentEye.x;
                    v.eyeRight.y = -4 + v.currentEye.y;
                    v.pupilLeft.x = v.eyeLeft.x + v.currentPupil.x;
                    v.pupilLeft.y = v.eyeLeft.y + v.currentPupil.y;
                    v.pupilRight.x = v.eyeRight.x + v.currentPupil.x;
                    v.pupilRight.y = v.eyeRight.y + v.currentPupil.y;
                }

                if (this.spikes) {
                    this.spikes.forEach((s, idx) => {
                        s.y = Math.sin((time / 200) + idx) * 10;
                    });
                }
            }
        }

        new Phaser.Game({
            type: Phaser.WEBGL,
            parent: 'game-container',
            width: CANVAS_WIDTH,
            height: CANVAS_HEIGHT,
            scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
            backgroundColor: COLORS.background,
            scene: [GameScene],
        });
    </script>
</body>
