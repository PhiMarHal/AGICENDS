            <h3>Account</h3>
            <div class="profile-account-row">
                <span class="profile-account-label">Password</span>
                <span class="profile-account-value" id="profile-pw-status">…</span>
                <button class="profile-action-btn" id="profile-pw-btn" type="button">Set</button>
            </div>

            <div class="profile-account-row">
                <span class="profile-account-label">Wallet</span>
                <span class="profile-account-value" id="profile-wallet-status">…</span>
                <button class="profile-action-btn" id="profile-wallet-btn" type="button">Link</button>
            </div>
            <div class="profile-error" id="profile-wallet-error"></div>
            <div class="profile-success" id="profile-wallet-success"></div>
        </div>
    </div>

    <!-- Password modal — opened from the Profile modal's "Enable/Change"
         button. Sits at z 30 (above the profile modal at 25, below the
         confirm dialog at 35) so the destructive-removal confirm can
         still appear over it. -->
    <div id="profile-pw-overlay">
        <div id="profile-pw-panel">
            <div id="profile-pw-close" title="Close">×</div>
            <h2 id="profile-pw-title">Change password</h2>
            <input type="password" id="profile-pw-current" placeholder="Current password"
                autocomplete="current-password" maxlength="64">
            <input type="password" id="profile-pw-new" placeholder="New password" autocomplete="new-password"
                maxlength="64">
            <div class="profile-error" id="profile-pw-error"></div>
            <div id="profile-pw-buttons">
                <button class="profile-action-btn profile-pw-cancel" id="profile-pw-cancel"
                    type="button">Cancel</button>
                <button class="profile-action-btn" id="profile-pw-save" type="button">Save</button>
            </div>
        </div>
    </div>

    <!-- Generic confirm dialog. Driven by showConfirm() — see JS below. -->
    <div id="confirm-overlay">
        <div id="confirm-panel">
            <div id="confirm-message"></div>
            <div id="confirm-buttons">
                <button id="confirm-cancel" type="button">Cancel</button>
                <button id="confirm-ok" type="button">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Auth modal (sign in / sign up / claim wallet username). Hidden by default. -->
    <div id="auth-overlay">
        <div id="auth-modal">
            <h2 id="auth-title">Sign in</h2>
            <div id="auth-subtitle"></div>
            <label id="auth-username-label">Username
                <input type="text" id="auth-username" autocomplete="username" maxlength="16" autocapitalize="off"
                    autocorrect="off" spellcheck="false">
            </label>
            <label id="auth-password-label">Password
                <input type="password" id="auth-password" autocomplete="current-password" maxlength="64">
            </label>
            <div id="auth-error"></div>
            <button class="auth-full-btn" id="auth-submit" type="button">Sign In With Account</button>
            <div id="auth-toggle-link">Don't have an account? Sign up</div>
            <div id="auth-divider">or</div>
            <button class="auth-full-btn" id="auth-eth-btn" type="button">Sign In With Ethereum</button>
        </div>
    </div>

    <!-- Top right: speaker toggle -->
    <div id="speaker-btn"><span class="icon">🔊</span></div>

    <!-- Bottom left: scoreboard (one line per scoring player; mobile shows leader only) -->
    <div id="scoreboard"></div>

    <script>
        // ========================================================================
        // Music
        // ========================================================================
        const MUSIC_BASE_URL = 'https://agiscend.loiyaa.com/';
        const MUSIC_IS_LOCAL = window.location.protocol === 'file:';
        const MUSIC_TRACK_COUNT = 21;
        const MUSIC_SILENCE_BETWEEN_TRACKS = 4000;

        let musicPlaylist = [];
        let musicCurrentTrackIndex = 0;
        let musicAudioElement = null;
        let musicStarted = false;
        let musicTransitioning = false;
        let musicMuted = false;

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generateMusicPlaylist() {
            const tracks = [];
            for (let i = 1; i <= MUSIC_TRACK_COUNT; i++) {
                const trackNum = i.toString().padStart(2, '0');
                const trackPath = MUSIC_IS_LOCAL
                    ? `assets/track_${trackNum}.mp3`
                    : `${MUSIC_BASE_URL}assets/track_${trackNum}.mp3`;
                tracks.push(trackPath);
            }
            return shuffleArray(tracks);
        }

        function playNextTrack() {
            if (!musicStarted || musicTransitioning) return;
            musicTransitioning = true;
            if (musicCurrentTrackIndex >= musicPlaylist.length) {
                musicPlaylist = generateMusicPlaylist();
                musicCurrentTrackIndex = 0;
            }
            const trackPath = musicPlaylist[musicCurrentTrackIndex];
            musicCurrentTrackIndex++;
            if (musicAudioElement) {
                musicAudioElement.pause();
                musicAudioElement.removeAttribute('src');
                musicAudioElement.load();
                musicAudioElement = null;
            }
            musicAudioElement = new Audio();
            musicAudioElement.volume = 0.5;
            musicAudioElement.muted = musicMuted;
            musicAudioElement.onended = () => {
                musicTransitioning = false;
                setTimeout(playNextTrack, MUSIC_SILENCE_BETWEEN_TRACKS);
            };
            musicAudioElement.onerror = () => {
                console.warn('Could not load track:', trackPath);
                musicTransitioning = false;
                setTimeout(playNextTrack, 1000);
            };
            musicAudioElement.oncanplaythrough = () => {
                musicTransitioning = false;
                if (!musicMuted) musicAudioElement.play().catch(e => console.warn('Playback failed:', e));
            };
            musicAudioElement.src = trackPath;
            musicAudioElement.load();
        }

        function startMusic() {
            if (musicStarted) return;
            musicStarted = true;
            musicTransitioning = false;
            musicPlaylist = generateMusicPlaylist();
            musicCurrentTrackIndex = 0;
            playNextTrack();
        }

        document.addEventListener('visibilitychange', () => {
            if (!musicAudioElement) return;
            if (document.hidden) musicAudioElement.pause();
            else if (musicStarted) musicAudioElement.play().catch(() => { });
        });

        // ========================================================================
        // UI controls: hamburger menu + speaker toggle
        // ========================================================================
        const menuBtn = document.getElementById('menu-btn');
        const menuPanel = document.getElementById('menu-panel');
        const speakerBtn = document.getElementById('speaker-btn');
        const scoreboardEl = document.getElementById('scoreboard');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuPanel.classList.toggle('open');
        });

        // Prevent pointerdown / touchstart on overlay elements from reaching the Phaser canvas
        [menuBtn, menuPanel, speakerBtn].forEach(el => {
            el.addEventListener('pointerdown', e => e.stopPropagation());
            el.addEventListener('touchstart', e => e.stopPropagation(), { passive: false });
        });

        document.addEventListener('click', (e) => {
            if (!menuPanel.contains(e.target) && e.target !== menuBtn) {
                menuPanel.classList.remove('open');
            }
        });

        speakerBtn.addEventListener('click', () => {
            musicMuted = !musicMuted;
            if (musicAudioElement) {
                musicAudioElement.muted = musicMuted;
                if (!musicMuted && musicStarted) {
                    musicAudioElement.play().catch(() => { });
                }
            }
            speakerBtn.classList.toggle('muted', musicMuted);
        });

        // ========================================================================
        // Auth UI: sign in / sign up modal, token storage, menu wiring
        // ========================================================================
        // The Worker URL where signup/signin/verify endpoints live. Update this
        // if you point the Worker at a custom domain. The page can be served
        // from anywhere — localhost, a CDN, your real domain — and call out
        // to this URL via fetch (CORS is configured in the Worker).
        const AUTH_WORKER_URL = 'https://agiscends-auth.philoiyaa.workers.dev';
        const AUTH_TOKEN_KEY = 'agiscends_auth_token';

        // currentUser is { id, display_name } when logged in, null when anon.
        // It's set from the welcome message after the WebSocket handshake.
        let currentUser = null;

        function getStoredToken() {
            try { return localStorage.getItem(AUTH_TOKEN_KEY); } catch { return null; }
        }
        function setStoredToken(token) {
            try {
                if (token) localStorage.setItem(AUTH_TOKEN_KEY, token);
                else localStorage.removeItem(AUTH_TOKEN_KEY);
            } catch { /* ignore — private mode, etc. */ }
        }

        async function authSignIn(username, password) {
            const res = await fetch(AUTH_WORKER_URL + '/auth/bespoke/signin', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });
            return await res.json();
        }
        async function authSignUp(username, password) {
            const res = await fetch(AUTH_WORKER_URL + '/auth/bespoke/signup', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });
            return await res.json();
        }

        // Independently verifies a stored token directly with the Worker, so
        // the client knows its own auth state without relying on the game
        // server. Important for local dev: the game server might be running
        // without AUTH_WORKER_URL set (anon mode), but we're still logged in
        // — the menu should reflect that. Only clears the stored token if
        // the Worker explicitly rejects it. Network errors leave it alone.
        async function ensureAuthState() {
            if (currentUser) return;
            const token = getStoredToken();
            if (!token) return;
            try {
                const res = await fetch(AUTH_WORKER_URL + '/auth/verify', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ token }),
                });
                const data = await res.json();
                if (data && data.ok && data.user) {
                    currentUser = data.user;
                    updateMenuFromAuth();
                } else {
                    // Worker rejected it — bad/expired token, drop it.
                    setStoredToken(null);
                }
            } catch (_) {
                // Worker unreachable; keep token, stay anon for this session.
            }
        }

        // Map server error codes to friendly text the user sees in the modal.
        function friendlyAuthError(result) {
            if (!result) return 'Unknown error.';
            if (result.error === 'username_taken') return 'Username already taken.';
            if (result.error === 'invalid_username') return result.message || 'Invalid username.';
            if (result.error === 'invalid_password') return result.message || 'Invalid password.';
            if (result.error === 'invalid_credentials') return 'Wrong username or password.';
            if (result.error === 'signups_closed') return 'Sign-ups are currently closed.';
            if (result.error === 'ticket_invalid_or_expired') return 'Wallet session expired. Try Sign In With Ethereum again.';
            if (result.error === 'identity_already_claimed') return 'That wallet is already linked to another account.';
            return result.message || ('Error: ' + (result.error || 'unknown'));
        }

        // Updates the menu panel to reflect current auth state. Called when
        // welcome arrives, after a successful sign in, and after sign out.
        function updateMenuFromAuth() {
            const nameEl = document.getElementById('menu-player-name');
            const btnEl = document.getElementById('menu-auth-btn');
            const mmrEl = document.getElementById('menu-mmr');
            const profileEl = document.getElementById('menu-profile-link');
            if (currentUser) {
                nameEl.textContent = 'you are ' + currentUser.display_name;
                btnEl.textContent = 'Sign out';
                if (mmrEl) {
                    mmrEl.textContent = (currentUser.mmr != null ? currentUser.mmr : 1500) + ' MMR';
                    mmrEl.style.display = 'block';
                }
                if (profileEl) profileEl.style.display = 'block';
            } else {
                nameEl.textContent = 'you are ' + (mySessionId || '…');
                btnEl.textContent = 'Sign in';
                if (mmrEl) mmrEl.style.display = 'none';
                if (profileEl) profileEl.style.display = 'none';
            }
        }

        const authOverlay = document.getElementById('auth-overlay');
        const authTitle = document.getElementById('auth-title');
        const authSubtitle = document.getElementById('auth-subtitle');
        const authUsername = document.getElementById('auth-username');
        const authPassword = document.getElementById('auth-password');
        const authPasswordLabel = document.getElementById('auth-password-label');
        const authSubmit = document.getElementById('auth-submit');
        const authToggleLink = document.getElementById('auth-toggle-link');
        const authDivider = document.getElementById('auth-divider');
        const authEthBtn = document.getElementById('auth-eth-btn');
        const authError = document.getElementById('auth-error');
        const menuAuthBtn = document.getElementById('menu-auth-btn');

        // Modes:
        //   'signin' — username + password, both required
        //   'signup' — same, going to bespoke signup
        //   'claim'  — finishing a wallet sign-in: pick a username, password
        //              is OPTIONAL. The modal toggle/divider/ethereum-button
        //              rows are hidden in this mode (you can't switch flows
        //              mid-claim — the ticket is already minted).
        let authMode = 'signin';

        // When in 'claim' mode this holds the server-issued ticket from
        // /auth/wallet/verify. Cleared on close or successful claim.
        let walletClaimTicket = null;

        function refreshAuthModalUI() {
            // Reset visibility for non-claim modes; we'll re-hide things
            // below when authMode === 'claim'.
            authToggleLink.style.display = '';
            authDivider.style.display = '';
            authEthBtn.style.display = '';
            authPasswordLabel.style.display = '';
            authSubtitle.textContent = '';

            if (authMode === 'signin') {
                authTitle.textContent = 'Sign in';
                authSubmit.textContent = 'Sign In With Account';
                authPassword.autocomplete = 'current-password';
                authPasswordLabel.firstChild.textContent = 'Password';
                authToggleLink.textContent = "Don't have an account? Sign up";
            } else if (authMode === 'signup') {
                authTitle.textContent = 'Sign up';
                authSubmit.textContent = 'Sign Up';
                authPassword.autocomplete = 'new-password';
                authPasswordLabel.firstChild.textContent = 'Password';
                authToggleLink.textContent = 'Already have an account? Sign in';
            } else if (authMode === 'claim') {
                authTitle.textContent = 'Choose a username';
                authSubtitle.textContent =
                    'Signed in with Ethereum. Pick a username to finish setting up your account.';
                authSubmit.textContent = 'Create Account';
                authPassword.autocomplete = 'new-password';
                // Password is optional in this flow — make that explicit.
                authPasswordLabel.firstChild.textContent = 'Password (optional)';
                // No flow-switching from inside the claim step.
                authToggleLink.style.display = 'none';
                authDivider.style.display = 'none';
                authEthBtn.style.display = 'none';
            }
        }

        function openAuthModal(mode) {
            authMode = mode;
            refreshAuthModalUI();
            authError.textContent = '';
            authUsername.value = '';
            authPassword.value = '';
            authSubmit.disabled = false;
            authEthBtn.disabled = false;
            authOverlay.classList.add('open');
            setTimeout(() => authUsername.focus(), 0);
        }
        function closeAuthModal() {
            authOverlay.classList.remove('open');
            authSubmit.disabled = false;
            authEthBtn.disabled = false;
            // If we close mid-claim, drop the ticket. The server-side TTL
            // (10 min) will clean it up eventually anyway; no harm done.
            walletClaimTicket = null;
        }

        // Click on the backdrop (but not inside the modal box) closes the modal.
        // Helper: attach a "click-outside-to-close" handler that only
        // fires on TRUE backdrop clicks — i.e., both the mousedown and
        // the click landed on the overlay backdrop itself, not on the
        // panel inside it. Prevents the surprising case where a user
        // selects text inside the panel by dragging past its edge and
        // releases over the backdrop, accidentally dismissing the
        // modal. Optional `canClose` predicate gates closure (used by
        // the mode picker, which is sometimes non-cancelable).
        function attachOverlayBackdropClose(overlay, closeFn, canClose) {
            let mouseDownOnOverlay = false;
            overlay.addEventListener('mousedown', (e) => {
                mouseDownOnOverlay = (e.target === overlay);
            });
            overlay.addEventListener('click', (e) => {
                const wasBackdrop = mouseDownOnOverlay;
                mouseDownOnOverlay = false;
                if (e.target !== overlay) return;
                if (!wasBackdrop) return;
                if (canClose && !canClose()) return;
                closeFn();
            });
        }

        attachOverlayBackdropClose(authOverlay, closeAuthModal);

        // Toggle signin ↔ signup. No-op in claim mode (the link is hidden).
        authToggleLink.addEventListener('click', () => {
            if (authMode === 'claim') return;
            authMode = (authMode === 'signin') ? 'signup' : 'signin';
            refreshAuthModalUI();
            authError.textContent = '';
        });

        async function submitAuthForm() {
            const username = authUsername.value.trim();
            const password = authPassword.value;

            if (authMode === 'claim') {
                // Username required, password optional. Server enforces
                // length rules — we just check presence here.
                if (!username) {
                    authError.textContent = 'Username required.';
                    return;
                }
                if (!walletClaimTicket) {
                    authError.textContent = 'Wallet session expired. Try Sign In With Ethereum again.';
                    return;
                }
                authError.textContent = '';
                authSubmit.disabled = true;
                try {
                    const body = { ticket: walletClaimTicket, username };
                    if (password) body.password = password;
                    const res = await fetch(AUTH_WORKER_URL + '/auth/wallet/claim', {
                        method: 'POST',
                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify(body),
                    });
                    const result = await res.json();
                    if (result && result.token && result.user) {
                        walletClaimTicket = null;
                        finishAuthSuccess(result);
                    } else {
                        authError.textContent = friendlyAuthError(result);
                    }
                } catch (_) {
                    authError.textContent = 'Network error. Check your connection.';
                } finally {
                    authSubmit.disabled = false;
                }
                return;
            }

            // signin / signup
            if (!username || !password) {
                authError.textContent = 'Username and password required.';
                return;
            }
            authError.textContent = '';
            authSubmit.disabled = true;
            try {
                const result = authMode === 'signin'
                    ? await authSignIn(username, password)
                    : await authSignUp(username, password);
                if (result && result.token && result.user) {
                    finishAuthSuccess(result);
                } else {
                    authError.textContent = friendlyAuthError(result);
                }
            } catch (_) {
                authError.textContent = 'Network error. Check your connection.';
            } finally {
                authSubmit.disabled = false;
            }
        }

        // Shared post-auth handler: store the token, update the menu,
        // close the modal, reconnect the WebSocket so the game server
        // sees us as the new identity. Safe to run from any of the auth
        // paths (bespoke signin/signup, wallet claim).
        function finishAuthSuccess(result) {
            setStoredToken(result.token);
            currentUser = result.user;
            updateMenuFromAuth();
            closeAuthModal();
            if (ws && ws.readyState === WebSocket.OPEN) ws.close();
            connect();
        }

        authSubmit.addEventListener('click', submitAuthForm);
        // Enter from either input triggers submit.
        [authUsername, authPassword].forEach(el => {
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') submitAuthForm();
            });
        });

        // Esc closes the modal.
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && authOverlay.classList.contains('open')) {
                closeAuthModal();
            }
        });

        // Stop pointer events on the auth overlay from reaching the Phaser canvas.
        authOverlay.addEventListener('pointerdown', e => e.stopPropagation());
        authOverlay.addEventListener('touchstart', e => e.stopPropagation(), { passive: false });

        // Sign in / sign out button inside the menu.
        menuAuthBtn.addEventListener('click', () => {
            if (currentUser) {
                // Sign out: drop the token and reconnect as anonymous.
                setStoredToken(null);
                currentUser = null;
                updateMenuFromAuth();
                if (ws && ws.readyState === WebSocket.OPEN) ws.close();
                connect();
            } else {
                openAuthModal('signin');
            }
        });

        // Shared wallet-signing dance, used by both the Sign-In flow
        // (signInWithEthereum below) and the Profile's Link Wallet flow.
        // Returns { address, message, signature } on success, or throws
        // an Error with a user-friendly message. Caller chooses which
        // /verify endpoint to POST the result to.
        async function performWalletSignature() {
            if (!window.ethereum) {
                throw new Error('No wallet detected.');
            }
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            if (!accounts || accounts.length === 0) {
                throw new Error('No accounts available.');
            }
            const address = accounts[0];

            const nonceRes = await fetch(AUTH_WORKER_URL + '/auth/wallet/nonce');
            const nonceData = await nonceRes.json();
            if (!nonceData || !nonceData.nonce) {
                throw new Error('Wallet sign-in unavailable right now.');
            }

            // EIP-4361 message. Fields exactly match what the server's
            // parseSiweMessage expects (it needs the address line and
            // the Nonce: line).
            const domain = window.location.host;
            const uri = window.location.origin;
            const issuedAt = new Date().toISOString();
            const message =
                domain + ' wants you to sign in with your Ethereum account:\n' +
                address + '\n' +
                '\n' +
                (nonceData.statement || 'Sign in.') + '\n' +
                '\n' +
                'URI: ' + uri + '\n' +
                'Version: 1\n' +
                'Chain ID: 1\n' +
                'Nonce: ' + nonceData.nonce + '\n' +
                'Issued At: ' + issuedAt;

            let signature;
            try {
                signature = await window.ethereum.request({
                    method: 'personal_sign',
                    params: [message, address],
                });
            } catch (signErr) {
                if (signErr && (signErr.code === 4001 || signErr.code === 'ACTION_REJECTED')) {
                    throw new Error('Sign request rejected.');
                }
                throw new Error('Wallet failed to sign.');
            }

            return { address, message, signature };
        }

        // ── Sign In With Ethereum (SIWE / EIP-4361) ───────────────────
        //
        // Implicitly advanced: if the user doesn't have an injected
        // wallet (window.ethereum), we show a short error inline. We
        // don't link them to install one — this is meant for crypto-
        // native users.
        async function signInWithEthereum() {
            authError.textContent = '';
            authEthBtn.disabled = true;
            try {
                const { address, message, signature } = await performWalletSignature();

                const verifyRes = await fetch(AUTH_WORKER_URL + '/auth/wallet/verify', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ message, signature, address }),
                });
                const verifyData = await verifyRes.json();

                if (verifyData && verifyData.token && verifyData.user) {
                    // Existing identity → straight to logged in.
                    finishAuthSuccess(verifyData);
                } else if (verifyData && verifyData.claim_ticket) {
                    // New identity → switch modal to claim mode and
                    // wait for the user to pick a username.
                    walletClaimTicket = verifyData.claim_ticket;
                    authMode = 'claim';
                    refreshAuthModalUI();
                    authError.textContent = '';
                    authUsername.value = '';
                    authPassword.value = '';
                    setTimeout(() => authUsername.focus(), 0);
                } else {
                    authError.textContent = friendlyWalletError(verifyData);
                }
            } catch (err) {
                // performWalletSignature throws Error objects with
                // user-readable messages already; just surface them.
                authError.textContent = err.message || 'Wallet sign-in failed.';
            } finally {
                authEthBtn.disabled = false;
            }
        }

        // Translate server-side wallet error codes into modal-friendly
        // text. Anything we don't have a phrasing for falls through to
        // the raw code so we still surface something useful.
        function friendlyWalletError(result) {
            if (!result) return 'Wallet sign-in failed.';
            switch (result.error) {
                case 'invalid_signature': return 'Signature didn\'t verify.';
                case 'signature_mismatch': return 'Signature didn\'t match the wallet address.';
                case 'address_mismatch': return 'Wallet address didn\'t match the signed message.';
                case 'nonce_invalid_or_expired': return 'Sign-in took too long. Please try again.';
                case 'malformed_message': return 'Internal: malformed sign-in message.';
                case 'invalid_address': return 'Invalid wallet address.';
                case 'account_disabled': return 'This account has been disabled.';
                default: return 'Wallet sign-in failed: ' + (result.error || 'unknown');
            }
        }

        authEthBtn.addEventListener('click', signInWithEthereum);

        // ── Profile modal ─────────────────────────────────────────────
        //
        // Opens from the menu's "Profile" link (visible only when signed
        // in). On open: GETs /me/profile + /me/matches?mode=devils,
        // populates everything. Mode toggle re-fetches /me/matches.
        // Account section offers "Set/Change password" and "Link wallet"
        // actions that hit /me/set-password and /me/link-wallet/verify
        // respectively.

        const profileOverlay = document.getElementById('profile-overlay');
        const profilePanel = document.getElementById('profile-panel');
        const profileClose = document.getElementById('profile-close');
        const menuProfileLink = document.getElementById('menu-profile-link');

        // Header
        const profileDisplayName = document.getElementById('profile-displayname');
        const profileMmr = document.getElementById('profile-mmr');

        // Stats
        const profDevilsGames = document.getElementById('profile-devils-games');
        const profDevilsWins = document.getElementById('profile-devils-wins');
        const profDevilsBest = document.getElementById('profile-devils-best');
        const profAngelsGames = document.getElementById('profile-angels-games');
        const profAngelsBest = document.getElementById('profile-angels-best');

        // Match history
        const profileModeBtns = document.querySelectorAll('.profile-mode-btn');
        const profileMatches = document.getElementById('profile-matches');

        // Account
        const profilePwStatus = document.getElementById('profile-pw-status');
        const profilePwBtn = document.getElementById('profile-pw-btn');
        const profilePwOverlay = document.getElementById('profile-pw-overlay');
        const profilePwPanel = document.getElementById('profile-pw-panel');
        const profilePwTitle = document.getElementById('profile-pw-title');
        const profilePwClose = document.getElementById('profile-pw-close');
        const profilePwCurrent = document.getElementById('profile-pw-current');
        const profilePwNew = document.getElementById('profile-pw-new');
        const profilePwError = document.getElementById('profile-pw-error');
        const profilePwSave = document.getElementById('profile-pw-save');
        const profilePwCancel = document.getElementById('profile-pw-cancel');
        const profileWalletStatus = document.getElementById('profile-wallet-status');
        const profileWalletBtn = document.getElementById('profile-wallet-btn');
        const profileWalletError = document.getElementById('profile-wallet-error');
        const profileWalletSuccess = document.getElementById('profile-wallet-success');

        // Tracks whether the user currently has a bespoke identity —
        // determines whether the password form requires the current
        // password and whether the action button reads "Set" or
        // "Change". Refreshed every time we (re-)load profile data.
        let profileHasPassword = false;

        // Tracks whether the user currently has an ethereum identity.
        // Drives the wallet action button: "Link" when false,
        // "Unlink" when true. Refreshed alongside profileHasPassword
        // on every loadProfileData() call.
        let profileHasWallet = false;

        // Match history mode. Starts at currentMode so opening the
        // profile matches whichever mode the player is currently in;
        // toggles independently after that.
        let profileMatchMode = 'devils';

        function openProfileModal() {
            if (!currentUser) return;
            profileOverlay.classList.add('open');
            // Reset transient UI state.
            profilePwOverlay.classList.remove('open');
            profilePwError.textContent = '';
            profileWalletError.textContent = '';
            profileWalletSuccess.textContent = '';
            profilePwCurrent.value = '';
            profilePwNew.value = '';
            // Default mode toggle to whatever the player's playing.
            profileMatchMode = (currentMode === 'angels') ? 'angels' : 'devils';
            updateProfileModeButtons();
            profileMatches.innerHTML = '<div class="profile-empty">Loading…</div>';
            // Fetch in parallel.
            loadProfileData();
            loadProfileMatches();
        }
        function closeProfileModal() {
            profileOverlay.classList.remove('open');
        }

        profileClose.addEventListener('click', closeProfileModal);
        attachOverlayBackdropClose(profileOverlay, closeProfileModal);
        // Don't let pointer events on the panel reach the Phaser canvas.
        profilePanel.addEventListener('pointerdown', e => e.stopPropagation());
        profilePanel.addEventListener('touchstart', e => e.stopPropagation(), { passive: false });
        // Esc closes — but only if no other modal is open ahead of us.
        // Stacking order (closes outermost first):
        //   confirm > password > profile
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (!profileOverlay.classList.contains('open')) return;
            // Other overlays have their own Esc handlers — defer to them
            // if they're up.
            if (authOverlay.classList.contains('open')) return;
            if (confirmOverlay.classList.contains('open')) return;
            if (profilePwOverlay.classList.contains('open')) return;
            closeProfileModal();
        });
        // Password modal's own Esc handler — defers to the confirm
        // dialog when it's stacked on top (during a removal flow).
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (!profilePwOverlay.classList.contains('open')) return;
            if (confirmOverlay.classList.contains('open')) return;
            closeProfilePwModal();
        });

        menuProfileLink.addEventListener('click', openProfileModal);

        // ── Generic confirm dialog (replaces window.confirm) ──────────
        //
        // Promise-based. Returns true on confirmation, false on
        // cancel / Esc / backdrop click. Set okDanger to render the
        // OK button in red — for destructive actions.
        //
        // Usage:
        //   const ok = await showConfirm({
        //       message: 'Unlink your wallet?',
        //       okLabel: 'Unlink',
        //       okDanger: true,
        //   });
        //   if (!ok) return;
        const confirmOverlay = document.getElementById('confirm-overlay');
        const confirmPanel = document.getElementById('confirm-panel');
        const confirmMessage = document.getElementById('confirm-message');
        const confirmOk = document.getElementById('confirm-ok');
        const confirmCancel = document.getElementById('confirm-cancel');

        // Holds the currently pending Promise's resolver. We never have
        // nested confirms — one global slot is enough.
        let confirmResolver = null;

        function showConfirm({ message, okLabel = 'Confirm', okDanger = false }) {
            confirmMessage.textContent = message;
            confirmOk.textContent = okLabel;
            confirmOk.classList.toggle('danger', !!okDanger);
            confirmOverlay.classList.add('open');
            setTimeout(() => confirmOk.focus(), 0);
            return new Promise((resolve) => { confirmResolver = resolve; });
        }
        function resolveConfirm(result) {
            confirmOverlay.classList.remove('open');
            const r = confirmResolver;
            confirmResolver = null;
            if (r) r(result);
        }

        confirmOk.addEventListener('click', () => resolveConfirm(true));
        confirmCancel.addEventListener('click', () => resolveConfirm(false));
        attachOverlayBackdropClose(confirmOverlay, () => resolveConfirm(false));
        confirmPanel.addEventListener('pointerdown', e => e.stopPropagation());
        confirmPanel.addEventListener('touchstart', e => e.stopPropagation(), { passive: false });
        document.addEventListener('keydown', (e) => {
            if (!confirmOverlay.classList.contains('open')) return;
            if (e.key === 'Escape') resolveConfirm(false);
            else if (e.key === 'Enter') resolveConfirm(true);
        });

        function updateProfileModeButtons() {
            profileModeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === profileMatchMode);
            });
        }
        profileModeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (profileMatchMode === btn.dataset.mode) return;
                profileMatchMode = btn.dataset.mode;
                updateProfileModeButtons();
                // Don't reset the matches box to "Loading…" here — the
                // CSS min-height keeps the box's size stable, and the
                // existing rows are an OK placeholder for ~100ms while
                // the new mode's data arrives. The mode-button visual
                // flip (above) is the user-facing confirmation that
                // their click registered.
                loadProfileMatches();
            });
        });

        // GET /me/profile with the stored JWT. Populates the header,
        // stats grid, and account section. Also refreshes currentUser
        // (in case mmr changed since last sign-in) and the menu.
        async function loadProfileData() {
            const token = getStoredToken();
            if (!token) return;
            try {
                const res = await fetch(AUTH_WORKER_URL + '/me/profile', {
                    headers: { authorization: 'Bearer ' + token },
                });
                if (!res.ok) {
                    // 401 means our token's no good. Sign out locally so
                    // the user can re-authenticate.
                    if (res.status === 401) {
                        setStoredToken(null);
                        currentUser = null;
                        updateMenuFromAuth();
                        closeProfileModal();
                    }
                    return;
                }
                const data = await res.json();

                profileDisplayName.textContent = data.user.display_name;
                profileMmr.textContent = (data.user.mmr != null ? data.user.mmr : 1500) + ' MMR';

                profDevilsGames.textContent = data.stats.devils.games;
                profDevilsWins.textContent = data.stats.devils.wins;
                profDevilsBest.textContent = data.stats.devils.best_score != null
                    ? data.stats.devils.best_score : '–';
                profAngelsGames.textContent = data.stats.angels.games;
                profAngelsBest.textContent = data.stats.angels.best_score != null
                    ? data.stats.angels.best_score : '–';

                profileHasPassword = !!data.has_password;
                profilePwStatus.textContent = profileHasPassword ? 'Enabled' : 'Disabled';
                profilePwBtn.textContent = profileHasPassword ? 'Change' : 'Enable';

                if (data.wallet_address) {
                    // Show a short form of the address (first 6 + last 4)
                    // — full address is too long for the row. Title
                    // tooltip shows the full thing for inspection.
                    const a = data.wallet_address;
                    const short = a.slice(0, 6) + '…' + a.slice(-4);
                    profileWalletStatus.textContent = short;
                    profileWalletStatus.title = a;
                    profileHasWallet = true;
                    profileWalletBtn.textContent = 'Unlink';
                    profileWalletBtn.style.display = '';
                    // Unlinking requires having another way back in —
                    // otherwise the user would lock themselves out.
                    // Disable the button (with an explanation tooltip)
                    // until a password is set.
                    if (profileHasPassword) {
                        profileWalletBtn.disabled = false;
                        profileWalletBtn.title = '';
                    } else {
                        profileWalletBtn.disabled = true;
                        profileWalletBtn.title = 'Set a password first to enable unlinking.';
                    }
                } else {
                    profileWalletStatus.textContent = 'Not linked';
                    profileWalletStatus.title = '';
                    profileHasWallet = false;
                    profileWalletBtn.textContent = 'Link';
                    profileWalletBtn.style.display = '';
                    profileWalletBtn.disabled = false;
                    profileWalletBtn.title = '';
                }

                // Keep menu MMR in sync if it changed (e.g. just earned
                // a Devils win and reopened the profile).
                if (currentUser) {
                    currentUser.mmr = data.user.mmr;
                    updateMenuFromAuth();
                }
            } catch (_) {
                // Network blip — leave whatever placeholder text was
                // already shown. The user can close and reopen.
            }
        }

        async function loadProfileMatches() {
            const token = getStoredToken();
            if (!token) return;
            try {
                const res = await fetch(
                    AUTH_WORKER_URL + '/me/matches?mode=' + profileMatchMode + '&limit=20',
                    { headers: { authorization: 'Bearer ' + token } },
                );
                if (!res.ok) {
                    profileMatches.innerHTML =
                        '<div class="profile-empty">Couldn\'t load matches.</div>';
                    return;
                }
                const data = await res.json();
                renderProfileMatches(data.matches || [], data.mode);
            } catch (_) {
                profileMatches.innerHTML =
                    '<div class="profile-empty">Couldn\'t load matches.</div>';
            }
        }

        function renderProfileMatches(matches, mode) {
            if (!matches.length) {
                profileMatches.innerHTML =
                    '<div class="profile-empty">No matches yet.</div>';
                return;
            }
            const frag = document.createDocumentFragment();
            for (const m of matches) {
                const row = document.createElement('div');
                // mode class drives the column layout (Devils has a
                // rank column; Angels doesn't).
                row.className = 'profile-match-row ' + mode;

                const date = document.createElement('span');
                date.className = 'profile-match-date';
                // Local-time YYYY-MM-DD HH:MM. Using ISO bits in UTC
                // would be technically simpler but confusing for any
                // user not in the UTC zone; local feels right for a
                // personal match-history view.
                date.textContent = formatMatchTimestamp(m.ended_at);
                row.appendChild(date);

                // Devils only: finishing-rank column. Angels is co-op,
                // so rank is meaningless — we just omit the span.
                if (mode === 'devils') {
                    const rank = document.createElement('span');
                    rank.className = 'profile-match-rank';
                    rank.textContent = m.finishing_rank != null
                        ? ordinal(m.finishing_rank)
                        : '—';
                    row.appendChild(rank);
                }

                const score = document.createElement('span');
                score.className = 'profile-match-score';
                score.textContent = m.final_score != null ? m.final_score : '–';
                row.appendChild(score);

                frag.appendChild(row);
            }
            profileMatches.innerHTML = '';
            profileMatches.appendChild(frag);
        }

        // Local-time YYYY-MM-DD HH:MM formatter. Pads each component to
        // a fixed width so the date column stays monospace-aligned.
        function formatMatchTimestamp(ms) {
            const d = new Date(ms);
            const p = (n) => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
                + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
        }

        // 1 → "1st", 2 → "2nd", 3 → "3rd", 4 → "4th", etc.
        function ordinal(n) {
            const s = ['th', 'st', 'nd', 'rd'];
            const v = n % 100;
            return n + (s[(v - 20) % 10] || s[v] || s[0]);
        }

        // ── Set / change password ─────────────────────────────────────
        // ── Set / change / remove password ────────────────────────────
        //
        // Lives in its own modal (#profile-pw-overlay) layered on top
        // of the Profile modal. Clicking the password row's action
        // button opens it. The form has three meaningful states:
        //
        //   • Disabled → "Enable password" — only a New password field.
        //   • Enabled, no wallet → "Change password" — Current + New
        //     fields. No removal option (would lock the user out).
        //   • Enabled, wallet linked → "Change password" — Current +
        //     New fields, with New's placeholder hinting that empty
        //     means removal.
        //
        // Submit empties to the appropriate /me/set-password call;
        // empty new_password is treated by the server as a removal.

        profilePwBtn.addEventListener('click', () => {
            profilePwError.textContent = '';
            profilePwCurrent.value = '';
            profilePwNew.value = '';
            // Title and Current-password visibility key off whether
            // there's already a password.
            if (profileHasPassword) {
                profilePwTitle.textContent = 'Change password';
                profilePwCurrent.style.display = '';
            } else {
                profilePwTitle.textContent = 'Enable password';
                profilePwCurrent.style.display = 'none';
            }
            // Removal hint only when removal is actually possible:
            // the user has a password AND has another way back in
            // (currently: a linked wallet). Otherwise the placeholder
            // stays plain — leaves them no false affordance.
            profilePwNew.placeholder = (profileHasPassword && profileHasWallet)
                ? 'New password (or leave empty to remove)'
                : 'New password';
            profilePwOverlay.classList.add('open');
            setTimeout(() => {
                if (profileHasPassword) profilePwCurrent.focus();
                else profilePwNew.focus();
            }, 0);
        });

        function closeProfilePwModal() {
            profilePwOverlay.classList.remove('open');
            profilePwError.textContent = '';
            profilePwCurrent.value = '';
            profilePwNew.value = '';
        }
        profilePwCancel.addEventListener('click', closeProfilePwModal);
        profilePwClose.addEventListener('click', closeProfilePwModal);
        attachOverlayBackdropClose(profilePwOverlay, closeProfilePwModal);
        // Block pointer events from leaking through to the canvas.
        profilePwPanel.addEventListener('pointerdown', e => e.stopPropagation());
        profilePwPanel.addEventListener('touchstart', e => e.stopPropagation(), { passive: false });
        async function submitProfilePassword() {
            profilePwError.textContent = '';
            const newPw = profilePwNew.value;
            const isRemoval = newPw === '' && profileHasPassword;

            // Client-side guard: don't submit a removal that the server
            // will just reject. Show the lock-out warning inline so
            // there's no popup over a popup.
            if (isRemoval && !profileHasWallet) {
                profilePwError.textContent =
                    'Link a wallet first — otherwise removing your password would lock you out of this account.';
                return;
            }

            // The user has no password and submitted an empty new
            // one — there's nothing to do. Tell them rather than
            // silently no-op'ing.
            if (newPw === '' && !profileHasPassword) {
                profilePwError.textContent = 'Password required.';
                return;
            }

            const body = { new_password: newPw };
            if (profileHasPassword) {
                // Required by the server for both change AND removal.
                if (!profilePwCurrent.value) {
                    profilePwError.textContent = 'Current password required.';
                    return;
                }
                body.current_password = profilePwCurrent.value;
            }

            // Destructive — confirm before hitting the server. Using
            // the styled in-modal confirm (not window.confirm) so the
            // visual is consistent with the rest of the UI.
            if (isRemoval) {
                const ok = await showConfirm({
                    message: 'Remove your password? You\'ll need your wallet to sign in afterwards.',
                    okLabel: 'Remove password',
                    okDanger: true,
                });
                if (!ok) return;
            }

            profilePwSave.disabled = true;
            try {
                const token = getStoredToken();
                const res = await fetch(AUTH_WORKER_URL + '/me/set-password', {
                    method: 'POST',
                    headers: {
                        'content-type': 'application/json',
                        'authorization': 'Bearer ' + token,
                    },
                    body: JSON.stringify(body),
                });
                const data = await res.json();
                if (res.ok && data.ok) {
                    closeProfilePwModal();
                    // Refresh the whole profile so both the password
                    // row (Enabled/Disabled, Change/Enable button) and
                    // the wallet button's disabled state stay
                    // consistent — adding a password unlocks Unlink;
                    // removing a password locks it.
                    loadProfileData();
                } else {
                    // Server's `message` field already carries a clear
                    // explanation for codes like no_other_auth_method;
                    // friendlyAuthError falls back to it.
                    profilePwError.textContent = friendlyAuthError(data);
                }
            } catch (_) {
                profilePwError.textContent = 'Network error.';
            } finally {
                profilePwSave.disabled = false;
            }
        }
        profilePwSave.addEventListener('click', submitProfilePassword);
        [profilePwCurrent, profilePwNew].forEach(el => {
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') submitProfilePassword();
            });
        });

        // ── Link / unlink wallet ──────────────────────────────────────
        // One button, two behaviours depending on whether a wallet is
        // currently linked. The disabled-with-tooltip state for the
        // "must set a password first" case is handled in loadProfileData
        // by toggling profileWalletBtn.disabled.
        profileWalletBtn.addEventListener('click', () => {
            if (profileHasWallet) {
                unlinkWallet();
            } else {
                linkWallet();
            }
        });

        async function linkWallet() {
            profileWalletError.textContent = '';
            profileWalletSuccess.textContent = '';
            profileWalletBtn.disabled = true;
            try {
                const { address, message, signature } = await performWalletSignature();
                const token = getStoredToken();
                const res = await fetch(AUTH_WORKER_URL + '/me/link-wallet/verify', {
                    method: 'POST',
                    headers: {
                        'content-type': 'application/json',
                        'authorization': 'Bearer ' + token,
                    },
                    body: JSON.stringify({ message, signature, address }),
                });
                const data = await res.json();
                if (res.ok && data.ok) {
                    profileWalletSuccess.textContent = 'Wallet linked.';
                    // Refresh the profile so the wallet row updates to
                    // show the address and the button flips to Unlink.
                    loadProfileData();
                } else {
                    profileWalletError.textContent = friendlyLinkWalletError(data);
                }
            } catch (err) {
                profileWalletError.textContent = err.message || 'Wallet linking failed.';
            } finally {
                // loadProfileData() will set the correct disabled state
                // on success; this re-enables for the failure path.
                if (!profileHasWallet) profileWalletBtn.disabled = false;
            }
        }

        async function unlinkWallet() {
            profileWalletError.textContent = '';
            profileWalletSuccess.textContent = '';
            const ok = await showConfirm({
                message: 'Unlink your wallet from this account? You can link it again later.',
                okLabel: 'Unlink',
                okDanger: true,
            });
            if (!ok) return;
            profileWalletBtn.disabled = true;
            try {
                const token = getStoredToken();
                const res = await fetch(AUTH_WORKER_URL + '/me/unlink-wallet', {
                    method: 'POST',
                    headers: { 'authorization': 'Bearer ' + token },
                });
                const data = await res.json();
                if (res.ok && data.ok) {
                    profileWalletSuccess.textContent = 'Wallet unlinked.';
                    loadProfileData();
                } else {
                    profileWalletError.textContent = friendlyUnlinkWalletError(data);
                    profileWalletBtn.disabled = false;
                }
            } catch (_) {
                profileWalletError.textContent = 'Network error.';
                profileWalletBtn.disabled = false;
            }
        }

        function friendlyLinkWalletError(result) {
            if (!result) return 'Wallet linking failed.';
            switch (result.error) {
                case 'already_linked_to_you': return 'That wallet is already linked to your account.';
                case 'address_linked_elsewhere': return 'That wallet is linked to another account.';
                case 'nonce_invalid_or_expired': return 'Signing took too long. Please try again.';
                case 'invalid_signature':
                case 'signature_mismatch':
                case 'address_mismatch': return 'Signature didn\'t verify.';
                default: return friendlyWalletError(result);
            }
        }

        function friendlyUnlinkWalletError(result) {
            if (!result) return 'Wallet unlinking failed.';
            switch (result.error) {
                case 'no_other_auth_method':
                    return result.message || 'Set a password first — unlinking would lock you out.';
                default:
                    return 'Wallet unlinking failed: ' + (result.error || 'unknown');
            }
        }

        // ── Leaderboard ───────────────────────────────────────────────
        const leaderboardOverlay = document.getElementById('leaderboard-overlay');
        const leaderboardRows = document.getElementById('leaderboard-rows');
        const leaderboardClose = document.getElementById('leaderboard-close');
        const menuLeaderboardLink = document.getElementById('menu-leaderboard-link');
        const leaderboardModeBtns = document.querySelectorAll('.leaderboard-mode-btn');
        // Which mode is currently displayed in the leaderboard panel. Falls
        // back to 'devils' until the user opens it (or picks a mode in-game).
        let leaderboardMode = 'devils';

        function updateLeaderboardModeButtons() {
            leaderboardModeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === leaderboardMode);
            });
        }

        function renderLeaderboardEmpty(text) {
            const d = document.createElement('div');
            d.className = 'leaderboard-empty';

        function renderLeaderboard(players) {
            if (!players || players.length === 0) {
                renderLeaderboardEmpty('No players yet.');
                return;
            }
            const rows = players.map(p => {
                const row = document.createElement('div');
                const isMe = currentUser && currentUser.id === p.id;
                row.className = 'leaderboard-row' + (isMe ? ' me' : '');
                const rankEl = document.createElement('span');
                rankEl.className = 'leaderboard-rank';
                // Server provides rank — dense for Angels (teammates share),
                // sequential for Devils. We just display it.
                rankEl.textContent = (p.rank != null ? p.rank : '?') + '.';
                const name = document.createElement('span');
                name.className = 'leaderboard-name';
                name.textContent = p.display_name;
                const score = document.createElement('span');
                score.className = 'leaderboard-mmr';
                score.textContent = p.score;
                row.appendChild(rankEl);
                row.appendChild(name);
                row.appendChild(score);
                return row;
            });
            leaderboardRows.replaceChildren(...rows);
        }
        async function openLeaderboard() {
            // First-open default: match the mode the player is currently in.
            // Subsequent opens preserve whatever toggle the user last chose.
            if (!leaderboardOverlay.classList.contains('open') && currentMode) {
                leaderboardMode = currentMode;
            }
            updateLeaderboardModeButtons();
            leaderboardOverlay.classList.add('open');
            renderLeaderboardEmpty('Loading…');
            try {
                const res = await fetch(AUTH_WORKER_URL + '/stats/leaderboard?mode=' + leaderboardMode);
                const data = await res.json();
                renderLeaderboard(data.players || []);
            } catch (err) {
                renderLeaderboardEmpty('Failed to load.');
            }
        }
        function closeLeaderboard() {
            leaderboardOverlay.classList.remove('open');
        }

        leaderboardClose.addEventListener('click', closeLeaderboard);
        leaderboardModeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.dataset.mode === leaderboardMode) return;   // no-op
                leaderboardMode = btn.dataset.mode;
                updateLeaderboardModeButtons();
                // Refetch with the new mode. Keep the overlay open.
                renderLeaderboardEmpty('Loading…');
                fetch(AUTH_WORKER_URL + '/stats/leaderboard?mode=' + leaderboardMode)
                    .then(r => r.json())
                    .then(d => renderLeaderboard(d.players || []))
                    .catch(() => renderLeaderboardEmpty('Failed to load.'));
            });
        });
        // Mobile only: click on backdrop closes (web has no clickable backdrop).
        attachOverlayBackdropClose(leaderboardOverlay, closeLeaderboard);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && leaderboardOverlay.classList.contains('open')) {
                closeLeaderboard();

        });
        leaderboardOverlay.addEventListener('pointerdown', e => e.stopPropagation());
        leaderboardOverlay.addEventListener('touchstart', e => e.stopPropagation(), { passive: false });

        // ── Mode picker (ANGELS / DEVILS) ─────────────────────────────
        const modePickerOverlay = document.getElementById('mode-picker-overlay');
        const menuSwitchModeLink = document.getElementById('menu-switch-mode-link');
        const menuCurrentModeEl = document.getElementById('menu-current-mode');
        // The picker is non-dismissable on first load (you have to pick) and
        // dismissable when re-opened from the menu (you might change your
        // mind, in which case nothing happens and your session continues).
        let modePickerCancelable = false;
        // True while the local player is committed to a running round.
        // Mode switching is blocked in that window — both client-side
        // (disabled link) and server-side (mid-round disconnects commit
        // the player as a ghost rather than letting them slip out).
        let myInActiveRound = false;

        function showModePicker(cancelable) {
            modePickerCancelable = !!cancelable;
            modePickerOverlay.classList.remove('hidden');
        }
        function hideModePicker() {
            modePickerOverlay.classList.add('hidden');
        }

            if (menuCurrentModeEl) {
                menuCurrentModeEl.textContent = (currentMode || '').toUpperCase();
            }
            if (menuSwitchModeLink) {
                menuSwitchModeLink.classList.toggle('disabled', myInActiveRound);
            }
        }
        function selectMode(mode) {
            // Never switch mid-round, even if the link was reachable somehow.
            if (myInActiveRound) {
                hideModePicker();
                return;
            }
            hideModePicker();
            // No-op if they picked the same mode and we already have a live
            // connection — saves the reconnect churn.
            if (mode === currentMode && ws && ws.readyState === WebSocket.OPEN) {
                return;
            }
            currentMode = mode;
            updateModeIndicator();
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            }
            connect();
        }

        // Skull emoji label for the spikes-line proximity indicator.
        // Replaces the previous "SPIKES" string for a more flavorful pictogram

        const SPIKES_LABEL = '💀';

        // Status is now silent (UI elements handle display)
        function setStatus(t) { /* no-op: status displayed via DOM elements */ }

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = wsProtocol + '//' + window.location.host;

        let ws = null;
        let mySessionId = null;
        let pendingWorldInit = null;
        let pendingSnapshots = [];
        let sceneReady = false;
        let currentMode = null;     // 'devils' or 'angels' once the user picks

        function connect() {
            // Bail until the user has picked a mode. The mode picker click
            // handler will call us back via selectMode().
            if (!currentMode) return;
            setStatus('connecting...');
            // If we have a stored session token, send it on the WS URL. The
            // server forwards it to the Worker's /auth/verify endpoint and
            // attaches the resolved user to this connection. Invalid/expired
            // tokens fall through to anonymous play; we clear them on receipt
            // of a welcome message with user=null.
            const token = getStoredToken();
            const params = ['mode=' + currentMode];
            if (token) params.push('token=' + encodeURIComponent(token));
            const fullUrl = wsUrl + '/?' + params.join('&');
            ws = new WebSocket(fullUrl);
            ws.addEventListener('open', () => setStatus('connected'));
            ws.addEventListener('message', (event) => {
                let msg;
                try { msg = JSON.parse(event.data); } catch { return; }
                if (msg.type === 'welcome') {
                    mySessionId = msg.sessionId;
                    if (msg.mode) {
                        currentMode = msg.mode;
                        updateModeIndicator();
                    }
                    if (msg.user) {
                        // Server verified our token and tagged this session
                        // with the user. Trust its data.
                        currentUser = msg.user;
                    }
                    // If msg.user is null, do NOT clear our stored token or
                    // currentUser — the server might just be in anon mode
                    // (no AUTH_WORKER_URL env var). Token validity is decided
                    // by ensureAuthState() talking to the Worker directly.
                    updateMenuFromAuth();
                } else if (msg.type === 'world_init') {
                    if (sceneReady && window.__scene) window.__scene.applyWorldInit(msg);
                    else pendingWorldInit = msg;
                } else if (msg.type === 'snapshot') {
                    if (sceneReady && window.__scene) window.__scene.applySnapshot(msg);
                    else pendingSnapshots.push(msg);
                } else if (msg.type === 'mmr_update') {
                    if (sceneReady && window.__scene) window.__scene.applyMmrUpdate(msg.changes);
                    // If the leaderboard is open, refetch — a match just
                    // completed, so the data is stale. The Worker has
                    // already finished writing by the time this message
                    // arrives, so no extra delay needed.
                    if (leaderboardOverlay.classList.contains('open')) {
                        openLeaderboard();
                    }
                }
            });
            ws.addEventListener('close', () => setStatus('disconnected'));
            ws.addEventListener('error', (e) => { console.error('ws error', e); setStatus('error'); });
        }

        function sendFlap() {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'flap' }));

            spawnPlaceholderSideWalls() {
                if (this.sideWallSprites.length > 0) return;   // already populated
                const wt = WALL_THICKNESS;
                const size = SIDE_WALL_DISPLAY_SIZE;
                // Match the server's wall pattern EXACTLY: floor-aligned to
                // multiples of WALL_THICKNESS from a fixed grid. Same start
                // point (CANVAS_HEIGHT + 200) and same step. When the real
                // world_init arrives, applyWorldInit destroys these and the
                // server's segments spawn at identical y values — no jolt,
                // no overlap, no off-by-one alignment drift.
                const startY = CANVAS_HEIGHT + 200;
                const firstY = Math.floor(startY / wt) * wt;
                for (let y = firstY; y > -wt; y -= wt) {
                    const left = this.add.image(wt / 2, y, 'block')
                        .setDisplaySize(size, size).setDepth(2);
